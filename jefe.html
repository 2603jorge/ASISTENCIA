<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriCactus Admin V4.2 - Historial Permanente</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #22c55e; --blue: #3b82f6; --warn: #f59e0b; --danger: #ef4444; --purple: #a855f7; --gray: #64748b; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background-color: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .kpi-value { font-size: 2em; font-weight: bold; color: var(--accent); }
        .kpi-label { font-size: 0.8em; color: var(--gray); text-transform: uppercase; }
        .btn { padding: 12px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; color: white; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
        .btn-purple { background: var(--purple); }
        .btn-blue { background: var(--blue); }
        .btn-danger { background: var(--danger); }
        .progress-bar-bg { background: #334155; height: 10px; border-radius: 5px; margin: 8px 0; }
        .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 5px; transition: width 0.5s; }
        #scannerModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #reader { width: 90%; max-width: 400px; border: 4px solid var(--accent); border-radius: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 style="margin:0; color:var(--accent);">AgriCactus Admin V4.2 🚀</h1>
            <small id="status-history" style="color:var(--gray);">Historial de hoy: 0 registros cargados</small>
        </div>
        <div style="display:flex; gap: 8px;">
            <button class="btn btn-purple" onclick="startScanner()">📷 QR</button>
            <label for="jsonInput" class="btn btn-blue">📂 AÑADIR</label>
            <input type="file" id="jsonInput" style="display:none" multiple accept=".json" onchange="procesarArchivosJSON()">
            <button class="btn btn-danger" onclick="limpiarTodo()">🗑️ BORRAR</button>
        </div>
    </div>

    <div id="dashboard">
        <div class="grid-kpi">
            <div class="card"><div class="kpi-label">Cuadrillas</div><div class="kpi-value" id="kpi_crews">0</div></div>
            <div class="card"><div class="kpi-label">Terminadas</div><div class="kpi-value" id="kpi_rows">0</div></div>
            <div class="card"><div class="kpi-label">Pendientes</div><div class="kpi-value" style="color:var(--warn);" id="kpi_pending">0</div></div>
            <div class="card"><div class="kpi-label">Eficiencia</div><div class="kpi-value" style="color:var(--blue);" id="kpi_efficiency">0%</div></div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h3 style="margin-top:0;">🏁 Avance por Supervisor</h3>
            <div id="progress_list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;">
                <p style="color:var(--gray);">No hay datos en el historial.</p>
            </div>
        </div>

        <div class="grid-charts">
            <div class="card"><h3>📊 Rendimiento (Min/Hilera)</h3><canvas id="chartActivityComp"></canvas></div>
            <div class="card"><h3>🏆 Ranking</h3><table id="tableRanking" style="width:100%; font-size:12px; border-collapse:collapse;"><thead><tr style="color:var(--accent); text-align:left;"><th>Sup.</th><th>Act.</th><th>Min/H</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>

    <div id="scannerModal">
        <div id="reader"></div>
        <button class="btn btn-danger" onclick="stopScanner()" style="margin-top:20px;">CERRAR</button>
    </div>

    <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        let jsonData = JSON.parse(localStorage.getItem('agri_history_v4')) || [];
        let html5QrcodeScanner = null;

        function procesarArchivosJSON() {
            const files = document.getElementById('jsonInput').files;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => { try { validarYAñadir(JSON.parse(e.target.result)); } catch(err) {} };
                reader.readAsText(file);
            });
            document.getElementById('jsonInput').value = "";
        }

        function validarYAñadir(nuevo) {
            // Evitar duplicados por UID de sesión
            const idUnico = nuevo.sesiones[0]?.uid || nuevo.config.resp + nuevo.config.supId;
            if (jsonData.some(e => (e.sesiones[0]?.uid || e.config.resp + e.config.supId) === idUnico)) {
                console.warn("Registro ya existente.");
                return;
            }
            jsonData.push(nuevo);
            guardarYActualizar();
        }

        function guardarYActualizar() {
            localStorage.setItem('agri_history_v4', JSON.stringify(jsonData));
            actualizarDashboard();
        }

        function limpiarTodo() {
            if(confirm("¿Borrar historial completo?")) {
                jsonData = [];
                localStorage.removeItem('agri_history_v4');
                actualizarDashboard();
            }
        }

        function actualizarDashboard() {
            const list = document.getElementById('progress_list');
            const ranking = document.querySelector('#tableRanking tbody');
            list.innerHTML = jsonData.length ? "" : '<p style="color:var(--gray);">No hay datos.</p>';
            ranking.innerHTML = "";
            
            let tAssigned = 0, tFinished = 0, stats = [], activities = {};

            jsonData.forEach(data => {
                const sup = data.config.resp, act = data.config.supAct || "N/A";
                let sAssigned = 0; data.sesiones.forEach(s => sAssigned += (s.fin - s.inicio + 1));
                let sFinished = data.avance.filter(a => a.fin !== null).length;
                let pct = sAssigned > 0 ? Math.round((sFinished / sAssigned) * 100) : 0;
                
                tAssigned += sAssigned; tFinished += sFinished;

                list.innerHTML += `<div class="card" style="padding:10px; border-left: 4px solid ${pct > 80 ? 'var(--accent)' : 'var(--warn)'}">
                    <div style="display:flex; justify-content:space-between; font-size:12px;"><b>${sup}</b> <span>${pct}%</span></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
                    <small style="color:var(--gray); font-size:10px;">${act} (${sFinished}/${sAssigned})</small></div>`;

                let tMin = 0;
                data.avance.forEach(a => { if(a.fin) {
                    let d = (new Date("2000/01/01 " + a.fin) - new Date("2000/01/01 " + a.inicio)) / 60000;
                    if(d > 0 && d < 200) tMin += d;
                }});
                let avg = sFinished > 0 ? (tMin / sFinished).toFixed(1) : 0;
                stats.push({ sup, act, avg });
                if(!activities[act]) activities[act] = []; activities[act].push({ sup, avg });
            });

            document.getElementById('kpi_crews').innerText = jsonData.length;
            document.getElementById('kpi_rows').innerText = tFinished;
            document.getElementById('kpi_pending').innerText = tAssigned - tFinished;
            document.getElementById('kpi_efficiency').innerText = (tAssigned > 0 ? Math.round((tFinished / tAssigned) * 100) : 0) + "%";
            document.getElementById('status-history').innerText = `Historial de hoy: ${jsonData.length} cuadrillas cargadas`;

            renderRanking(stats);
            renderChart(activities);
        }

        function renderRanking(stats) {
            const tbody = document.querySelector('#tableRanking tbody');
            stats.sort((a,b) => a.avg - b.avg).forEach(s => {
                tbody.innerHTML += `<tr style="border-bottom:1px solid #334155"><td style="padding:5px">${s.sup}</td><td>${s.act}</td><td style="font-weight:bold; color:var(--accent)">${s.avg}m</td></tr>`;
            });
        }

        let myChart = null;
        function renderChart(activities) {
            const ctx = document.getElementById('chartActivityComp').getContext('2d');
            if(myChart) myChart.destroy();
            let labels = Object.keys(activities), datasets = [];
            labels.forEach((act, i) => {
                activities[act].forEach((item, j) => {
                    datasets.push({ label: item.sup, data: labels.map(l => l === act ? item.avg : 0), backgroundColor: ['#3b82f6','#22c55e','#a855f7','#f59e0b','#ef4444'][j%5] });
                });
            });
            myChart = new Chart(ctx, { type: 'bar', data: { labels, datasets }, options: { plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }});
        }

        function startScanner() {
            document.getElementById('scannerModal').style.display = 'flex';
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
            html5QrcodeScanner.render(onScanSuccess);
        }
        function stopScanner() { if(html5QrcodeScanner) html5QrcodeScanner.clear(); document.getElementById('scannerModal').style.display = 'none'; }
        function onScanSuccess(t) { try { const j = JSON.parse(t.substring(t.indexOf('{'), t.lastIndexOf('}') + 1)); document.getElementById('beep').play(); validarYAñadir(j); stopScanner(); } catch(e) { alert("QR No válido"); } }

        window.onload = actualizarDashboard;
    </script>
</body>
</html>
