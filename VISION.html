<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V5.6 - Extractor Inteligente</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1565c0; --accent: #00e676; --dark: #0f172a; --card: #1e293b; --text: #f1f5f9; --warn: #f59e0b; }
        body { font-family: -apple-system, sans-serif; background: var(--dark); color: var(--text); padding: 10px; margin: 0; }
        .container { max-width: 100%; margin: auto; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        #reader { width: 100% !important; max-width: 300px; margin: 0 auto 10px auto; border-radius: 12px; overflow: hidden; border: 2px solid var(--primary); background: #000; min-height: 200px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 8px; font-size: 12px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-blue { background: var(--primary); }
        .btn-green { background: var(--accent); color: #000; }
        .btn-warn { background: var(--warn); color: #000; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; box-sizing: border-box; }
        .flex-row { display: flex; gap: 8px; }
        .hidden { display: none; }
        .table-wrapper { overflow-x: auto; background: #0f172a; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #334155; }
        th { background: #1e293b; color: var(--accent); position: sticky; top: 0; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="text-align:center; color: var(--primary); margin: 10px 0;">📋 Extractor V5.6 PRO</h3>

    <div class="card">
        <div id="reader"></div>
        <p id="instruccion_camara" style="text-align:center; font-size:11px; color:var(--warn); margin:0;">Cargando cámara...</p>
    </div>

    <div class="flex-row" style="margin-bottom: 10px;">
        <button class="btn btn-blue" onclick="cambiarSeccion('sec_asistencia')">📋 TABLA</button>
        <button class="btn btn-blue" onclick="cambiarSeccion('sec_escaner')">🆔 INDIVIDUAL</button>
        <button class="btn btn-blue" onclick="cambiarSeccion('sec_catalogos')">📂 CATS</button>
    </div>

    <div id="sec_escaner" class="hidden">
        <div class="card" style="border-left: 5px solid var(--warn);">
            <h4 style="margin:0 0 10px 0; color:var(--warn);">Asignación Individual</h4>
            <div class="flex-row">
                <input type="text" id="manual_id" placeholder="ID (Escanee o escriba)">
                <input type="number" id="manual_lineas" value="1" style="width:70px;">
            </div>
            <input type="text" id="in_jor" list="list_jor" placeholder="Jornada...">
            <input type="text" id="in_act" list="list_act" placeholder="Actividad...">
            <input type="text" id="in_cua" list="list_cua" placeholder="Cuadro...">
            <button class="btn btn-warn" onclick="registrarIndividual()">✅ AGREGAR A LA TABLA</button>
        </div>
    </div>

    <div id="sec_asistencia">
        <div class="card">
            <button class="btn btn-blue" onclick="document.getElementById('fileInput').click()">📂 CARGAR REPORTE .JSON</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="procesarArchivo(this)">
            
            <div class="table-wrapper">
                <table id="tablaAsistencia">
                    <thead><tr><th>ID</th><th>ACTIVIDAD</th><th>CUADRO</th><th>L</th><th>X</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn btn-green" onclick="descargarCSV()" style="margin-top:15px;">💾 DESCARGAR EXCEL</button>
            <button class="btn" style="background:#c62828" onclick="limpiarDatos()">🗑️ BORRAR REPORTE</button>
        </div>
    </div>

    <div id="sec_catalogos" class="card hidden">
        <h4>📦 Catálogos del Sistema</h4>
        <p style="font-size:10px; color:#aaa;">Se actualizan solos al cargar un .JSON</p>
        <textarea id="csv_cuadros" placeholder="Cuadros..." rows="3"></textarea>
        <textarea id="csv_act" placeholder="Actividades..." rows="3"></textarea>
        <textarea id="csv_jor" placeholder="Jornadas..." rows="3"></textarea>
        <button class="btn btn-green" onclick="guardarCatalogos()">💾 GUARDAR MANUALMENTE</button>
    </div>
</div>

<datalist id="list_jor"></datalist><datalist id="list_act"></datalist><datalist id="list_cua"></datalist>

<script>
    let BASE_DATOS = JSON.parse(localStorage.getItem('ext_v56_data')) || [];
    let CATS = JSON.parse(localStorage.getItem('ext_v56_cats')) || { cuadros: [], actividades: [], jornadas: [] };
    let seccionActual = 'sec_asistencia';

    const normalizar = (s) => String(s || "").replace(/[.,\s]/g, "").toUpperCase();
    const scanner = new Html5Qrcode("reader");

    function onScanSuccess(text) {
        if (seccionActual === 'sec_asistencia') {
            try {
                const json = JSON.parse(text);
                procesarJSON(json);
                alert("Reporte escaneado con éxito ✅");
            } catch(e) { 
                alert("Error: El código no parece ser un reporte JSON válido."); 
            }
        } else {
            document.getElementById('manual_id').value = text.trim();
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
        }
    }

    scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 200 }, onScanSuccess);

    function procesarArchivo(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const json = JSON.parse(e.target.result);
                procesarJSON(json);
                alert("Archivo procesado con éxito ✅");
            } catch(err) { alert("Error: El archivo no es un JSON válido."); }
        };
        reader.readAsText(input.files[0]);
    }

    function procesarJSON(json) {
        // 1. AUTO-ACTUALIZAR CATÁLOGOS SI VIENEN EN EL JSON
        if (json.catalogos) {
            CATS = json.catalogos;
            localStorage.setItem('ext_v56_cats', JSON.stringify(CATS));
            actualizarSugerencias();
            // Actualizar áreas de texto en pestaña CATS
            document.getElementById('csv_cuadros').value = CATS.cuadros.map(c => `${c.id},${c.nombre}`).join('\n');
            document.getElementById('csv_act').value = CATS.actividades.map(a => `${a.id},${a.desc}`).join('\n');
            document.getElementById('csv_jor').value = CATS.jornadas.map(j => `${j.id},${j.desc}`).join('\n');
        }

        const avance = json.avance || [];
        const conf = json.config || {};
        const sesiones = json.sesiones || [];

        avance.forEach(a => {
            // FALLBACK DE ACTIVIDAD: Si el avance no trae actividad, busca en la sesión o en la config general
            let nombreAct = a.supAct;
            if (!nombreAct || nombreAct === "") {
                const ses = sesiones.find(s => s.uid === a.cuadroUid);
                nombreAct = (ses && ses.act) ? ses.act : conf.supAct;
            }

            const actD = CATS.actividades.find(ac => normalizar(ac.desc) === normalizar(nombreAct)) || {id: "N/A"};
            const cuaD = CATS.cuadros.find(cu => normalizar(cu.nombre) === normalizar(a.nomCuadro)) || {id: "N/A"};
            const jorD = CATS.jornadas.find(jo => normalizar(jo.desc) === normalizar(conf.jornada)) || {id: "N/A"};

            actualizarDB({
                credencial: a.obrero,
                id_act: actD.id,
                name_act: nombreAct || "SIN ACT",
                id_cuadro: cuaD.id,
                cuadro: a.nomCuadro || "S/C",
                id_jor: jorD.id,
                desc_jor: conf.jornada || "N/A",
                lineas: 1
            });
        });
        render();
    }

    function actualizarDB(n) {
        let idx = BASE_DATOS.findIndex(r => r.credencial === n.credencial);
        if (idx > -1) { 
            BASE_DATOS[idx].lineas += n.lineas;
            // Actualizamos actividad/cuadro al más reciente
            BASE_DATOS[idx].name_act = n.name_act;
            BASE_DATOS[idx].cuadro = n.cuadro;
        } else { 
            BASE_DATOS.push(n); 
        }
        localStorage.setItem('ext_v56_data', JSON.stringify(BASE_DATOS));
    }

    function registrarIndividual() {
        const id = document.getElementById('manual_id').value.trim();
        const nJor = document.getElementById('in_jor').value;
        const nAct = document.getElementById('in_act').value;
        const nCua = document.getElementById('in_cua').value;
        const lineas = parseInt(document.getElementById('manual_lineas').value) || 0;

        if(!id || !nAct || !nCua) return alert("Faltan datos para el registro.");

        const jObj = CATS.jornadas.find(j => normalizar(j.desc) === normalizar(nJor)) || {id: "N/A"};
        const aObj = CATS.actividades.find(a => normalizar(a.desc) === normalizar(nAct)) || {id: "N/A"};
        const cObj = CATS.cuadros.find(c => normalizar(c.nombre) === normalizar(nCua)) || {id: "N/A"};

        actualizarDB({
            credencial: id, id_act: aObj.id, name_act: nAct,
            id_cuadro: cObj.id, cuadro: nCua, id_jor: jObj.id, desc_jor: nJor, lineas: lineas
        });
        
        document.getElementById('manual_id').value = "";
        alert("Trabajador registrado ✅");
        render();
    }

    function render() {
        const tbody = document.querySelector('#tablaAsistencia tbody');
        tbody.innerHTML = BASE_DATOS.map(d => `
            <tr>
                <td>${d.credencial}</td>
                <td>${d.name_act}</td>
                <td>${d.cuadro}</td>
                <td><b>${d.lineas}</b></td>
                <td><button onclick="borrar('${d.credencial}')" style="background:none; border:none; color:red; cursor:pointer;">❌</button></td>
            </tr>
        `).join('');
    }

    function cambiarSeccion(id) {
        seccionActual = id;
        document.getElementById('sec_catalogos').classList.add('hidden');
        document.getElementById('sec_asistencia').classList.add('hidden');
        document.getElementById('sec_escaner').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('instruccion_camara').innerText = (id === 'sec_asistencia') ? "Escanee Reporte QR" : (id === 'sec_escaner') ? "Escanee Credencial ID" : "Cámara activa";
    }

    function actualizarSugerencias() {
        document.getElementById('list_jor').innerHTML = CATS.jornadas.map(j => `<option value="${j.desc}">`).join('');
        document.getElementById('list_act').innerHTML = CATS.actividades.map(a => `<option value="${a.desc}">`).join('');
        document.getElementById('list_cua').innerHTML = CATS.cuadros.map(c => `<option value="${c.nombre}">`).join('');
    }

    function descargarCSV() {
        let csv = "\uFEFFCREDENTIAL,ID_ACT,NAME_ACT,ID_CUA,CUADRO,ID_JOR,DESC_JOR,TOTAL_LINEAS\n";
        BASE_DATOS.forEach(d => { csv += `${d.credencial},${d.id_act},${d.name_act},${d.id_cuadro},${d.cuadro},${d.id_jor},${d.desc_jor},${d.lineas}\n`; });
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `REPORTE_ASISTENCIA_${new Date().toLocaleDateString()}.csv`;
        link.click();
    }

    function borrar(id) { if(confirm("¿Eliminar registro?")) { BASE_DATOS = BASE_DATOS.filter(r => r.credencial !== id); render(); localStorage.setItem('ext_v56_data', JSON.stringify(BASE_DATOS)); } }
    function limpiarDatos() { if(confirm("¿Borrar todo el reporte?")) { BASE_DATOS = []; localStorage.removeItem('ext_v56_data'); render(); } }
    function guardarCatalogos() { alert("Los catálogos se actualizan solos al cargar un .JSON. Si pegaste texto manual, refresca la página para procesarlos."); }

    window.onload = () => { actualizarSugerencias(); render(); };
</script>
</body>
</html>
