<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V5.7 - Concentrador de Asistencia</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1565c0; --accent: #00e676; --dark: #0f172a; --card: #1e293b; --text: #f1f5f9; --warn: #f59e0b; }
        body { font-family: -apple-system, sans-serif; background: var(--dark); color: var(--text); padding: 5px; margin: 0; }
        .container { max-width: 100%; margin: auto; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
        #reader { width: 100% !important; max-width: 320px; margin: 0 auto 10px auto; border-radius: 12px; overflow: hidden; border: 2px solid var(--primary); background: #000; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 6px; font-size: 12px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-blue { background: var(--primary); }
        .btn-green { background: var(--accent); color: #000; }
        .btn-warn { background: var(--warn); color: #000; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 14px; box-sizing: border-box; }
        .flex-row { display: flex; gap: 5px; }
        .hidden { display: none; }
        .table-wrapper { overflow-x: auto; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; min-width: 700px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; border-right: 1px solid #1e293b; }
        th { background: #1e293b; color: var(--accent); font-weight: bold; }
        .row-sup { background: rgba(21, 101, 192, 0.2); }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="padding: 5px;">
        <div id="reader"></div>
        <p id="cam-info" style="text-align:center; font-size:10px; color:var(--warn); margin:2px;">Cámara modo: Concentrador</p>
    </div>

    <div class="flex-row">
        <button class="btn btn-blue" onclick="nav('sec_asistencia')">📋 TABLA</button>
        <button class="btn btn-blue" onclick="nav('sec_escaner')">🆔 ESCANEO</button>
        <button class="btn btn-blue" onclick="nav('sec_catalogos')">📂 CATS</button>
    </div>

    <div id="sec_escaner" class="hidden">
        <div class="card" style="border-top: 3px solid var(--warn);">
            <div class="flex-row">
                <input type="text" id="manual_id" placeholder="ID Credencial">
                <input type="number" id="manual_lineas" value="1" style="width:60px;">
            </div>
            <input type="text" id="in_jor" list="list_jor" placeholder="Jornada">
            <input type="text" id="in_act" list="list_act" placeholder="Actividad">
            <input type="text" id="in_cua" list="list_cua" placeholder="Cuadro">
            <button class="btn btn-warn" onclick="registrarManual()">➕ AGREGAR AL CONCENTRADO</button>
        </div>
    </div>

    <div id="sec_asistencia">
        <div class="card" style="background: #1e293b; border: 1px solid var(--accent); margin-top: 5px;">
            <label style="color: var(--accent); font-weight: bold;">💰 PRECIO POR PLANTA ($)</label>
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                <span style="font-size: 20px;">$</span>
                <input type="number" id="precio_dinamico" value="0.00" step="0.01" 
                       oninput="render()" 
                       style="margin-bottom: 0; border-color: var(--accent); font-size: 20px; font-weight: bold; color: #00e676;">
            </div>
            <p style="font-size: 10px; color: #aaa; margin: 3px 0 0 0;">* Cambia el valor para recalcular el pago automáticamente.</p>
        </div>

        <div class="card">
            <button class="btn btn-blue" onclick="document.getElementById('fileInput').click()">📂 CARGAR ARCHIVO .JSON</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="procesarArchivo(this)">
            
            <div class="table-wrapper">
                <table id="tablaMaster">
                    <thead>
                        <tr>
                            <th>CREDENTIAL</th>
                            <th>ID_ACT</th>
                            <th>NAME_ACT</th>
                            <th>ID_CUA</th>
                            <th>CUADRO</th>
                            <th>ID_JOR</th>
                            <th>DESC_JOR</th>
                            <th>LÍNEAS</th>
                            <th>PLANTAS</th>
                            <th style="background: #d32f2f; color: white;">TOTAL PAGO ($)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn btn-green" onclick="descargarExcel()" style="margin-top:10px;">💾 DESCARGAR REPORTE (EXCEL)</button>
            <button class="btn" style="background:#c62828" onclick="borrarTodo()">🗑️ LIMPIAR TODO</button>
        </div>
    </div>

    <div id="sec_catalogos" class="card hidden">
        <h4>📦 Catálogos Activos</h4>
        <textarea id="cat_cua" placeholder="Cuadros..." rows="2"></textarea>
        <textarea id="cat_act" placeholder="Actividades..." rows="2"></textarea>
        <textarea id="cat_jor" placeholder="Jornadas..." rows="2"></textarea>
    </div>
</div>

<datalist id="list_jor"></datalist><datalist id="list_act"></datalist><datalist id="list_cua"></datalist>

<script>
    let CONCENTRADO = JSON.parse(localStorage.getItem('agri_v57_master')) || [];
    let CATS = JSON.parse(localStorage.getItem('agri_v57_cats')) || { cuadros: [], actividades: [], jornadas: [] };
    let view = 'sec_asistencia';

    const scanner = new Html5Qrcode("reader");
    const norm = (s) => String(s || "").replace(/[.,\s]/g, "").toUpperCase();

    function nav(id) {
        view = id;
        document.getElementById('sec_escaner').classList.add('hidden');
        document.getElementById('sec_asistencia').classList.add('hidden');
        document.getElementById('sec_catalogos').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function procesarArchivo(input) {
        const reader = new FileReader();
        reader.onload = (e) => { 
            try { 
                procesarJSON(JSON.parse(e.target.result)); 
            } catch(err) { 
                alert("Error al procesar el archivo JSON"); 
            } 
        };
        reader.readAsText(input.files[0]);
    }

    function procesarJSON(json) {
        if (json.catalogos) {
            CATS = json.catalogos;
            localStorage.setItem('agri_v57_cats', JSON.stringify(CATS));
            actualizarDatalists();
        }

        const avanceReal = json.avance || [];
        const jornadaDefault = json.jornada || "GENERAL"; 

        const buscarID = (lista, busqueda, campoNombre) => {
            if(!lista || !busqueda) return "?";
            let encontrado = lista.find(item => norm(item[campoNombre]) === norm(busqueda));
            return encontrado ? encontrado.id : "?";
        };

        const idJornada = buscarID(CATS.jornadas, jornadaDefault, 'desc');

        avanceReal.forEach(a => {
            const idAct = buscarID(CATS.actividades, a.actividad, 'desc');
            const idCua = buscarID(CATS.cuadros, a.nomCuadro, 'nombre');
            
            sumarAlMaster({
                cre: a.obrero,
                id_a: idAct,
                n_a: a.actividad,
                id_c: idCua,
                cua: a.nomCuadro,
                id_j: idJornada,
                n_j: jornadaDefault,
                lin: a.lineasContadas || 0,
                plt: a.plantasDone || 0
            });
        });

        render();
        alert("Archivo de V86 cargado correctamente.");
    }

    function sumarAlMaster(n) {
        let registroExistente = CONCENTRADO.find(r => 
            r.cre === n.cre && r.id_a === n.id_a && r.cua === n.cua
        );

        if (registroExistente) {
            registroExistente.lin += n.lin;
            registroExistente.plt = (registroExistente.plt || 0) + n.plt;
        } else {
            CONCENTRADO.push(n);
        }
        localStorage.setItem('agri_v57_master', JSON.stringify(CONCENTRADO));
    }

    function render() {
        const tbody = document.querySelector('#tablaMaster tbody');
        const precioManual = parseFloat(document.getElementById('precio_dinamico').value) || 0;

        tbody.innerHTML = CONCENTRADO.map(d => {
            const pagoObrero = (d.plt || 0) * precioManual;
            return `
                <tr class="${d.lin === 0 ? 'row-sup' : ''}">
                    <td>${d.cre}</td><td>${d.id_a}</td><td>${d.n_a}</td>
                    <td>${d.id_c}</td><td>${d.cua}</td><td>${d.id_j}</td>
                    <td>${d.n_j}</td><td>${d.lin}</td><td>${d.plt || 0}</td>
                    <td style="font-weight:bold; color:#ffeb3b;">$${pagoObrero.toFixed(2)}</td>
                </tr>
            `;
        }).join('');
    }

    function registrarManual() {
        const id = document.getElementById('manual_id').value.trim();
        const nJ = document.getElementById('in_jor').value;
        const nA = document.getElementById('in_act').value;
        const nC = document.getElementById('in_cua').value;
        const lin = parseInt(document.getElementById('manual_lineas').value) || 0;

        if(!id || !nA || !nC) return alert("Faltan datos");

        const buscarID = (lista, busqueda, campoNombre) => {
            let encontrado = lista.find(item => norm(item[campoNombre]) === norm(busqueda));
            return encontrado ? encontrado.id : "?";
        };

        const idJ = buscarID(CATS.jornadas, nJ, 'desc');
        const idA = buscarID(CATS.actividades, nA, 'desc');
        const idC = buscarID(CATS.cuadros, nC, 'nombre');

        sumarAlMaster({
            cre: id, id_a: idA, n_a: nA, id_c: idC, cua: nC,
            id_j: idJ, n_j: nJ, lin: lin, plt: 0
        });
        
        document.getElementById('manual_id').value = "";
        render();
    }

    function actualizarDatalists() {
        document.getElementById('cat_cua').value = (CATS.cuadros || []).map(c => `${c.id},${c.nombre}`).join('\n');
        document.getElementById('cat_act').value = (CATS.actividades || []).map(a => `${a.id},${a.desc}`).join('\n');
        document.getElementById('cat_jor').value = (CATS.jornadas || []).map(j => `${j.id},${j.desc}`).join('\n');
    }

    function descargarExcel() {
        const ahora = new Date();
        const fecha = ahora.getDate() + "_" + (ahora.getMonth() + 1) + "_" + ahora.getFullYear();
        const precioReporte = parseFloat(document.getElementById('precio_dinamico').value) || 0;
        
        let csv = "\uFEFFCREDENTIAL,ID_ACT,NAME_ACT,ID_CUA,CUADRO,ID_JOR,DESC_JOR,LÍNEAS,PLANTAS,PRECIO_UNI,TOTAL_A_PAGAR\n";
        
        CONCENTRADO.forEach(d => { 
            const total = (d.plt || 0) * precioReporte;
            csv += `${d.cre},${d.id_a},${d.n_a},${d.id_c},${d.cua},${d.id_j},${d.n_j},${d.lin},${d.plt || 0},${precioReporte},${total.toFixed(2)}\n`; 
        });

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "REPORTE_PAGOS_" + fecha + ".csv";
        link.click();
    }

    function borrarTodo() { 
        if(confirm("¿Borrar todo?")) { 
            CONCENTRADO = []; 
            localStorage.removeItem('agri_v57_master'); 
            render(); 
        } 
    }

    window.onload = () => { actualizarDatalists(); render(); };
</script>
</body>
</html>
