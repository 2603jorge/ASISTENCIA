<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AgriCactus V5.3 PRO - Compacto</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1565c0; --accent: #00e676; --dark: #0f172a; --card: #1e293b; --text: #f1f5f9; --warn: #f59e0b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); padding: 10px; margin: 0; }
        .container { max-width: 800px; margin: auto; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        
        /* Cámara pequeña */
        #reader { width: 100% !important; max-width: 350px; margin: auto; border-radius: 12px; overflow: hidden; border: 2px solid var(--primary); }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 5px; font-size: 13px; color: white; }
        .btn-blue { background: var(--primary); }
        .btn-green { background: var(--accent); color: #000; }
        .btn-warn { background: var(--warn); color: #000; }
        
        table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: var(--accent); }
        
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .hidden { display: none; }
        .flex { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="text-align:center; color: var(--primary); margin: 5px;">📋 Extractor PRO V5.3</h3>

    <div class="card" style="text-align:center;">
        <div id="reader"></div>
        <p style="font-size:10px; color:var(--warn);">Lector de IDs y Reportes</p>
    </div>

    <div class="card">
        <div class="flex">
            <button class="btn btn-blue" onclick="mostrarSeccion('sec_asistencia')">📋 TABLA</button>
            <button class="btn btn-blue" onclick="mostrarSeccion('sec_catalogos')">📂 CATÁLOGOS</button>
        </div>
    </div>

    <div id="sec_catalogos" class="card hidden">
        <h4>📦 Cargar Listas (CSV)</h4>
        <textarea id="csv_cuadros" placeholder="Pegar Cuadros aquí..." rows="3"></textarea>
        <textarea id="csv_act" placeholder="Pegar Actividades aquí..." rows="3"></textarea>
        <textarea id="csv_jor" placeholder="Pegar Jornadas aquí..." rows="3"></textarea>
        <button class="btn btn-green" onclick="guardarCatalogos()">💾 GUARDAR CATÁLOGOS</button>
    </div>

    <div id="sec_asistencia">
        <div class="card" style="border: 1px dashed var(--warn);">
            <h4 style="margin:0; color:var(--warn);">➕ Asignación Manual / Rescate</h4>
            <div class="flex">
                <input type="text" id="manual_id" placeholder="ID Escaneado" readonly>
                <input type="number" id="manual_lineas" value="1" style="width:70px;">
            </div>
            <select id="sel_jor"></select>
            <select id="sel_act"></select>
            <select id="sel_cua"></select>
            <button class="btn btn-warn" onclick="asignarManual()">AGREGAR A TABLA</button>
        </div>

        <div class="card">
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="procesarArchivo(this)">
            <button class="btn btn-blue" onclick="document.getElementById('fileInput').click()">📂 CARGAR REPORTE .JSON</button>
            
            <div id="tablaArea" class="hidden">
                <div style="overflow-x: auto;">
                    <table id="tablaAsistencia">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>ACT</th>
                                <th>CUADRO</th>
                                <th>LÍNEAS</th>
                                <th>EDIT</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <button class="btn btn-green" onclick="descargarCSV()" style="margin-top:15px;">💾 DESCARGAR EXCEL</button>
                <button class="btn" style="background:#c62828" onclick="limpiarDatos()">🗑️ BORRAR TODO</button>
            </div>
        </div>
    </div>
</div>

<script>
    let BASE_DATOS = JSON.parse(localStorage.getItem('ext_data')) || [];
    let CATS = JSON.parse(localStorage.getItem('ext_cats')) || { cuadros: [], actividades: [], jornadas: [] };

    const normalizar = (s) => String(s || "").replace(/[.,\s]/g, "").toUpperCase();

    // SCANNER CONFIG
    const scanner = new Html5Qrcode("reader");
    scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (text) => {
        try {
            const obj = JSON.parse(text);
            procesarJSON(obj);
        } catch(e) {
            document.getElementById('manual_id').value = text;
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
        }
    });

    function guardarCatalogos() {
        const txtC = document.getElementById('csv_cuadros').value;
        const txtA = document.getElementById('csv_act').value;
        const txtJ = document.getElementById('csv_jor').value;
        
        if(txtC) CATS.cuadros = txtC.split('\n').map(l => { let c=l.split(/[,\t]/); return c.length>=2 ? {id:c[0].trim(), nombre:c[1].trim()} : null }).filter(x=>x);
        if(txtA) CATS.actividades = txtA.split('\n').map(l => { let c=l.split(/[,\t]/); return c.length>=2 ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        if(txtJ) CATS.jornadas = txtJ.split('\n').map(l => { let c=l.split(/[,\t]/); return c.length>=2 ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        
        localStorage.setItem('ext_cats', JSON.stringify(CATS));
        cargarSelectores();
        alert("Catálogos guardados");
        mostrarSeccion('sec_asistencia');
    }

    function cargarSelectores() {
        document.getElementById('sel_jor').innerHTML = CATS.jornadas.map(j => `<option value="${j.id}|${j.desc}">${j.desc}</option>`).join('');
        document.getElementById('sel_act').innerHTML = CATS.actividades.map(a => `<option value="${a.id}|${a.desc}">${a.desc}</option>`).join('');
        document.getElementById('sel_cua').innerHTML = CATS.cuadros.map(c => `<option value="${c.id}|${c.nombre}">${c.nombre}</option>`).join('');
    }

    function asignarManual() {
        const id = document.getElementById('manual_id').value;
        if(!id) return alert("Escanea un ID");
        const j = document.getElementById('sel_jor').value.split('|');
        const a = document.getElementById('sel_act').value.split('|');
        const c = document.getElementById('sel_cua').value.split('|');
        const l = parseInt(document.getElementById('manual_lineas').value);

        actualizarFila({
            credencial: id, id_act: a[0], name_act: a[1],
            id_cuadro: c[0], cuadro: c[1], id_jor: j[0], desc_jor: j[1], lineas: l
        });
        document.getElementById('manual_id').value = "";
        render();
    }

    function procesarJSON(json) {
        const avance = json.avance || [];
        const conf = json.config || {};
        const cat = json.catalogos || CATS;

        avance.forEach(a => {
            const actD = cat.actividades.find(ac => normalizar(ac.desc) === normalizar(a.supAct)) || {id:"?"};
            const cuaD = cat.cuadros.find(cu => normalizar(cu.nombre) === normalizar(a.nomCuadro)) || {id:"?"};
            const jorD = cat.jornadas.find(jo => normalizar(jo.desc) === normalizar(conf.jornada)) || {id:"?"};

            actualizarFila({
                credencial: a.obrero, id_act: actD.id, name_act: a.supAct,
                id_cuadro: cuaD.id, cuadro: a.nomCuadro,
                id_jor: jorD.id, desc_jor: conf.jornada, lineas: 1
            });
        });
        render();
    }

    function actualizarFila(n) {
        let idx = BASE_DATOS.findIndex(r => r.credencial === n.credencial);
        if (idx > -1) { BASE_DATOS[idx].lineas += n.lineas; }
        else { BASE_DATOS.push(n); }
        localStorage.setItem('ext_data', JSON.stringify(BASE_DATOS));
    }

    function render() {
        const tbody = document.querySelector('#tablaAsistencia tbody');
        tbody.innerHTML = "";
        BASE_DATOS.forEach(d => {
            tbody.innerHTML += `<tr>
                <td>${d.credencial}</td><td>${d.name_act}</td><td>${d.cuadro}</td><td><b>${d.lineas}</b></td>
                <td><button onclick="borrar('${d.credencial}')">❌</button></td>
            </tr>`;
        });
        document.getElementById('tablaArea').classList.remove('hidden');
    }

    function mostrarSeccion(id) {
        document.getElementById('sec_catalogos').classList.add('hidden');
        document.getElementById('sec_asistencia').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function descargarCSV() {
        let csv = "\uFEFFCREDENTIAL,ID_ACT,NAME_ACT,ID_CUA,CUADRO,ID_JOR,DESC_JOR,L\n";
        BASE_DATOS.forEach(d => { csv += `${d.credencial},${d.id_act},${d.name_act},${d.id_cuadro},${d.cuadro},${d.id_jor},${d.desc_jor},${d.lineas}\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `ASISTENCIA_FINAL.csv`;
        link.click();
    }

    function borrar(id) { BASE_DATOS = BASE_DATOS.filter(r => r.credencial !== id); render(); }
    function limpiarDatos() { if(confirm("¿Limpiar todo?")) { BASE_DATOS = []; localStorage.removeItem('ext_data'); render(); } }

    window.onload = () => { cargarSelectores(); render(); };
</script>
</body>
</html>
