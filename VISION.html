<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V5.5 - Extractor Dual Camera</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1565c0; --accent: #00e676; --dark: #0f172a; --card: #1e293b; --text: #f1f5f9; --warn: #f59e0b; }
        body { font-family: -apple-system, sans-serif; background: var(--dark); color: var(--text); padding: 10px; margin: 0; }
        .container { max-width: 100%; margin: auto; }
        .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        
        #reader { width: 100% !important; max-width: 300px; margin: 0 auto 10px auto; border-radius: 12px; overflow: hidden; border: 2px solid var(--primary); background: #000; min-height: 200px; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 8px; font-size: 12px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-blue { background: var(--primary); }
        .btn-green { background: var(--accent); color: #000; }
        .btn-warn { background: var(--warn); color: #000; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; box-sizing: border-box; }
        .flex-row { display: flex; gap: 8px; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <h3 id="titulo_app" style="text-align:center; color: var(--primary); margin: 10px 0;">📋 Extractor V5.5</h3>

    <div class="card">
        <div id="reader"></div>
        <p id="instruccion_camara" style="text-align:center; font-size:11px; color:var(--warn);">Cámara lista</p>
    </div>

    <div class="flex-row" style="margin-bottom: 10px;">
        <button class="btn btn-blue" onclick="cambiarSeccion('sec_asistencia')">📋 TABLA</button>
        <button class="btn btn-blue" onclick="cambiarSeccion('sec_escaner')">🆔 INDIVIDUAL</button>
        <button class="btn btn-blue" onclick="cambiarSeccion('sec_catalogos')">📂 CATS</button>
    </div>

    <div id="sec_escaner" class="hidden">
        <div class="card" style="border-left: 5px solid var(--warn);">
            <h4 style="margin:0 0 10px 0; color:var(--warn);">Registro Individual</h4>
            <div class="flex-row">
                <input type="text" id="manual_id" placeholder="ID (Escanee o escriba)">
                <input type="number" id="manual_lineas" value="1" style="width:70px;">
            </div>
            <input type="text" id="in_jor" list="list_jor" placeholder="Jornada...">
            <input type="text" id="in_act" list="list_act" placeholder="Actividad...">
            <input type="text" id="in_cua" list="list_cua" placeholder="Cuadro...">
            <button class="btn btn-warn" onclick="registrarIndividual()">✅ AGREGAR TRABAJADOR</button>
        </div>
    </div>

    <div id="sec_asistencia">
        <div class="card">
            <button class="btn btn-blue" onclick="document.getElementById('fileInput').click()">📂 CARGAR ARCHIVO .JSON</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="procesarArchivo(this)">
            
            <div style="overflow-x: auto;">
                <table id="tablaAsistencia">
                    <thead><tr><th>ID</th><th>ACT</th><th>CUADRO</th><th>L</th><th>X</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn btn-green" onclick="descargarCSV()" style="margin-top:15px;">💾 EXCEL (CSV)</button>
            <button class="btn" style="background:#c62828" onclick="limpiarDatos()">🗑️ BORRAR TODO</button>
        </div>
    </div>

    <div id="sec_catalogos" class="card hidden">
        <h4>📦 Configurar Catálogos</h4>
        <textarea id="csv_cuadros" placeholder="Cuadros (ID, Nombre)" rows="3"></textarea>
        <textarea id="csv_act" placeholder="Actividades (ID, Nombre)" rows="3"></textarea>
        <textarea id="csv_jor" placeholder="Jornadas (ID, Nombre)" rows="3"></textarea>
        <button class="btn btn-green" onclick="guardarCatalogos()">💾 GUARDAR</button>
    </div>
</div>

<datalist id="list_jor"></datalist><datalist id="list_act"></datalist><datalist id="list_cua"></datalist>

<script>
    let BASE_DATOS = JSON.parse(localStorage.getItem('ext_v55_data')) || [];
    let CATS = JSON.parse(localStorage.getItem('ext_v55_cats')) || { cuadros: [], actividades: [], jornadas: [] };
    let seccionActual = 'sec_asistencia';

    const scanner = new Html5Qrcode("reader");
    const normalizar = (s) => String(s || "").replace(/[.,\s]/g, "").toUpperCase();

    function onScanSuccess(text) {
        if (seccionActual === 'sec_asistencia') {
            try {
                const json = JSON.parse(text);
                procesarJSON(json);
                alert("Reporte cargado ✅");
            } catch(e) { alert("Error: En esta pestaña solo se leen reportes QR completos."); }
        } else if (seccionActual === 'sec_escaner') {
            document.getElementById('manual_id').value = text.trim();
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
        }
    }

    function cambiarSeccion(id) {
        seccionActual = id;
        document.getElementById('sec_catalogos').classList.add('hidden');
        document.getElementById('sec_asistencia').classList.add('hidden');
        document.getElementById('sec_escaner').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
        
        const inst = document.getElementById('instruccion_camara');
        inst.innerText = (id === 'sec_asistencia') ? "Escanee Reporte QR" : (id === 'sec_escaner') ? "Escanee Credencial ID" : "Cámara en espera";
    }

    // Iniciar cámara una sola vez
    scanner.start({ facingMode: "environment" }, { fps: 15, qrbox: 200 }, onScanSuccess);

    function guardarCatalogos() {
        const txtC = document.getElementById('csv_cuadros').value;
        const txtA = document.getElementById('csv_act').value;
        const txtJ = document.getElementById('csv_jor').value;
        if(txtC) CATS.cuadros = txtC.split('\n').map(l => { let c=l.split(/[,\t]/); return c.length>=2 ? {id:c[0].trim(), nombre:c[1].trim()} : null }).filter(x=>x);
        if(txtA) CATS.actividades = txtA.split('\n').map(l => { let c=l.split(/[,\t]/); return c.length>=2 ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        if(txtJ) CATS.jornadas = txtJ.split('\n').map(l => { let c=l.split(/[,\t]/); return c.length>=2 ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        localStorage.setItem('ext_v55_cats', JSON.stringify(CATS));
        actualizarSugerencias();
        alert("Catálogos guardados ✅");
    }

    function actualizarSugerencias() {
        document.getElementById('list_jor').innerHTML = CATS.jornadas.map(j => `<option value="${j.desc}">`).join('');
        document.getElementById('list_act').innerHTML = CATS.actividades.map(a => `<option value="${a.desc}">`).join('');
        document.getElementById('list_cua').innerHTML = CATS.cuadros.map(c => `<option value="${c.nombre}">`).join('');
    }

    function registrarIndividual() {
        const id = document.getElementById('manual_id').value.trim();
        const nJor = document.getElementById('in_jor').value;
        const nAct = document.getElementById('in_act').value;
        const nCua = document.getElementById('in_cua').value;
        const lineas = parseInt(document.getElementById('manual_lineas').value) || 0;
        if(!id || !nAct || !nCua) return alert("Faltan datos");
        const jObj = CATS.jornadas.find(j => normalizar(j.desc) === normalizar(nJor)) || {id:"N/A"};
        const aObj = CATS.actividades.find(a => normalizar(a.desc) === normalizar(nAct)) || {id:"N/A"};
        const cObj = CATS.cuadros.find(c => normalizar(c.nombre) === normalizar(nCua)) || {id:"N/A"};
        actualizarDB({ credencial: id, id_act: aObj.id, name_act: nAct, id_cuadro: cObj.id, cuadro: nCua, id_jor: jObj.id, desc_jor: nJor, lineas: lineas });
        document.getElementById('manual_id').value = ""; render();
    }

    function procesarJSON(json) {
        const avance = json.avance || [];
        const conf = json.config || {};
        const cat = json.catalogos || CATS;
        avance.forEach(a => {
            const actD = cat.actividades.find(ac => normalizar(ac.desc) === normalizar(a.supAct)) || {id:"?"};
            const cuaD = cat.cuadros.find(cu => normalizar(cu.nombre) === normalizar(a.nomCuadro)) || {id:"?"};
            const jorD = cat.jornadas.find(jo => normalizar(jo.desc) === normalizar(conf.jornada)) || {id:"?"};
            actualizarDB({ credencial: a.obrero, id_act: actD.id, name_act: a.supAct, id_cuadro: cuaD.id, cuadro: a.nomCuadro, id_jor: jorD.id, desc_jor: conf.jornada, lineas: 1 });
        });
        render();
    }

    function actualizarDB(n) {
        let idx = BASE_DATOS.findIndex(r => r.credencial === n.credencial);
        if (idx > -1) { BASE_DATOS[idx].lineas += n.lineas; } else { BASE_DATOS.push(n); }
        localStorage.setItem('ext_v55_data', JSON.stringify(BASE_DATOS));
    }

    function render() {
        const tbody = document.querySelector('#tablaAsistencia tbody');
        tbody.innerHTML = BASE_DATOS.map(d => `<tr><td>${d.credencial}</td><td>${d.name_act}</td><td>${d.cuadro}</td><td><b>${d.lineas}</b></td><td><button onclick="borrar('${d.credencial}')">❌</button></td></tr>`).join('');
    }

    function descargarCSV() {
        let csv = "\uFEFFCREDENTIAL,ID_ACT,NAME_ACT,ID_CUA,CUADRO,ID_JOR,DESC_JOR,L\n";
        BASE_DATOS.forEach(d => { csv += `${d.credencial},${d.id_act},${d.name_act},${d.id_cuadro},${d.cuadro},${d.id_jor},${d.desc_jor},${d.lineas}\n`; });
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `ASISTENCIA_REPORTE.csv`;
        link.click();
    }

    function borrar(id) { if(confirm("¿Eliminar?")) { BASE_DATOS = BASE_DATOS.filter(r => r.credencial !== id); render(); } }
    function limpiarDatos() { if(confirm("¿Limpiar todo?")) { BASE_DATOS = []; localStorage.removeItem('ext_v55_data'); render(); } }
    window.onload = () => { actualizarSugerencias(); render(); cambiarSeccion('sec_asistencia'); };
</script>
</body>
</html>
