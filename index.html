<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus - Cuadrillero (L. Completa)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #1b5e20; --s: #f4f7f6; --danger: #c62828; --info: #0277bd; --sup: #673ab7; }
        body { font-family: sans-serif; background: var(--s); margin: 0; padding: 10px; padding-bottom: 80px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .progress-container { background: #ddd; border-radius: 10px; height: 12px; width: 100%; margin: 8px 0; overflow: hidden; }
        #progressBar { background: var(--p); height: 100%; width: 0%; transition: 0.5s; }
        .config-status { background: #e8f5e9; border: 1px solid var(--p); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .counter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .counter-box { padding: 10px; border-radius: 8px; text-align: center; color: white; font-weight: bold; }
        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .btn-nav { padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 10px; }
        input, select { width: 100%; height: 48px; margin-top: 5px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; padding: 0 10px; box-sizing: border-box; }
        #status { text-align: center; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; background: #eee; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .division-box { background: #fff3e0; border: 2px dashed #ff9800; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="nav-buttons">
    <button class="btn-nav" style="background:#607d8b" onclick="abrirConfig()">⚙️ CONFIG</button>
    <button class="btn-nav" style="background:var(--sup)" onclick="activarEscaneoSup()">🛰️ QR SUPERVISOR</button>
    <button class="btn-nav" style="background:var(--info)" onclick="abrirRegistros()">📋 LISTADO</button>
</div>

<div class="config-status">
    📍 Cuadro: <b id="displayCuadro">--</b> | 🧵 L: <b id="displayRango">-- al --</b> | 👥 <b>L. COMPLETA</b>
    <div class="progress-container"><div id="progressBar"></div></div>
    <small id="displayCapacidad">Ocupación: 0/0 personas</small>
</div>

<div class="counter-grid">
    <div class="counter-box" style="background:var(--info)">Total: <span id="countTotal">0</span></div>
    <div class="counter-box" style="background:var(--p)">Cola: <span id="countEspera">0</span></div>
</div>

<div class="card">
    <label>SUPERVISOR</label>
    <input type="text" id="sup" oninput="localStorage.setItem('c_sup', this.value)">
    <label>ACTIVIDAD</label>
    <input type="text" id="busA" placeholder="Filtrar..." oninput="filtrar()">
    <select id="selA"></select>
    <div id="reader" style="width: 100%; background: #000; border-radius: 8px; margin-top: 15px;"></div>
    <div id="status">ESCANEANDO...</div>
</div>

<div class="division-box" id="areaDivision" style="display:none;">
    <h4>📦 REPARTO: 2 POR LÍNEA</h4>
    <p id="infoReparto" style="font-size:12px; color:#666;"></p>
    <button onclick="confirmarDivision()" style="width:100%; background:var(--p); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold;">✅ ASIGNAR Y GUARDAR</button>
</div>

<button onclick="prepararTransferencia()" style="width:100%; background:var(--sup); color:white; padding:20px; border:none; border-radius:12px; font-weight:bold; margin-top:10px;">📤 PASAR DATOS AL JEFE</button>

<div id="config" class="modal">
    <h3>Configuración Manual</h3>
    <input type="text" id="m_cuadro" placeholder="Cuadro">
    <input type="number" id="m_ini" placeholder="L. Ini">
    <input type="number" id="m_fin" placeholder="L. Fin">
    <button onclick="guardarConfigManual()" style="width:100%; padding:15px; background:var(--p); color:white; border:none; margin-top:10px;">FIJAR</button>
    <hr>
    <label>MAPEO (Act, Emp)</label>
    <textarea id="importPuestos" style="width:100%; height:80px;"></textarea>
    <button onclick="guardarMapeo()" style="width:100%; padding:10px; background:var(--info); color:white; border:none;">GUARDAR MAPEO</button>
    <button onclick="document.getElementById('config').style.display='none'" style="width:100%; padding:15px; margin-top:20px;">CERRAR</button>
</div>

<div id="modalRegs" class="modal">
    <h3>Registros</h3>
    <div id="listaRegistros"></div>
    <button onclick="document.getElementById('modalRegs').style.display='none'" style="width:100%; padding:15px; margin-top:20px;">VOLVER</button>
</div>

<div id="modalQR" class="modal" style="text-align:center;">
    <div id="qrcode" style="display:flex; justify-content:center; margin-top:20px;"></div>
    <button onclick="document.getElementById('modalQR').style.display='none'" style="width:100%; padding:15px; margin-top:20px;">CERRAR</button>
</div>

<script>
let REGS = JSON.parse(localStorage.getItem('c_regs')) || [];
let ACTS = JSON.parse(localStorage.getItem('c_acts')) || [];
let MAPEO = JSON.parse(localStorage.getItem('c_mapeo_v2')) || {};
let COLA = [];
let CUR = JSON.parse(localStorage.getItem('cur_config')) || { c:"", li:0, lf:0 };
let MODO_SUP = false;
const TOKEN = "SECRET123";

function activarEscaneoSup() { MODO_SUP = true; document.getElementById('status').innerText = "🛰️ ESCANEE QR SUPERVISOR"; }

function alEscanear(codigo) {
    if(MODO_SUP) {
        const p = codigo.split('|');
        if(p[0] === "SUP_CONFIG" && p[5] === TOKEN) {
            CUR = { c: p[1], li: parseInt(p[2]), lf: parseInt(p[3]) };
            localStorage.setItem('cur_config', JSON.stringify(CUR));
            actualizarInterfaz();
            MODO_SUP = false;
            document.getElementById('status').innerText = "✅ TRAMO OK";
        }
    } else {
        if(!CUR.c) return alert("Falta Cuadro");
        const cod = codigo.trim();
        if(REGS.find(r => r.e === cod) || COLA.find(c => c.e === cod)) return;
        COLA.push({ e: cod });
        document.getElementById('areaDivision').style.display = 'block';
        document.getElementById('infoReparto').innerText = `Cola: ${COLA.length} personas`;
        actualizarInterfaz();
    }
}

function confirmarDivision() {
    const h = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
    const f = new Date().toLocaleDateString('en-GB');
    const actGral = document.getElementById('selA').value;

    COLA.forEach((persona, index) => {
        // ASIGNACIÓN SIEMPRE DE 2 EN 2
        let linea = CUR.li + Math.floor(index / 2);
        if(linea > CUR.lf) linea = CUR.lf;

        REGS.push({
            id: Date.now() + index, f: f, h: h, c: CUR.c, l: linea,
            e: persona.e, a: (MAPEO[persona.e] ? MAPEO[persona.e].act : actGral),
            s: document.getElementById('sup').value
        });
    });

    localStorage.setItem('c_regs', JSON.stringify(REGS));
    COLA = [];
    document.getElementById('areaDivision').style.display = 'none';
    actualizarInterfaz();
}

function actualizarInterfaz() {
    document.getElementById('displayCuadro').innerText = CUR.c || "--";
    document.getElementById('displayRango').innerText = `${CUR.li} al ${CUR.lf}`;
    let ocupado = REGS.filter(r => r.c === CUR.c).length;
    let capacidad = (CUR.lf - CUR.li + 1) * 2;
    document.getElementById('countTotal').innerText = REGS.length;
    document.getElementById('countEspera').innerText = COLA.length;
    document.getElementById('displayCapacidad').innerText = `${ocupado}/${capacidad} ocupados`;
    document.getElementById('progressBar').style.width = Math.min((ocupado/capacidad)*100, 100) + "%";
}

// ... Funciones de soporte (abrirConfig, filtrar, mapeo, cargar, registros) iguales a la versión anterior ...
function abrirConfig() { document.getElementById('config').style.display='block'; }
function abrirRegistros() { 
    document.getElementById('listaRegistros').innerHTML = REGS.slice(-10).reverse().map(r => `<div>${r.e} - L:${r.l}</div>`).join('');
    document.getElementById('modalRegs').style.display='block'; 
}
function filtrar() { const f = document.getElementById('busA').value.toLowerCase(); document.getElementById('selA').innerHTML = ACTS.filter(a => a.id.toLowerCase().includes(f) || a.n.toLowerCase().includes(f)).map(a => `<option value="${a.id}">${a.n}</option>`).join(''); }
function guardarConfigManual() { CUR.c = document.getElementById('m_cuadro').value; CUR.li = parseInt(document.getElementById('m_ini').value); CUR.lf = parseInt(document.getElementById('m_fin').value); localStorage.setItem('cur_config', JSON.stringify(CUR)); actualizarInterfaz(); }
function prepararTransferencia() { document.getElementById('qrcode').innerHTML = ""; new QRCode(document.getElementById("qrcode"), { text: "PACK|" + JSON.stringify(REGS), width: 250, height: 250 }); document.getElementById('modalQR').style.display='block'; }

window.onload = () => {
    actualizarInterfaz();
    new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 }).render(alEscanear);
};
</script>
</body>
</html>
