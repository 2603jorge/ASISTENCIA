<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus - Cuadrillero v5.0</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #1b5e20; --s: #f4f7f6; --danger: #c62828; --info: #0277bd; --accent: #ff9800; --sup: #673ab7; }
        body { font-family: sans-serif; background: var(--s); margin: 0; padding: 10px; padding-bottom: 80px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
        
        /* Barra de Progreso */
        .progress-container { background: #ddd; border-radius: 10px; height: 12px; width: 100%; margin: 8px 0; overflow: hidden; }
        #progressBar { background: var(--p); height: 100%; width: 0%; transition: 0.5s; }
        
        .config-status { background: #e8f5e9; border: 1px solid var(--p); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        .counter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .counter-box { padding: 10px; border-radius: 8px; text-align: center; color: white; }
        .c-total { background: var(--info); }
        .c-temp { background: #2e7d32; }
        .count-val { font-size: 24px; font-weight: bold; display: block; }
        
        label { display: block; font-weight: bold; font-size: 11px; color: #555; margin-top: 10px; }
        input, select { width: 100%; height: 48px; margin-top: 5px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; padding: 0 10px; box-sizing: border-box; }
        
        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .btn-nav { padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 10px; }
        .btn-config { background: #607d8b; }
        .btn-view { background: var(--info); }
        .btn-sup { background: var(--sup); }

        #status { text-align: center; font-weight: bold; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; background: #eee; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .division-box { background: #fff3e0; border: 2px dashed #ff9800; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: center; }
        .btn-transfer { width: 100%; background: #673ab7; color: white; padding: 20px; border: none; border-radius: 12px; font-weight: bold; margin-top: 10px; font-size: 16px; }
        .reg-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .btn-del-mini { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="nav-buttons">
    <button class="btn-nav btn-config" onclick="abrirConfig()">⚙️ CONFIG</button>
    <button class="btn-nav btn-sup" onclick="activarEscaneoSup()">🛰️ QR SUPERVISOR</button>
    <button class="btn-nav btn-view" onclick="abrirRegistros()">📋 VER LISTADO</button>
</div>

<div class="config-status">
    📍 Cuadro: <b id="displayCuadro">--</b> | 🧵 L: <b id="displayRango">-- al --</b> | 👥 <b id="displayModo">--</b>
    <div class="progress-container"><div id="progressBar"></div></div>
    <small id="displayCapacidad">Ocupación: 0/0 espacios</small>
</div>

<div class="counter-grid">
    <div class="counter-box c-total"><span class="count-val" id="countTotal">0</span><small>Total Local</small></div>
    <div class="counter-box c-temp"><span class="count-val" id="countEspera">0</span><small>En Cola</small></div>
</div>

<div class="card">
    <label>SUPERVISOR</label>
    <input type="text" id="sup" oninput="localStorage.setItem('c_sup', this.value)">
    <label>ACTIVIDAD</label>
    <input type="text" id="busA" placeholder="Buscar..." oninput="filtrar()">
    <select id="selA"></select>
    <div id="reader" style="width: 100%; background: #000; border-radius: 8px; margin-top: 15px;"></div>
    <div id="status">ESCANEANDO...</div>
</div>

<div class="division-box" id="areaDivision" style="display:none;">
    <h4 style="margin:0">📦 REPARTO AUTOMÁTICO</h4>
    <p id="infoReparto" style="font-size:12px; color:#666;"></p>
    <button onclick="confirmarDivision()" style="width:100%; background:var(--p); color:white; padding:15px; border:none; border-radius:8px; margin-top:10px; font-weight:bold;">✅ GUARDAR Y ASIGNAR</button>
    <button onclick="cancelarCaptura()" style="width:100%; background:none; color:red; border:none; margin-top:10px;">Cancelar cola</button>
</div>

<button class="btn-transfer" onclick="prepararTransferencia()">📤 GENERAR QR PARA JEFE</button>

<div id="config" class="modal">
    <h3>Configuración</h3>
    <label>Manual (Modo: 1=Media, 2=Completa)</label>
    <input type="text" id="m_cuadro" placeholder="Cuadro">
    <div style="display:flex; gap:5px;">
        <input type="number" id="m_ini" placeholder="L. Ini">
        <input type="number" id="m_fin" placeholder="L. Fin">
        <input type="number" id="m_pxl" placeholder="PxL (1 o 2)">
    </div>
    <button onclick="guardarConfigManual()" style="width:100%; padding:10px; background:var(--p); color:white; border:none; margin-top:5px;">FIJAR TRAMO</button>
    <hr>
    <label>MAPEO (Act, Emp)</label>
    <textarea id="importPuestos" style="width:100%; height:80px;"></textarea>
    <button onclick="guardarMapeo()" style="width:100%; padding:10px; background:var(--info); color:white; border:none;">GUARDAR MAPEO</button>
    <hr>
    <label>CATÁLOGOS (ID, Nombre)</label>
    <textarea id="importInput" style="width:100%; height:80px;"></textarea>
    <button onclick="procesarCarga()" style="width:100%; padding:10px; background:black; color:white; border:none;">CARGAR</button>
    <button onclick="document.getElementById('config').style.display='none'" style="width:100%; padding:15px; margin-top:20px; background:#ddd; border:none;">CERRAR</button>
</div>

<div id="modalRegs" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Registros</h3>
        <button onclick="limpiarTodo()" style="background:var(--danger); color:white; border:none; padding:8px; border-radius:5px;">BORRAR TODO</button>
    </div>
    <div id="listaRegistros"></div>
    <button onclick="document.getElementById('modalRegs').style.display='none'" style="width:100%; padding:15px; margin-top:20px; background:#ddd; border:none;">VOLVER</button>
</div>

<div id="modalQR" class="modal" style="text-align:center;">
    <div id="qrcode" style="display:flex; justify-content:center; margin:20px;"></div>
    <button onclick="document.getElementById('modalQR').style.display='none'" style="width:100%; padding:15px; background:#ddd; border:none;">CERRAR</button>
</div>

<script>
let REGS = JSON.parse(localStorage.getItem('c_regs')) || [];
let ACTS = JSON.parse(localStorage.getItem('c_acts')) || [];
let MAPEO = JSON.parse(localStorage.getItem('c_mapeo_v2')) || {};
let COLA = [];

// Configuración de tramo
let CUR = JSON.parse(localStorage.getItem('cur_config')) || { c:"", li:0, lf:0, pxl:2 };
let MODO_SUP = false;
const TOKEN_SEGURIDAD = "SECRET123";

function activarEscaneoSup() {
    MODO_SUP = true;
    document.getElementById('status').innerText = "🛰️ ESCANEE QR DEL SUPERVISOR...";
}

function alEscanear(codigo) {
    if(MODO_SUP) {
        const p = codigo.split('|');
        if(p[0] === "SUP_CONFIG" && p[5] === TOKEN_SEGURIDAD) {
            CUR = { c: p[1], li: parseInt(p[2]), lf: parseInt(p[3]), pxl: parseInt(p[4]) };
            localStorage.setItem('cur_config', JSON.stringify(CUR));
            actualizarInterfaz();
            MODO_SUP = false;
            document.getElementById('status').innerText = "✅ TRAMO: " + CUR.c;
        } else { alert("QR No válido o Token incorrecto"); }
    } else {
        if(!CUR.c) return alert("Pide asignación al supervisor");
        const cod = codigo.trim();
        if(REGS.find(r => r.e === cod) || COLA.find(c => c.e === cod)) return;
        COLA.push({ e: cod });
        document.getElementById('countEspera').innerText = COLA.length;
        document.getElementById('areaDivision').style.display = 'block';
        document.getElementById('infoReparto').innerText = `Gente en cola: ${COLA.length}`;
        actualizarInterfaz();
    }
}

function confirmarDivision() {
    const h = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
    const f = new Date().toLocaleDateString('en-GB');
    const actGral = document.getElementById('selA').value;
    const supervisor = document.getElementById('sup').value;

    COLA.forEach((persona, index) => {
        // REPARTO DINÁMICO: index / 1 (media) o index / 2 (completa)
        let avance = Math.floor(index / CUR.pxl);
        let linea = CUR.li + avance;
        if(linea > CUR.lf) linea = CUR.lf;

        REGS.push({
            id: Date.now() + index, f: f, h: h, c: CUR.c, l: linea,
            e: persona.e, a: (MAPEO[persona.e] ? MAPEO[persona.e].act : actGral),
            s: supervisor
        });
    });

    localStorage.setItem('c_regs', JSON.stringify(REGS));
    COLA = [];
    document.getElementById('areaDivision').style.display = 'none';
    actualizarInterfaz();
    alert("✅ Guardado con éxito.");
}

function actualizarInterfaz() {
    document.getElementById('displayCuadro').innerText = CUR.c || "--";
    document.getElementById('displayRango').innerText = `${CUR.li} al ${CUR.lf}`;
    document.getElementById('displayModo').innerText = CUR.pxl === 1 ? "Media Línea" : "L. Completa";
    
    // Cálculo de capacidad y barra
    let capacidad = (CUR.lf - CUR.li + 1) * CUR.pxl;
    let ocupado = REGS.filter(r => r.c === CUR.c).length;
    document.getElementById('countTotal').innerText = REGS.length;
    document.getElementById('countEspera').innerText = COLA.length;
    document.getElementById('displayCapacidad').innerText = `Ocupación: ${ocupado}/${capacidad} espacios`;
    
    let porc = (ocupado / capacidad) * 100;
    document.getElementById('progressBar').style.width = Math.min(porc, 100) + "%";
}

function guardarConfigManual() {
    CUR = {
        c: document.getElementById('m_cuadro').value,
        li: parseInt(document.getElementById('m_ini').value),
        lf: parseInt(document.getElementById('m_fin').value),
        pxl: parseInt(document.getElementById('m_pxl').value) || 2
    };
    localStorage.setItem('cur_config', JSON.stringify(CUR));
    actualizarInterfaz();
    document.getElementById('config').style.display = 'none';
}

// --- FUNCIONES SOPORTE ---
function abrirConfig() {
    document.getElementById('m_cuadro').value = CUR.c;
    document.getElementById('m_ini').value = CUR.li;
    document.getElementById('m_fin').value = CUR.lf;
    document.getElementById('m_pxl').value = CUR.pxl;
    document.getElementById('config').style.display = 'block';
}

function abrirRegistros() {
    const cont = document.getElementById('listaRegistros');
    cont.innerHTML = REGS.slice().reverse().map(r => `
        <div class="reg-item">
            <div><b>${r.e}</b><br><small>C:${r.c} L:${r.l} | ${r.h}</small></div>
            <button class="btn-del-mini" onclick="borrarRegistro(${r.id})">X</button>
        </div>
    `).join('') || "Vacio";
    document.getElementById('modalRegs').style.display = 'block';
}

function filtrar() {
    const f = document.getElementById('busA').value.toLowerCase();
    document.getElementById('selA').innerHTML = ACTS.filter(a => a.id.toLowerCase().includes(f) || a.n.toLowerCase().includes(f)).map(a => `<option value="${a.id}">${a.n}</option>`).join('');
}

function guardarMapeo() {
    const lines = document.getElementById('importPuestos').value.trim().split('\n');
    lines.forEach(l => { const p = l.split(','); MAPEO[p[1].trim()] = { act: p[0].trim() }; });
    localStorage.setItem('c_mapeo_v2', JSON.stringify(MAPEO));
    alert("Mapeo guardado");
}

function procesarCarga() {
    const lines = document.getElementById('importInput').value.trim().split('\n');
    ACTS = lines.map(l => { const p = l.split(','); return {id: p[0].trim(), n: p[1].trim()}; });
    localStorage.setItem('c_acts', JSON.stringify(ACTS));
    alert("Catálogo cargado"); filtrar();
}

function prepararTransferencia() {
    if(REGS.length === 0) return;
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById("qrcode"), { text: "AGRICACTUS_PACK|" + JSON.stringify(REGS), width: 280, height: 280 });
    document.getElementById('modalQR').style.display = 'block';
}

function borrarRegistro(id) {
    if(confirm("¿Borrar?")) { REGS = REGS.filter(r => r.id !== id); localStorage.setItem('c_regs', JSON.stringify(REGS)); actualizarInterfaz(); abrirRegistros(); }
}

function limpiarTodo() {
    if(confirm("¿Borrar todo?")) { REGS = []; localStorage.setItem('c_regs', '[]'); actualizarInterfaz(); abrirRegistros(); }
}

function cancelarCaptura() { COLA = []; document.getElementById('areaDivision').style.display = 'none'; actualizarInterfaz(); }

window.onload = () => {
    document.getElementById('sup').value = localStorage.getItem('c_sup') || "";
    actualizarInterfaz();
    filtrar();
    new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 }).render(alEscanear);
};
</script>
</body>
</html>
