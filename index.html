<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus Pro - Cuadrillero V7</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --p: #2e7d32; --s: #f1f8e9; --danger: #d32f2f; 
            --info: #1976d2; --sup: #673ab7; --accent: #f57c00; --dark: #212121;
            --warn: #ff9800;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #e0e0e0; margin: 0; padding: 10px; padding-bottom: 120px; }
        
        .monitor-avance { 
            background: var(--dark); color: white; padding: 15px; border-radius: 15px; 
            margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; text-align: center;
        }
        .monitor-avance b { font-size: 18px; display: block; color: var(--accent); }
        .monitor-avance span { font-size: 10px; text-transform: uppercase; opacity: 0.8; }

        .config-status { 
            background: white; border: 4px solid var(--p); padding: 15px; border-radius: 15px; 
            margin-bottom: 10px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .config-status.pending { border-color: var(--warn); background: #fffde7; }
        
        .valid-badge {
            position: absolute; top: -10px; left: 20px; background: var(--p); color: white;
            padding: 4px 12px; border-radius: 10px; font-size: 10px; font-weight: bold;
        }
        .pending-badge {
            position: absolute; top: -10px; left: 20px; background: var(--warn); color: white;
            padding: 4px 12px; border-radius: 10px; font-size: 10px; font-weight: bold;
        }

        .conteo-grande { 
            position: absolute; top: 10px; right: 10px; width: 65px; height: 65px; 
            background: var(--p); color: white; border-radius: 50%; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .conteo-grande small { font-size: 8px; text-transform: uppercase; margin-top: -2px; }

        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-accion { 
            padding: 15px; border: none; border-radius: 12px; font-weight: bold; 
            color: white; font-size: 14px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        label { display: block; font-weight: bold; font-size: 12px; color: #333; margin-top: 10px; margin-bottom: 5px; }
        select, input { 
            width: 100%; height: 55px; border: 2px solid #ccc; border-radius: 10px; 
            font-size: 18px; padding: 0 15px; box-sizing: border-box; background: #fafafa;
        }
        
        #reader { width: 100%; background: #000; border-radius: 15px; margin-top: 10px; overflow: hidden; border: 4px solid #fff; }
        #status-area { text-align: center; margin: 10px 0; }
        #status { font-weight: bold; padding: 15px; border-radius: 10px; font-size: 16px; background: #eee; display: inline-block; width: 100%; box-sizing: border-box; }
        .btn-cancel-scan { background: var(--danger); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; margin-top: 5px; width: 100%; cursor: pointer; display: none; }

        .division-box { 
            background: #fff3e0; border: 3px solid var(--accent); padding: 15px; 
            border-radius: 15px; margin-top: 10px;
        }
        .cola-list { max-height: 200px; overflow-y: auto; margin: 10px 0; }
        .cola-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: white; padding: 12px; border-radius: 10px; margin-bottom: 5px; border: 1px solid #ffccbc;
        }

        .modal { 
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:white; z-index:2000; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        
        .btn-enviar { 
            position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--sup); 
            color: white; padding: 20px; border: none; border-radius: 20px; font-weight: bold; 
            font-size: 18px; box-shadow: 0 6px 20px rgba(103, 58, 183, 0.4); z-index: 1000;
        }

        .input-hilera-actual {
            background: #e3f2fd;
            border: 3px solid var(--info);
            font-size: 24px;
            text-align: center;
            font-weight: bold;
            color: var(--info);
        }

        .reg-item-edit {
            border-bottom: 1px solid #ddd; padding: 12px; background: #f9f9f9; 
            margin-bottom: 8px; border-radius: 10px; position: relative;
            display: flex; justify-content: space-between; align-items: center;
        }
        .btn-mini-edit {
            background: var(--info); color: white; border: none; padding: 8px 12px;
            border-radius: 8px; font-weight: bold; font-size: 12px;
        }
    </style>
</head>
<body id="mainBody">

<div class="monitor-avance">
    <div><span>Hileras</span><b id="statLineas">0</b></div>
    <div><span>Gente</span><b id="statGente">0</b></div>
    <div><span>L/Hora</span><b id="statEficiencia">0.0</b></div>
</div>

<div id="cardStatus" class="config-status">
    <div id="badgeStatus" class="valid-badge">CUADRO REVISADO ✅</div>
    <div class="conteo-grande" id="circuloConteo">
        <span id="conteoRestante">0</span>
        <small>Faltan</small>
    </div>
    <div style="width: 75%;">
        <span style="font-size: 10px; color: #666; text-transform: uppercase;">Lugar de Trabajo:</span><br>
        <b style="font-size: 18px;">CUADRO <span id="displayCuadro">--</span></b> (<span id="displayLado">--</span>)<br>
        🌱 <span id="displayVariedad">--</span> | 🧵 <span id="displayRango">-- al --</span>
    </div>
    <div style="background:#ddd; height:8px; border-radius:4px; margin-top:10px; overflow:hidden;">
        <div id="progressBar" style="background:var(--p); height:100%; width:0%; transition:0.5s;"></div>
    </div>
</div>

<div class="card" style="border-top: 5px solid var(--info); background: #e3f2fd;">
    <label style="color: var(--info); margin-top: 0;">🧵 HILERA EN TRABAJO ACTUAL</label>
    <div style="display: flex; gap: 10px; align-items: center;">
        <input type="number" id="globalHilera" class="input-hilera-actual" placeholder="0" oninput="actualizarInterfaz()">
        <div style="font-size: 10px; color: #555; line-height: 1.1;">Todos los escaneos se guardarán en esta línea.</div>
    </div>
</div>

<div class="nav-buttons">
    <button class="btn-accion" style="background:var(--sup)" onclick="activarEscaneoSup()">🛰️ RECIBIR CUADRO</button>
    <button class="btn-accion" style="background:#455a64" onclick="abrirModal('modalListado')">📋 VER LISTA</button>
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <label>ACTIVIDAD / TRABAJO</label>
        <button onclick="abrirModal('modalConfig')" style="border:none; background:none; color:var(--info); font-weight:bold; font-size:12px;">⚙️ CONFIGURACIÓN</button>
    </div>
    <select id="selActividad"></select>

    <label>TURNO</label>
    <select id="selTurno">
        <option value="9">MATUTINO (9)</option>
        <option value="11">VESPERTINO (11)</option>
        <option value="16">1 TAREA (16)</option>
        <option value="17">2 TAREAS (17)</option>
        <option value="18">MATUTINO VESPERTINO (18)</option>
        <option value="0">SE DESCANSÓ (0)</option>
    </select>
    
    <button id="btnReuse" style="background:var(--info); color:white; border:none; padding:15px; border-radius:12px; font-weight:bold; width:100%; margin-top:15px; display:none;" onclick="reutilizarCuadrilla()">
        ♻️ TRAER GENTE DE LA VEZ PASADA
    </button>

    <div id="reader"></div>
    <div id="status-area">
        <div id="status">CÁMARA LISTA</div>
        <button id="btnCancelSup" class="btn-cancel-scan" onclick="cancelarEscaneoSup()">❌ CANCELAR LECTURA DE JEFE</button>
    </div>

    <div style="display:flex; margin-top:10px; gap:5px;">
        <input type="number" id="manualID" placeholder="N° de Credencial..." style="flex-grow:1;">
        <button class="btn-accion" style="background:var(--accent); width:90px;" onclick="agregarManual()">AÑADIR</button>
    </div>
</div>

<div class="division-box" id="areaCola" style="display:none;">
    <h3 style="margin:0; text-align:center;">👥 GRUPO SELECCIONADO (<span id="colaCount">0</span>)</h3>
    <div class="cola-list" id="colaUI"></div>
    
    <button onclick="guardarGrupo()" style="width:100%; background:var(--p); color:white; padding:20px; border:none; border-radius:15px; font-weight:bold; font-size:20px; box-shadow: 0 6px 0 #1b5e20; margin-top:10px;">✅ GUARDAR EN HILERA <span id="labelHileraBoton">0</span></button>
    <button onclick="vaciarCola()" style="width:100%; background:none; color:red; border:none; margin-top:12px; font-weight:bold; font-size:13px;">X CANCELAR Y BORRAR GRUPO</button>
</div>

<button class="btn-enviar" id="btnReporteFinal" onclick="prepararReporte()">📤 ENTREGAR TRABAJO AL JEFE</button>

<!-- VENTANAS MODALES -->
<div id="modalListado" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:var(--dark)">📋 Lista de Hoy</h2>
        <button onclick="cerrarModal('modalListado')" style="padding:12px 20px; background:var(--danger); color:white; border:none; border-radius:10px; font-weight:bold;">VOLVER</button>
    </div>
    
    <div id="resumenParejas" style="background:var(--s); padding:10px; border-radius:10px; margin-bottom:15px; font-size:11px;">
        <b>🤝 Resumen de Trabajo en Equipo:</b><br>
        <div id="listaParejasStats">Cargando...</div>
    </div>

    <div id="listaRegsUI" style="margin-top:20px;"></div>
    <hr>
    <button onclick="borrarTodo()" style="width:100%; padding:15px; background:white; color:var(--danger); border: 2px solid var(--danger); border-radius:12px; font-weight:bold;">🗑️ BORRAR TODOS LOS REGISTROS</button>
</div>

<div id="modalConfig" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:var(--p)">⚙️ Ajustes</h2>
        <button onclick="cerrarModal('modalConfig')" style="padding:12px 20px; background:#666; color:white; border:none; border-radius:10px; font-weight:bold;">CERRAR</button>
    </div>
    <textarea id="csvActividades" style="height:120px; margin-top:10px;" placeholder="ID, NOMBRE, CLAVE"></textarea>
    <button onclick="cargarActividades()" style="width:100%; padding:15px; background:var(--dark); color:white; border:none; border-radius:10px; margin-top:10px;">ACTUALIZAR ACTIVIDADES</button>
    <hr>
    <input type="text" id="m_cuadro" placeholder="Cuadro">
    <input type="text" id="m_variedad" placeholder="Variedad">
    <select id="m_lado">
        <option value="NORTE">NORTE</option><option value="SUR">SUR</option><option value="ORIENTE">ORIENTE</option><option value="PONIENTE">PONIENTE</option><option value="COMPLETA">COMPLETA</option>
    </select>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <input type="number" id="m_ini" placeholder="Inicio">
        <input type="number" id="m_fin" placeholder="Fin">
    </div>
    <input type="text" id="m_sup" placeholder="Supervisor">
    <button onclick="fijarManual()" style="width:100%; padding:15px; background:var(--warn); color:white; border:none; border-radius:10px; margin-top:10px;">FIJAR MANUAL</button>
    <hr>
    <button onclick="limpiarCuadroActual()" style="width:100%; padding:15px; background:var(--danger); color:white; border:none; border-radius:10px; margin-top:10px; font-weight:bold;">❌ BORRAR CUADRO ACTUAL</button>
</div>

<div id="modalQR" class="modal" style="text-align:center;">
    <h2 style="color:var(--sup)">REPORTE</h2>
    <div id="qrcode" style="display:flex; justify-content:center; margin:20px; background:white; padding:10px;"></div>
    <button class="btn-accion" style="background:var(--p); width:100%;" onclick="descargarReporteFile()">💾 BAJAR ARCHIVO .JSON</button>
    <button onclick="cerrarModal('modalQR')" style="width:100%; padding:15px; background:#ddd; border:none; border-radius:10px; margin-top:20px;">VOLVER</button>
</div>

<script>
let REGS = JSON.parse(localStorage.getItem('c_regs_v7')) || [];
let ACTS = JSON.parse(localStorage.getItem('c_acts_v7')) || [];
let COLA = [];
let CUR = JSON.parse(localStorage.getItem('c_cur_v7')) || { c:"", lado:"", li:0, lf:0, v:"", s:"", vld: false };
let MODO_SUP = false;

window.onload = () => {
    actualizarInterfaz();
    filtrarActividades();
    verificarBotones();
    try {
        const scanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
        scanner.render(alEscanear);
    } catch(e) { document.getElementById('status').innerText = "CÁMARA NO DISPONIBLE"; }
};

function abrirModal(id) { 
    if(id === 'modalListado') {
        calcularEstadisticasParejas();
        renderizarListaHoy();
    }
    document.getElementById(id).style.display = 'block'; 
}
function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

function activarEscaneoSup() { 
    MODO_SUP = true; 
    document.getElementById('status').innerText = "🛰️ ESCANEA EL QR DEL JEFE..."; 
    document.getElementById('status').style.background = "#fff9c4"; 
    document.getElementById('btnCancelSup').style.display = "block";
}

function cancelarEscaneoSup() {
    MODO_SUP = false;
    document.getElementById('status').innerText = "CÁMARA LISTA";
    document.getElementById('status').style.background = "#eee";
    document.getElementById('btnCancelSup').style.display = "none";
}

function alEscanear(codigo) {
    if(MODO_SUP) {
        const p = codigo.split('|');
        if(p[0].startsWith("SUP_") || p[0].startsWith("AGRICACTUS_PACK") || p[0].startsWith("AGRI_REP")) {
            const nuevoC = p[1] || "--";
            
            if(CUR.c && CUR.c !== nuevoC && CUR.c !== "--") {
                if(!confirm(`⚠️ ATENCIÓN: Ya tienes el Cuadro ${CUR.c}. ¿Deseas CORREGIRLO y cambiar al Cuadro ${nuevoC}?`)) {
                    cancelarEscaneoSup();
                    return;
                }
                if(REGS.some(r => r.c === CUR.c)) {
                    if(confirm(`¿Quieres cambiar los registros anteriores del Cuadro ${CUR.c} para que ahora digan Cuadro ${nuevoC}?`)) {
                        REGS.forEach(r => { if(r.c === CUR.c) { r.c = nuevoC; r.vld = true; } });
                        localStorage.setItem('c_regs_v7', JSON.stringify(REGS));
                    }
                }
            }

            CUR = { c: nuevoC, lado: p[2] || "--", li: parseInt(p[3]) || 0, lf: parseInt(p[4]) || 0, v: p[5] || "--", s: p[6] || p[7] || "SIN NOMBRE", vld: true };
            localStorage.setItem('c_cur_v7', JSON.stringify(CUR));
            document.getElementById('mainBody').style.background = "#c8e6c9";
            setTimeout(()=>document.getElementById('mainBody').style.background = "#e0e0e0", 500);
            cancelarEscaneoSup();
            actualizarInterfaz(); 
            verificarBotones();
        }
    } else {
        if(!CUR.c) { alert("¡Primero escanea el QR del Supervisor!"); return; }
        agregarACola(codigo.trim());
    }
}

function agregarACola(id) {
    if(COLA.find(c => c.e === id)) return;
    COLA.push({ e: id });
    document.getElementById('status').innerText = "👤 "+id+" AÑADIDO";
    renderCola();
}

function renderCola() {
    const cont = document.getElementById('colaUI');
    document.getElementById('areaCola').style.display = COLA.length > 0 ? 'block' : 'none';
    document.getElementById('colaCount').innerText = COLA.length;
    cont.innerHTML = COLA.map((item, idx) => `<div class="cola-item"><span><b>${item.e}</b></span><button onclick="removerCola(${idx})" style="background:none; border:none; color:red; font-weight:bold;">QUITAR</button></div>`).join('');
}

function removerCola(idx) { COLA.splice(idx, 1); renderCola(); }
function vaciarCola() { if(confirm("¿Borrar todo este grupo?")) { COLA = []; renderCola(); } }

function guardarGrupo() {
    let hilera = parseInt(document.getElementById('globalHilera').value);
    
    // Si no han puesto hilera, pedirla la primera vez
    if(isNaN(hilera) || hilera === 0) {
        hilera = prompt("⚠️ No has puesto hilera. ¿En qué hilera están trabajando?");
        if(!hilera) return;
        document.getElementById('globalHilera').value = hilera;
        actualizarInterfaz();
    }

    const ahora = new Date();
    const h = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
    const f = ahora.toLocaleDateString('en-GB');
    const turno = document.getElementById('selTurno').value;
    const actID = document.getElementById('selActividad').value;
    const actObj = ACTS.find(a => a.id === actID);
    const groupId = Date.now();

    COLA.forEach((p, i) => {
        REGS.push({
            id: groupId + i, 
            groupId: groupId, 
            f: f, h: h, ts: ahora.getTime(),
            c: CUR.c, l: parseInt(hilera), lado: CUR.lado, v: CUR.v,
            e: p.e, s: CUR.s, t: turno, 
            a: actObj ? actObj.n : "--", ak: actObj ? actObj.ak : "--",
            vld: CUR.vld 
        });
    });

    localStorage.setItem('c_regs_v7', JSON.stringify(REGS));
    COLA = []; 
    renderCola(); 
    actualizarInterfaz();
    document.getElementById('status').innerText = "✅ GRUPO GUARDADO EN LÍNEA "+hilera;
}

function actualizarInterfaz() {
    const card = document.getElementById('cardStatus');
    const badge = document.getElementById('badgeStatus');
    const hileraActual = document.getElementById('globalHilera').value || "0";
    
    document.getElementById('labelHileraBoton').innerText = hileraActual;
    document.getElementById('displayCuadro').innerText = CUR.c || "--";
    document.getElementById('displayLado').innerText = CUR.lado || "--";
    document.getElementById('displayVariedad').innerText = CUR.v || "--";
    document.getElementById('displayRango').innerText = `${CUR.li} al ${CUR.lf}`;
    
    if(CUR.c === "" || CUR.c === "--") {
        badge.innerText = "ESPERANDO ASIGNACIÓN 🛰️";
        badge.className = "pending-badge";
        card.classList.add('pending');
    } else if(CUR.vld) {
        card.classList.remove('pending');
        badge.innerText = "REVISADO ✅";
        badge.className = "valid-badge";
    } else {
        card.classList.add('pending');
        badge.innerText = "PENDIENTE ⚠️";
        badge.className = "pending-badge";
    }

    const hUnicasCuadro = new Set(REGS.filter(r => r.c === CUR.c).map(r => r.l)).size;
    const totalRango = (CUR.lf - CUR.li + 1) || 1;
    const resto = Math.max(0, totalRango - hUnicasCuadro);
    document.getElementById('conteoRestante').innerText = resto;
    document.getElementById('circuloConteo').style.background = resto === 0 ? 'var(--danger)' : (resto < 10 ? 'var(--accent)' : 'var(--p)');
    document.getElementById('progressBar').style.width = Math.min((hUnicasCuadro / totalRango) * 100, 100) + "%";
    actualizarMonitor();
}

function calcularEstadisticasParejas() {
    const stats = {};
    const grupos = {};
    REGS.forEach(r => {
        if(!grupos[r.groupId]) grupos[r.groupId] = [];
        grupos[r.groupId].push(r.e);
    });
    Object.values(grupos).forEach(nombres => {
        if(nombres.length >= 2) {
            const grupoTxt = nombres.sort().join(" + ");
            stats[grupoTxt] = (stats[grupoTxt] || 0) + 1;
        }
    });
    const cont = document.getElementById('listaParejasStats');
    const entries = Object.entries(stats);
    cont.innerHTML = entries.length === 0 ? "Sin datos de grupos aún." : entries.map(([grupo, count]) => `<div>👥 ${grupo}: <b>${count} hileras</b></div>`).join('');
}

function renderizarListaHoy() {
    const cont = document.getElementById('listaRegsUI');
    cont.innerHTML = REGS.slice(-50).reverse().map(r => `
        <div class="reg-item-edit">
            <div>
                <b style="font-size:16px;">${r.e}</b><br>
                <small>HILERA: <span id="valH-${r.id}">${r.l}</span> (${r.c})</small>
            </div>
            <button class="btn-mini-edit" onclick="editarHileraIndividual(${r.id}, ${r.l})">CAMBIAR LÍNEA</button>
        </div>
    `).join('') || "Sin registros.";
}

function editarHileraIndividual(id, valorActual) {
    const nueva = prompt(`Cambiar número de hilera para este registro:`, valorActual);
    if(nueva !== null && nueva !== "") {
        const idx = REGS.findIndex(x => x.id === id);
        if(idx !== -1) {
            REGS[idx].l = parseInt(nueva);
            localStorage.setItem('c_regs_v7', JSON.stringify(REGS));
            renderizarListaHoy();
            actualizarInterfaz();
        }
    }
}

function actualizarMonitor() {
    if(REGS.length === 0) return;
    const hUnicasTotal = new Set(REGS.map(r => `${r.c}-${r.l}-${r.lado}`)).size;
    const ts = REGS.map(r => r.ts);
    const diff = Math.max(0.1, (Math.max(...ts) - Math.min(...ts)) / (3600000));
    document.getElementById('statLineas').innerText = hUnicasTotal;
    document.getElementById('statGente').innerText = [...new Set(REGS.map(r=>r.e))].length;
    document.getElementById('statEficiencia').innerText = (hUnicasTotal / diff).toFixed(1);
}

function fijarManual() {
    CUR = { c: document.getElementById('m_cuadro').value, lado: document.getElementById('m_lado').value, li: parseInt(document.getElementById('m_ini').value), lf: parseInt(document.getElementById('m_fin').value), v: document.getElementById('m_variedad').value || "--", s: document.getElementById('m_sup').value || "MANUAL", vld: false };
    localStorage.setItem('c_cur_v7', JSON.stringify(CUR)); actualizarInterfaz(); cerrarModal('modalConfig'); verificarBotones();
}

function limpiarCuadroActual() {
    if(confirm("¿Seguro que quieres borrar el cuadro actual?")) {
        CUR = { c:"", lado:"", li:0, lf:0, v:"", s:"", vld: false };
        localStorage.setItem('c_cur_v7', JSON.stringify(CUR));
        actualizarInterfaz(); cerrarModal('modalConfig');
    }
}

function cargarActividades() {
    const raw = document.getElementById('csvActividades').value.trim();
    try {
        ACTS = raw.split('\n').map(l => { const p = l.split(','); return { id: p[0].trim(), n: p[1] ? p[1].trim() : p[0].trim(), ak: p[2] ? p[2].trim() : "" }; }).filter(a => a.id !== "");
        localStorage.setItem('c_acts_v7', JSON.stringify(ACTS)); alert("✅ OK"); filtrarActividades(); cerrarModal('modalConfig');
    } catch(e) { alert("Error"); }
}

function filtrarActividades() {
    const sel = document.getElementById('selActividad');
    if(ACTS.length === 0) { sel.innerHTML = '<option value="">Sin actividades</option>'; return; }
    sel.innerHTML = ACTS.map(a => `<option value="${a.id}">${a.n} (${a.ak})</option>`).join('');
}

function prepararReporte() {
    if(REGS.length === 0) return alert("Sin datos.");
    const qrCont = document.getElementById("qrcode"); qrCont.innerHTML = "";
    const pSmall = { res: { l: document.getElementById('statLineas').innerText, g: REGS.length }, det: REGS.slice(-60).map(r => ({ e: r.e, c: r.c, l: r.l, a: r.ak, t: r.t, h: r.h, v: r.vld ? 1 : 0 })) };
    new QRCode(qrCont, { text: "AGRI_REP|" + JSON.stringify(pSmall), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
    abrirModal('modalQR');
}

function descargarReporteFile() {
    const blob = new Blob([JSON.stringify({ detalles: REGS }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Corte_${new Date().toISOString().slice(0,10)}.json`; a.click();
}

function reutilizarCuadrilla() {
    if(REGS.length === 0) return;
    const ult = REGS[REGS.length - 1];
    const g = REGS.filter(r => r.c === ult.c && r.lado === ult.lado).map(r => r.e);
    COLA = [...new Set(g)].map(e => ({ e: e })); renderCola(); actualizarInterfaz();
}

function verificarBotones() { document.getElementById('btnReuse').style.display = REGS.length > 0 ? 'block' : 'none'; }
function borrarTodo() { if(confirm("⚠️ ¿Borrar todo?")) { REGS = []; localStorage.setItem('c_regs_v7', '[]'); actualizarInterfaz(); cerrarModal('modalListado'); } }
function agregarManual() { const id = document.getElementById('manualID').value.trim(); if(id) { agregarACola(id); document.getElementById('manualID').value = ""; } }
</script>
