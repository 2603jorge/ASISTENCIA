<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V86 - REPORTE FINAL</title>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; --blue: #1565c0; --danger: #c62828; --purple: #7b1fa2; --active-tab: #00e676; --burnt: #1b5e20; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; padding-bottom: 50px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 13px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-g { background: var(--main); } .btn-o { background: var(--sec); color: black; }
        .btn-b { background: var(--blue); } .btn-r { background: var(--danger); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }
        .tabs-container { display: flex; overflow-x: auto; gap: 5px; margin-bottom: 10px; padding-bottom: 5px; }
        .tab { background: #333; color: #aaa; padding: 10px 15px; border-radius: 8px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; border: 1px solid #444; }
        .tab.active { background: var(--active-tab); color: black; border-color: var(--active-tab); }
        .checklist-box { background: #1a1a1a; border-radius: 12px; max-height: 200px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #444; text-align: left; }
        .check-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #333; gap: 10px; justify-content: flex-start; }
        .check-item input { width: 22px; height: 22px; margin: 0; flex-shrink: 0; }
        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 5px; max-height: 250px; overflow-y: auto; padding: 8px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid #444; }
        .row-item { height: 45px; background: #333; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: 1px solid #555; position: relative; }
        .active-row { background: var(--sec); color: black; border-color: #ffca28; }
        .done-row { background: var(--burnt); color: #81c784; opacity: 0.9; }
        .row-tag { font-size: 8px; position: absolute; bottom: 2px; width: 95%; text-align: center; overflow: hidden; white-space: nowrap; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">AgriCactus V86</h2>
    <button class="btn btn-b" onclick="abrirDB()">📂 CARGAR BASE DE DATOS</button>
    <div class="card">
        <h3>👷 SUPERVISORES</h3>
        <div id="lista_sups_config"></div>
        <input type="text" id="add_sup_id" placeholder="ID Supervisor" list="lista_personal" onchange="vincularID('add_sup_id', 'add_sup_nom', DB.personal)">
        <input type="text" id="add_sup_nom" placeholder="Nombre" readonly>
        <input type="text" id="add_sup_act" placeholder="Actividad" list="lista_actividades">
        <button class="btn btn-b" onclick="agregarSupervisor()">+ AÑADIR SUPERVISOR</button>
        <label>Meta Personal Total (Límite)</label><input type="number" id="conf_total_global" value="40">
    </div>
    <div class="card">
        <h3>📍 CONFIGURACIÓN INICIAL</h3>
        <label>🕒 Jornada</label><select id="conf_jornada"></select>
        <label>🔍 Cuadro</label><input type="text" id="conf_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('conf')">
        <label>🧭 Orientación</label><select id="conf_ori"></select>
        <label>🚜 Actividad</label><input type="text" id="conf_act" list="lista_actividades">
        <div style="display:flex; gap:10px;"><input type="number" id="conf_inicio" placeholder="Inicio"><input type="number" id="conf_fin" placeholder="Fin"></div>
    </div>
    <button class="btn btn-g" onclick="iniciarSistema()">🚀 INICIAR JORNADA</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div id="disp_sups" style="font-size: 11px; color: var(--active-tab); font-weight: bold;">--</div>
        <div id="disp_count_global" style="background: #333; padding: 5px 12px; border-radius: 20px; font-weight: bold; border: 1px solid var(--active-tab);">0/0</div>
    </div>
    <div class="tabs-container" id="tabsContainer"></div>
    <div id="checklistPersonal" class="checklist-box"></div>
    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input type="text" id="manual_id" placeholder="ID Manual" style="margin:0;"><button class="btn btn-b" style="width:80px; margin:0;" onclick="registrarManual()">OK</button>
    </div>
    <div id="mapGrid" class="grid-map"></div>
    <button class="btn btn-o" style="margin-top:15px;" onclick="avanceMasivoFlow()">⏩ AVANCE 1-CLIC (INTELIGENTE)</button>
    <div style="display:flex; gap:10px;">
        <button class="btn" style="background:var(--purple)" onclick="abrirReporte()">📊 REPORTE PARCIAL</button>
        <button class="btn" style="background:var(--blue)" onclick="abrirEditor()">✏️ EDITOR</button>
    </div>
    <button class="btn btn-r" onclick="descargarReporteFinal()">🏁 FINALIZAR DÍA Y GUARDAR JSON</button>
</div>

<div id="modalAddCuadro" class="modal">
    <h2>➕ CUADRO AGOTADO</h2>
    <div class="card" style="border: 2px solid var(--sec);">
        <label>Cuadro</label><input type="text" id="add_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('add')">
        <label>Orientación</label><select id="add_ori"></select>
        <label>Actividad</label><input type="text" id="add_act" list="lista_actividades">
        <div style="display:flex; gap:10px;"><input type="number" id="add_inicio"><input type="number" id="add_fin"></div>
    </div>
    <button class="btn btn-g" onclick="confirmarNuevoCuadro()">HABILITAR Y DESBORDAR</button>
    <button class="btn btn-r" onclick="cerrarModal('modalAddCuadro')">CANCELAR</button>
</div>

<div id="modalReporte" class="modal">
    <h3>📋 REPORTE ACTUAL</h3>
    <button class="btn btn-b" onclick="descargarJSONParcial()">📡 GENERAR JSON PARCIAL</button>
    <div id="tablaReporte" style="background:white; color:black; padding:10px; border-radius:8px; overflow-x:auto; font-size:10px;"></div>
    <button class="btn btn-r" onclick="cerrarModal('modalReporte')">VOLVER</button>
</div>

<div id="modalDB" class="modal">
    <textarea id="csv_personal" rows="4" placeholder="ID,Nombre,Contratista,Cuadrilla"></textarea>
    <textarea id="csv_cuadros" rows="4" placeholder="ID,Num,Var,Ori,Area,Lin"></textarea>
    <textarea id="csv_act" rows="2" placeholder="ID,Actividad"></textarea>
    <textarea id="csv_jor" rows="2" placeholder="ID,Jornada"></textarea>
    <button class="btn btn-g" onclick="procesarYGuardarBD()">💾 GUARDAR</button>
    <button class="btn btn-r" onclick="cerrarModal('modalDB')">VOLVER</button>
</div>

<div id="modalEditor" class="modal"><h3>✏️ EDITOR</h3><div id="editorList"></div><button class="btn btn-r" onclick="cerrarModal('modalEditor')">CERRAR</button></div>

<datalist id="lista_personal"></datalist><datalist id="lista_cuadros"></datalist><datalist id="lista_actividades"></datalist>

<script>
    let DB = {
        personal: JSON.parse(localStorage.getItem('v86_p')) || [],
        cuadros: JSON.parse(localStorage.getItem('v86_c')) || [],
        actividades: JSON.parse(localStorage.getItem('v86_a')) || [],
        jornadas: JSON.parse(localStorage.getItem('v86_j')) || [],
        sesiones: [], currentIdx: 0, avance: [], staff: [], config: { sups: [] }
    };

    window.onload = actualizarSelectores;

    function descargarJSONParcial() {
        const nombreSup = DB.config.sups.length > 0 ? DB.config.sups[0].nom.replace(/\s+/g, '_') : "Sin_Supervisor";
        const fecha = new Date().toISOString().slice(0, 10);
        const hora = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}).replace(':', 'h');
        const nombreArchivo = `Parcial_${nombreSup}_${fecha}_${hora}.json`;

        const data = { 
            tipo: "PARCIAL", 
            fecha: new Date().toLocaleString(), 
            // AGREGAR ESTO:
            catalogos: {
                cuadros: DB.cuadros.map(c => ({ id: c.id, nombre: c.num })), 
                actividades: DB.actividades.map(a => ({ id: a.id, desc: a.nom })),
                jornadas: DB.jornadas.map(j => ({ id: j.id, desc: j.nom }))
            },
            config: {
                resp: DB.config.sups[0]?.nom || "N/A",
                supId: DB.config.sups[0]?.id || "N/A",
                supAct: DB.config.sups[0]?.act || "N/A",
                jornada: document.getElementById('conf_jornada').value,
                meta: DB.config.meta,
                totalStaff: DB.staff.length
            },
            sups: DB.config.sups, 
            sesiones: DB.sesiones,
            avance: DB.avance 
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = nombreArchivo; 
        a.click();
    }

    function descargarReporteFinal() {
    if(!confirm("¿Cerrar jornada?")) return;
    
    const sup = DB.config.sups[0] || { nom: "Sin_Sup", id: "0", act: "N/A" };
    const fechaStr = new Date().toISOString().slice(0, 10);

// --- INICIO DE LA MEJORA PARA INCLUIR SUPERVISORES ---
        // Creamos una copia del avance actual
        let avanceConSups = [...DB.avance];

        // Obtenemos la jornada y actividad de la configuración actual
        const jornadaActual = document.getElementById('conf_jornada').value;

        // Insertamos a cada supervisor como un registro especial (con 0 líneas)
        DB.config.sups.forEach(s => {
            // Verificamos si el supervisor ya está en el avance para no duplicar
            // (Usamos lin: 0 para que el concentrador sepa que es staff de control)
            avanceConSups.unshift({
                obrero: s.id,
                n: s.nom,
                f: 0,
                nomCuadro: "104", // Cuadro estándar para supervisores
                actividad: s.act,
                inicio: "07:00",
                fin: "07:00",
                uid: "SUP-" + s.id
            });
        });
        // --- FIN DE LA MEJORA
    
    const dataReporte = {
        tipo: "FINAL",
        fecha: new Date().toLocaleString(),
        // ESTO ES LO QUE FALTA PARA EL CONCENTRADOR:
        catalogos: {
            cuadros: DB.cuadros.map(c => ({ id: c.id || "7", nombre: c.num })), 
            actividades: DB.actividades.map(a => ({ id: a.id || "8", desc: a.nom })),
            jornadas: DB.jornadas.map(j => ({ id: j.id || "16", desc: j.nom }))
        },
        config: {
            resp: sup.nom,
            supId: sup.id,
            supAct: sup.act,
            jornada: document.getElementById('conf_jornada').value, // Importante para el ID_JOR
            meta: DB.config.meta,
            totalStaff: DB.staff.length
        },
       sups: DB.config.sups,
            sesiones: DB.sesiones,
            avance: avanceConSups
    };

    const blob = new Blob([JSON.stringify(dataReporte, null, 2)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `FINAL_${sup.nom.replace(/\s+/g, '_')}_${fechaStr}.json`;
    a.click();
    location.reload();
}

    function buscarEspacio(s) {
        let quemadas = new Set(DB.avance.filter(a => a.uid === s.uid && a.fin !== null).map(a => a.f));
        for(let i = s.inicio; i <= s.fin; i++) {
            if(quemadas.has(i)) continue;
            let o = DB.staff.filter(st => st.uid === s.uid && st.f === i).length;
            if(o < 2) return i;
        }
        return null;
    }

    function avanceMasivoFlow() {
        const ahora = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        let activos = DB.staff.filter(st => st.uid === DB.sesiones[DB.currentIdx].uid);
        if(!activos.length) return;
        let pendientes = [];
        activos.forEach(st => {
            let movido = false;
            let r = DB.avance.find(a => a.obrero === st.id && a.uid === st.uid && !a.fin);
            if(r) r.fin = ahora;
            for(let i=0; i < DB.sesiones.length; i++) {
                let idx = (DB.currentIdx + i) % DB.sesiones.length;
                let f = buscarEspacio(DB.sesiones[idx]);
                if(f) {
                    st.f = f; st.uid = DB.sesiones[idx].uid;
                    DB.avance.push({ obrero: st.id, n: st.nom, f: f, nomCuadro: DB.sesiones[idx].num,actividad: DB.sesiones[idx].act, inicio: ahora, fin: null, uid: st.uid });
                    DB.currentIdx = idx; movido = true; break;
                }
            }
            if(!movido) pendientes.push(st);
        });
        if(pendientes.length > 0) { window.pendientes = pendientes; document.getElementById('modalAddCuadro').classList.add('open'); }
        renderTabs(); renderSession(); renderChecklist();
    }

    function togglePersonal(id, check) {
        const ahora = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        if(check) {
            if(DB.staff.length >= DB.config.meta) { alert("LÍMITE ALCANZADO"); return renderChecklist(); }
            let f = buscarEspacio(DB.sesiones[DB.currentIdx]);
            if(!f) return alert("Cuadro lleno");
            let p = DB.personal.find(x=>x.id===id);
            DB.staff.push({ id, nom: p.nom, f, uid: DB.sesiones[DB.currentIdx].uid });
            DB.avance.push({ obrero: id, n: p.nom, f:f, nomCuadro: DB.sesiones[DB.currentIdx].num,actividad: DB.sesiones[DB.currentIdx].act, inicio: ahora, fin: null, uid: DB.sesiones[DB.currentIdx].uid });
        } else {
            let idx = DB.staff.findIndex(st => st.id === id && st.uid === DB.sesiones[DB.currentIdx].uid);
            if(idx > -1) {
                let r = DB.avance.find(a => a.obrero === id && a.uid === DB.sesiones[DB.currentIdx].uid && !a.fin);
                if(r) r.fin = ahora;
                DB.staff.splice(idx, 1);
            }
        }
        renderSession(); renderChecklist();
    }

    function renderSession() {
        const s = DB.sesiones[DB.currentIdx], grid = document.getElementById('mapGrid'); grid.innerHTML = "";
        let quemadas = new Set(DB.avance.filter(a => a.uid === s.uid && a.fin !== null).map(a => a.f));
        for(let i = s.inicio; i <= s.fin; i++) {
            let g = DB.staff.filter(st => st.uid === s.uid && st.f === i);
            let clase = g.length ? 'active-row' : (quemadas.has(i) ? 'done-row' : '');
            grid.innerHTML += `<div class="row-item ${clase}"><span>${i}</span><span class="row-tag">${g.map(x=>x.id).join(',')}</span></div>`;
        }
        document.getElementById('disp_count_global').innerText = `${DB.staff.length}/${DB.config.meta}`;
    }

    function iniciarSistema() {
        DB.config.meta = parseInt(document.getElementById('conf_total_global').value);
        crearSesion('conf'); cerrarModal('viewSetup');
        document.getElementById('viewMain').classList.add('open');
        document.getElementById('disp_sups').innerText = "SUPS: " + DB.config.sups.map(s=>s.nom).join(', ');
        renderTabs(); renderChecklist(); renderSession();
    }

    function alEscribirCuadro(p) {
        const val = document.getElementById(p+'_cuadro').value;
        const regs = DB.cuadros.filter(c=>c.num === val);
        const sel = document.getElementById(p+'_ori');
        if(regs.length > 0) {
            sel.innerHTML = regs.map(o=>`<option value="${o.ori}">${o.ori}</option>`).join('');
            document.getElementById(p+'_inicio').value = 1;
            document.getElementById(p+'_fin').value = regs[0].lin;
        }
    }
    function crearSesion(p) { DB.sesiones.push({ uid: Date.now(), num: document.getElementById(p+'_cuadro').value, ori: document.getElementById(p+'_ori').value, act: document.getElementById(p+'_act').value,inicio: parseInt(document.getElementById(p+'_inicio').value), fin: parseInt(document.getElementById(p+'_fin').value) }); DB.currentIdx = DB.sesiones.length - 1; }
    
    function confirmarNuevoCuadro() { 
        const ahora = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); 
        crearSesion('add'); 
        if(window.pendientes) { 
            window.pendientes.forEach(st => { 
                let f = buscarEspacio(DB.sesiones[DB.currentIdx]); 
                if(f) { 
                    let r = DB.avance.find(a => a.obrero === st.id && a.uid === st.uid && !a.fin); 
                    if(r) r.fin = ahora; 
                    st.f = f; st.uid = DB.sesiones[DB.currentIdx].uid; 
                    DB.avance.push({ obrero: st.id, n: st.nom, f: f, nomCuadro: DB.sesiones[DB.currentIdx].num, actividad: DB.sesiones[DB.currentIdx].act,inicio: ahora, fin: null, uid: DB.sesiones[DB.currentIdx].uid }); 
                } 
            }); 
        } 
        window.pendientes = null; cerrarModal('modalAddCuadro'); renderTabs(); renderSession(); renderChecklist(); 
    }
    
    function cerrarModal(id) { document.getElementById(id).classList.remove('open'); }
    function abrirDB() { document.getElementById('modalDB').classList.add('open'); }
    function renderTabs() { document.getElementById('tabsContainer').innerHTML = DB.sesiones.map((s, i) => `<div class="tab ${i===DB.currentIdx?'active':''}" onclick="DB.currentIdx=${i};renderTabs();renderSession();renderChecklist();">${s.num}</div>`).join('') + `<div class="tab" onclick="document.getElementById('modalAddCuadro').classList.add('open')">+</div>`; }
    function renderChecklist() { document.getElementById('checklistPersonal').innerHTML = DB.personal.filter(p=>!DB.config.sups.map(s=>s.id).includes(p.id)).sort((a,b)=>a.nom.localeCompare(b.nom)).map(p => { const act = DB.staff.some(st => st.id === p.id && st.uid === DB.sesiones[DB.currentIdx].uid); return `<div class="check-item"><input type="checkbox" ${act?'checked':''} onchange="togglePersonal('${p.id}', this.checked)"><span><b>${p.nom}</b> (${p.id})</span></div>`; }).join(''); }
    function agregarSupervisor() { const id=document.getElementById('add_sup_id').value, nom=document.getElementById('add_sup_nom').value, act=document.getElementById('add_sup_act').value; if(id&&act){ DB.config.sups.push({id, nom, act}); renderSupsList(); } }
    function renderSupsList() { document.getElementById('lista_sups_config').innerHTML = DB.config.sups.map((s, i) => `<div style="background:var(--blue); padding:5px; margin-bottom:2px;">${s.nom} <span onclick="DB.config.sups.splice(${i},1);renderSupsList();">✖</span></div>`).join(''); }
    function actualizarSelectores() { document.getElementById('lista_personal').innerHTML = DB.personal.map(p=>`<option value="${p.id}">${p.nom}</option>`).join(''); document.getElementById('lista_cuadros').innerHTML = [...new Set(DB.cuadros.map(c=>c.num))].map(n=>`<option value="${n}">`).join(''); document.getElementById('lista_actividades').innerHTML = DB.actividades.map(a=>`<option value="${a.nom}">`).join(''); document.getElementById('conf_jornada').innerHTML = DB.jornadas.map(j=>`<option value="${j.nom}">${j.nom}</option>`).join(''); }
    function vincularID(i, o, c) { const p = c.find(x=>x.id===document.getElementById(i).value); if(p) document.getElementById(o).value=p.nom; }
    function procesarYGuardarBD() { 
        const p = (id) => document.getElementById(id).value.trim().split('\n').filter(l=>l.includes(',')).map(l=>l.split(',').map(s=>s.trim())); 
        
        // Guardamos el ID (columna 0) y el Nombre (columna 1)
        DB.personal = p('csv_personal').map(c=>({id:c[0], nom:c[1], con:c[2], cua:c[3]})); 
        DB.cuadros = p('csv_cuadros').map(c=>({id:c[0], num:c[1], ori:c[3], lin:parseInt(c[5])})); 
        DB.actividades = p('csv_act').map(c=>({id:c[0], nom:c[1]})); 
        DB.jornadas = p('csv_jor').map(c=>({id:c[0], nom:c[1]})); 
        
        localStorage.setItem('v86_p', JSON.stringify(DB.personal)); 
        localStorage.setItem('v86_c', JSON.stringify(DB.cuadros)); 
        localStorage.setItem('v86_a', JSON.stringify(DB.actividades)); 
        localStorage.setItem('v86_j', JSON.stringify(DB.jornadas)); 
        
        actualizarSelectores(); 
        cerrarModal('modalDB'); 
    }
    
    function abrirReporte() { 
        let h = `<table style="width:100%; border-collapse:collapse;"><tr><th>ID</th><th>NOMBRE</th><th>CUADRO</th><th>IN</th><th>OUT</th></tr>`; 
        DB.avance.forEach(a => { h += `<tr><td>${a.obrero}</td><td>${a.n}</td><td>${a.nomCuadro}</td><td>${a.inicio}</td><td>${a.fin||'ACTIVO'}</td></tr>`; }); 
        document.getElementById('tablaReporte').innerHTML = h + "</table>"; 
        document.getElementById('modalReporte').classList.add('open'); 
    }
    
    function abrirEditor() { const l = document.getElementById('editorList'); l.innerHTML = DB.staff.filter(st => st.uid === DB.sesiones[DB.currentIdx].uid).map(st => `<div class="card" style="display:flex; justify-content:space-between; align-items:center;"><div><b>${st.nom}</b><br>Fila: <input type="number" value="${st.f}" style="width:60px;" onchange="cambiarFila('${st.id}', this.value)"></div><button class="btn btn-r" style="width:auto; padding:10px;" onclick="togglePersonal('${st.id}', false); abrirEditor();">QUITAR</button></div>`).join(''); document.getElementById('modalEditor').classList.add('open'); }
    function cambiarFila(id, nf) { let st = DB.staff.find(x=>x.id===id && x.uid === DB.sesiones[DB.currentIdx].uid); if(st) { st.f = parseInt(nf); let r = DB.avance.find(a => a.obrero === id && !a.fin && a.uid === st.uid); if(r) r.f = parseInt(nf); } renderSession(); }
    function registrarManual() { const v = document.getElementById('manual_id').value; if(v){ togglePersonal(v.trim().toUpperCase(), true); document.getElementById('manual_id').value=""; } }
</script>
</body>
</html>
