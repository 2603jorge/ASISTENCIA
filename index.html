<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V25 - Offline DB</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --light: #f5f5f5; }
        body { font-family: sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; }
        
        /* Estilos Generales */
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; }
        .btn-g { background: var(--main); color: white; }
        .btn-o { background: var(--sec); color: white; }
        .btn-b { background: #2196f3; color: white; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; background: #eee; color: #333; font-size: 16px; box-sizing: border-box; }
        label { font-size: 12px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; }

        /* Mapa Grid */
        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .row-item { height: 50px; background: #333; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border: 2px solid #444; position: relative; }
        .done { background: var(--main); border-color: #66bb6a; color: white; opacity: 0.6; }
        .active { background: var(--sec); border-color: #ffca28; color: black; animation: pulse 1.5s infinite; }
        
        /* Modales */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        
        .db-status { font-size: 11px; text-align: center; color: #aaa; margin-bottom: 15px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">🌵 AGRICACTUS V25</h2>
    
    <div class="db-status" id="dbStatus">
        Comprobando datos guardados...
    </div>
    <button class="btn btn-b" style="font-size:12px; padding:10px;" onclick="abrirDB()">📂 GESTIONAR LISTAS (BD)</button>

    <div class="card">
        <label>Responsable</label>
        <input type="text" id="conf_resp" placeholder="Nombre del Supervisor">

        <label>Cuadro (Seleccionar de Memoria)</label>
        <select id="conf_cuadro" onchange="cargarRangosAuto()">
            <option value="">-- Cargar BD primero --</option>
        </select>
        
        <label>Actividad</label>
        <select id="conf_act">
            <option value="COSECHA">COSECHA</option>
            <option value="PODA">PODA</option>
            <option value="LIMPIEZA">LIMPIEZA</option>
        </select>

        <label>Rango de Hileras</label>
        <div style="display:flex; gap:10px;">
            <input type="number" id="conf_inicio" placeholder="Inicio">
            <input type="number" id="conf_fin" placeholder="Fin">
        </div>

        <label>Personal Total</label>
        <input type="number" id="conf_gente" placeholder="Cantidad de gente hoy">
    </div>

    <button class="btn btn-g" onclick="iniciarJornada()">🚀 INICIAR OPERACIÓN</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div>
            <span style="font-size:12px; color:#aaa;">CUADRO</span><br>
            <b id="disp_cuadro" style="font-size:20px;">--</b>
        </div>
        <button class="btn btn-b" style="width:auto; padding:8px 15px; font-size:12px;" onclick="location.reload()">🔄 SALIR</button>
    </div>

    <div class="card" style="display:grid; grid-template-columns:1fr 1fr; text-align:center;">
        <div>
            <span style="color:#aaa; font-size:12px;">AVANCE</span><br>
            <b id="stat_done" style="font-size:24px; color:var(--main);">0%</b>
        </div>
        <div>
            <span style="color:#aaa; font-size:12px;">ACTIVOS</span><br>
            <b id="stat_active" style="font-size:24px; color:var(--sec);">0</b>
        </div>
    </div>

    <div id="reader" style="width:100%; border-radius:15px; overflow:hidden; border:2px solid #555; height:250px; background:#000;"></div>
    <p style="text-align:center; font-size:11px; color:#aaa;">Escanea credencial para asignar/cerrar fila</p>

    <div class="card">
        <div id="mapGrid" class="grid-map"></div>
    </div>

    <button class="btn btn-o" onclick="descargarReporte()">📥 DESCARGAR REPORTE (CSV)</button>
</div>

<div id="modalDB" class="modal" style="background:#222;">
    <h3>📂 Base de Datos Local</h3>
    <p style="font-size:12px; color:#aaa;">Copia y pega tus datos desde Excel. El formato es simple. Esto se guarda en el teléfono para siempre.</p>
    
    <label>LISTA DE CUADROS (Formato: Nombre,TotalHileras)</label>
    <textarea id="input_csv_cuadros" rows="5" placeholder="Ejemplo:&#10;Cuadro A,50&#10;Cuadro B,100&#10;Lote 5,80" style="background:#fff; color:#000; font-family:monospace;"></textarea>
    
    <label>LISTA DE ACTIVIDADES</label>
    <textarea id="input_csv_act" rows="3" placeholder="Ejemplo:&#10;Cosecha&#10;Deshierbe&#10;Aplicacion" style="background:#fff; color:#000; font-family:monospace;"></textarea>

    <button class="btn btn-g" onclick="guardarBD()">💾 GUARDAR EN TELÉFONO</button>
    <button class="btn" style="background:transparent; border:1px solid #555; color:#aaa;" onclick="cerrarDB()">CANCELAR</button>
</div>

<script>
    // --- LÓGICA DE ALMACENAMIENTO ---
    // Todo se guarda en localStorage con el prefijo 'v25_'
    let DB = {
        cuadros: JSON.parse(localStorage.getItem('v25_cuadros')) || [], // Base de datos maestra
        actividades: JSON.parse(localStorage.getItem('v25_act')) || [],
        sesion: JSON.parse(localStorage.getItem('v25_sesion')) || null, // Configuración actual
        avance: JSON.parse(localStorage.getItem('v25_avance')) || [], // Datos del día
        staff: JSON.parse(localStorage.getItem('v25_staff')) || [] // Trabajadores activos
    };

    let html5QrcodeScanner = null;

    // AL INICIAR
    window.onload = () => {
        actualizarUI_DB();
        
        // Si ya hay una sesión activa, saltar al mapa
        if (DB.sesion && DB.sesion.activo) {
            iniciarInterfazMapa();
        }
    };

    // --- GESTIÓN DE BASE DE DATOS (IMPORTANTE) ---
    function abrirDB() { document.getElementById('modalDB').classList.add('open'); }
    function cerrarDB() { document.getElementById('modalDB').classList.remove('open'); }

    function guardarBD() {
        // Parsear Cuadros (CSV simple)
        let txtC = document.getElementById('input_csv_cuadros').value;
        if(txtC.trim()) {
            DB.cuadros = txtC.split('\n').map(line => {
                let parts = line.split(',');
                return { nombre: parts[0].trim(), max: parseInt(parts[1]) || 50 };
            }).filter(x => x.nombre);
        }

        // Parsear Actividades
        let txtA = document.getElementById('input_csv_act').value;
        if(txtA.trim()) {
            DB.actividades = txtA.split('\n').map(l => l.trim()).filter(x => x);
        }

        // GUARDAR EN MEMORIA DEL TELÉFONO
        localStorage.setItem('v25_cuadros', JSON.stringify(DB.cuadros));
        localStorage.setItem('v25_act', JSON.stringify(DB.actividades));
        
        alert("✅ Datos guardados en el teléfono. Ya puedes usarlos sin internet.");
        actualizarUI_DB();
        cerrarDB();
    }

    function actualizarUI_DB() {
        let statusDiv = document.getElementById('dbStatus');
        let selCuadro = document.getElementById('conf_cuadro');
        let selAct = document.getElementById('conf_act');

        if(DB.cuadros.length > 0) {
            statusDiv.innerHTML = `✅ BD CARGADA: ${DB.cuadros.length} Cuadros disponibles offline.`;
            statusDiv.style.color = "#66bb6a";
            
            // Llenar selectores
            selCuadro.innerHTML = `<option value="">Selecciona Cuadro...</option>` + 
                DB.cuadros.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
        } else {
            statusDiv.innerHTML = `⚠️ SIN DATOS: Carga la lista de cuadros para empezar.`;
            statusDiv.style.color = "#ffca28";
        }

        if(DB.actividades.length > 0) {
            selAct.innerHTML = DB.actividades.map(a => `<option value="${a}">${a}</option>`).join('');
        }
    }

    function cargarRangosAuto() {
        let nombre = document.getElementById('conf_cuadro').value;
        let cuadro = DB.cuadros.find(c => c.nombre === nombre);
        if(cuadro) {
            document.getElementById('conf_inicio').value = 1;
            document.getElementById('conf_fin').value = cuadro.max;
        }
    }

    // --- INICIO DE JORNADA ---
    function iniciarJornada() {
        let c = document.getElementById('conf_cuadro').value;
        let ini = parseInt(document.getElementById('conf_inicio').value);
        let fin = parseInt(document.getElementById('conf_fin').value);
        
        if(!c || !ini || !fin) return alert("Por favor completa la configuración.");

        // Guardar Sesión
        DB.sesion = {
            cuadro: c,
            inicio: ini,
            fin: fin,
            actividad: document.getElementById('conf_act').value,
            responsable: document.getElementById('conf_resp').value,
            activo: true
        };
        // Reiniciar datos del día si es cuadro nuevo
        DB.avance = []; 
        DB.staff = [];
        
        guardarEstado();
        iniciarInterfazMapa();
    }

    function guardarEstado() {
        localStorage.setItem('v25_sesion', JSON.stringify(DB.sesion));
        localStorage.setItem('v25_avance', JSON.stringify(DB.avance));
        localStorage.setItem('v25_staff', JSON.stringify(DB.staff));
        renderMapa();
    }

    // --- PANTALLA PRINCIPAL ---
    function iniciarInterfazMapa() {
        document.getElementById('viewSetup').classList.remove('open');
        document.getElementById('viewMain').classList.add('open');
        document.getElementById('disp_cuadro').innerText = DB.sesion.cuadro;
        
        renderMapa();
        
        // Iniciar Cámara
        if(!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render(onScan);
        }
    }

    function onScan(decodedText) {
        let id = decodedText.trim();
        let audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'); // Sonido beep simple
        
        // LÓGICA DE ASIGNACIÓN AUTOMÁTICA
        // 1. Verificar si el trabajador ya tiene fila asignada
        let trabajador = DB.staff.find(s => s.id === id);
        
        if (trabajador && trabajador.filaActual) {
            // A) YA TIENE FILA -> CERRARLA
            let fila = trabajador.filaActual;
            
            // Buscar registro abierto y cerrarlo
            let registro = DB.avance.find(a => a.fila === fila && !a.fin);
            if(registro) {
                registro.fin = new Date().toLocaleTimeString();
                registro.ts_fin = Date.now();
            }
            
            trabajador.filaActual = null; // Queda libre
            audio.play();
            alert(`✅ ${id}: Terminó fila ${fila}`);

        } else {
            // B) ESTÁ LIBRE -> ASIGNAR NUEVA
            if(!trabajador) {
                trabajador = { id: id, filaActual: null };
                DB.staff.push(trabajador);
            }
            
            let nuevaFila = buscarSiguienteFila();
            if(nuevaFila) {
                trabajador.filaActual = nuevaFila;
                DB.avance.push({
                    fila: nuevaFila,
                    obrero: id,
                    inicio: new Date().toLocaleTimeString(),
                    ts_inicio: Date.now(),
                    fin: null
                });
                audio.play();
                alert(`🚜 ${id}: Asignado a fila ${nuevaFila}`);
            } else {
                alert("🏁 ¡Cuadro Terminado!");
            }
        }
        
        guardarEstado();
    }

    function buscarSiguienteFila() {
        // Busca la primera fila que no esté iniciada por nadie
        for (let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            // Si nadie ha tocado esta fila en el historial
            let ocupada = DB.avance.some(a => a.fila === i);
            if (!ocupada) return i;
        }
        return null; // Todo lleno
    }

    function renderMapa() {
        let grid = document.getElementById('mapGrid');
        grid.innerHTML = "";
        
        let terminadas = 0;
        let activos = 0;

        for (let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            let registro = DB.avance.find(a => a.fila === i);
            let div = document.createElement('div');
            div.className = "row-item";
            div.innerText = i;

            if (registro) {
                if (registro.fin) {
                    div.className += " done"; // Terminada
                    terminadas++;
                } else {
                    div.className += " active"; // Trabajando
                    div.innerHTML += `<br><small style="font-size:8px;">${registro.obrero}</small>`;
                    activos++;
                }
            }
            grid.appendChild(div);
        }

        // Actualizar stats
        let total = DB.sesion.fin - DB.sesion.inicio + 1;
        document.getElementById('stat_done').innerText = Math.round((terminadas/total)*100) + "%";
        document.getElementById('stat_active').innerText = activos;
    }

    function descargarReporte() {
        let csvContent = "data:text/csv;charset=utf-8,Fila,Obrero,Inicio,Fin,Cuadro\n";
        DB.avance.forEach(row => {
            csvContent += `${row.fila},${row.obrero},${row.inicio},${row.fin || "EN PROCESO"},${DB.sesion.cuadro}\n`;
        });
        
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `REPORTE_${DB.sesion.cuadro}.csv`);
        document.body.appendChild(link);
        link.click();
    }
</script>

</body>
</html>
