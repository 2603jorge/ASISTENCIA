<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2e7d32">
    <title>AgriCactus V47 - TOTAL PRO</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; --blue: #1565c0; --danger: #c62828; --purple: #7b1fa2; --active-tab: #00e676; --info: #0288d1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; padding-bottom: 50px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 13px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-g { background: var(--main); } .btn-o { background: var(--sec); color: black; }
        .btn-b { background: var(--blue); } .btn-r { background: var(--danger); } .btn-p { background: var(--purple); }
        .btn-sm { padding: 5px 10px; font-size: 11px; width: auto; margin: 0; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }
        .tabs-container { display: flex; overflow-x: auto; gap: 5px; margin-bottom: 10px; padding-bottom: 5px; }
        .tab { background: #333; color: #aaa; padding: 10px 15px; border-radius: 8px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; border: 1px solid #444; }
        .tab.active { background: var(--active-tab); color: black; border-color: var(--active-tab); }
        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); gap: 4px; max-height: 250px; overflow-y: auto; padding: 5px; background: rgba(0,0,0,0.5); border-radius: 10px; }
        .row-item { height: 40px; background: #333; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: 1px solid #444; position: relative; }
        .done { background: var(--main); border-color: #66bb6a; opacity: 0.5; }
        .active-row { background: var(--sec); border-color: #ffca28; color: black; }
        .row-tag { font-size: 7px; position: absolute; bottom: 1px; width: 100%; text-align: center; overflow: hidden; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        .flex-row { display: flex; gap: 10px; }
        #reader { width: 100% !important; border-radius: 12px; overflow: hidden; background: black; margin-bottom: 10px; min-height: 250px; border: 1px solid #333;}
        .edit-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; background: #222; margin-bottom: 5px; border-radius: 8px;}
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">AgriCactus V47</h2>
    <div class="button-grid">
        <button class="btn btn-b" onclick="alert('Modo Búnker Offline')">🏰 BÚNKER</button>
        <button class="btn btn-g" onclick="location.reload()">🔄 RECARGAR</button>
        <button class="btn btn-b" onclick="abrirDB()">📂 CATÁLOGOS</button>
        <button class="btn btn-p" onclick="abrirHistorial()">📜 HISTORIAL</button>
    </div>
    <div class="card">
        <h3>👷 SUPERVISOR</h3>
        <label>ID Credencial</label><input type="text" id="conf_sup_id">
        <label>Nombre</label><input type="text" id="conf_resp">
        <label>Actividad</label><input type="text" id="conf_sup_act" list="lista_actividades">
        <label>👥 TOTAL PERSONAL</label><input type="number" id="conf_total_global">
    </div>
    <div class="card">
        <h3>📍 CONFIGURACIÓN CAMPO</h3>
        <label>🕒 JORNADA</label><select id="conf_jornada"></select>
        <label>🔍 CUADRO</label><input type="text" id="conf_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('conf')">
        <label>🧭 ORIENTACIÓN</label><input type="text" id="conf_ori" list="lista_orientaciones">
        <label>ACTIVIDAD GRUPO</label><input type="text" id="conf_act" list="lista_actividades">
        <div class="flex-row">
            <div style="flex:1"><label>DESDE</label><input type="number" id="conf_inicio"></div>
            <div style="flex:1"><label>HASTA</label><input type="number" id="conf_fin"></div>
        </div>
        <label>MODO</label>
        <select id="conf_modo"><option value="PAREJAS">PAREJAS</option><option value="INDIVIDUAL">INDIVIDUAL</option></select>
    </div>
    <button class="btn btn-g" onclick="iniciarSistema()">🚀 INICIAR JORNADA</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <div id="disp_resp" style="font-weight:bold; color:var(--main);">--</div>
        <button class="btn btn-i btn-sm" onclick="generarCorteParcial()" style="width:auto; margin:0;">📡 CORTE PARCIAL</button>
        <div id="disp_count_global" style="font-size:12px;">0/0</div>
    </div>
    <div class="tabs-container" id="tabsContainer"></div>
    <div id="reader"></div>
    <button class="btn btn-b btn-sm" id="retryCam" style="display:none; width:100%; margin-bottom:10px;" onclick="forzarCamara()">📷 REINTENTAR CÁMARA</button>
    <div class="flex-row" style="margin-bottom: 10px;">
        <input type="text" id="manual_id" placeholder="ID Manual" style="margin:0; flex:1;">
        <button class="btn btn-b" style="width:80px; margin:0;" onclick="registrarManual()">OK</button>
    </div>
    <div id="mapGrid" class="grid-map"></div>
    <button class="btn btn-o" onclick="ejecutarAvanceMasivoFix()">⏩ AVANCE MASIVO / TRANSFERIR</button>
    <button class="btn btn-p" onclick="abrirReporteAsistencia()">📊 REPORTE ASISTENCIA</button>
    <div class="flex-row">
        <button class="btn btn-b" onclick="abrirEditor()">✏️ EDITAR</button>
        <button class="btn btn-r" onclick="confirmarFinDia()">🏁 CERRAR JORNADA</button>
    </div>
</div>

<div id="modalReporte" class="modal">
    <h2 style="color:var(--active-tab); text-align:center;">📋 ASISTENCIA</h2>
    <div id="tablaAsistenciaContainer" style="overflow-x:auto; background:#fff; color:#000; border-radius:8px; padding:5px; min-height:200px;"></div>
    <button class="btn btn-g" onclick="descargarCSVAsistencia()" style="margin-top:15px;">💾 DESCARGAR CSV</button>
    <button class="btn btn-r" onclick="document.getElementById('modalReporte').classList.remove('open')">VOLVER</button>
</div>

<div id="viewPartial" class="modal" style="background:#111;">
    <h2 id="partial_title" style="color:var(--info); text-align:center;">📡 REPORTE</h2>
    <div class="card" style="text-align:center;">
        <div id="qrcode_partial" style="background:white; padding:10px; display:inline-block; border-radius:10px;"></div>
        <p id="partial_summary" style="font-size:12px; color:#aaa; margin:15px 0;"></p>
        <button class="btn btn-p" onclick="descargarJSONReporte()">💾 DESCARGAR .JSON</button>
    </div>
    <button class="btn btn-b" id="btnFinalCerrar" onclick="cerrarCorteParcial()">🔙 VOLVER AL MAPA</button>
</div>

<div id="modalDB" class="modal">
    <h3>📂 CATÁLOGOS</h3>
    <label>CSV Cuadros (ID,Nombre,Hect,Ori,Plantas,Filas)</label>
    <textarea id="csv_cuadros" placeholder="Ej: 101,CUADRO A,2.5,NORTE,500,80" rows="5"></textarea>
    <label>CSV Actividades (ID,Nombre)</label>
    <textarea id="csv_act" placeholder="Ej: 1,PODA" rows="5"></textarea>
    <label>CSV Jornadas (ID,Nombre)</label>
    <textarea id="csv_jor" placeholder="Ej: 1,DIA" rows="5"></textarea>
    <button class="btn btn-g" onclick="procesarYGuardar()">GUARDAR</button>
    <button class="btn" onclick="document.getElementById('modalDB').classList.remove('open')">VOLVER</button>
</div>

<div id="modalEditor" class="modal"><h2>✏️ EDITOR</h2><div id="editorList"></div><button class="btn" onclick="document.getElementById('modalEditor').classList.remove('open')">CERRAR</button></div>

<div id="modalAddCuadro" class="modal">
    <h2>➕ NUEVO CUADRO</h2>
    <div class="card">
        <label>Cuadro</label><input type="text" id="add_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('add')">
        <label>Orientación</label><input type="text" id="add_ori" list="lista_orientaciones">
        <label>Actividad</label><input type="text" id="add_act" list="lista_actividades">
        <div class="flex-row">
            <div style="flex:1"><label>Desde</label><input type="number" id="add_inicio"></div>
            <div style="flex:1"><label>Hasta</label><input type="number" id="add_fin"></div>
        </div>
        <label>Modo</label><select id="add_modo"><option value="PAREJAS">PAREJAS</option><option value="INDIVIDUAL">INDIVIDUAL</option></select>
    </div>
    <button class="btn btn-g" onclick="confirmarNuevoCuadro()">AÑADIR</button>
    <button class="btn btn-r" onclick="document.getElementById('modalAddCuadro').classList.remove('open')">CANCELAR</button>
</div>

<datalist id="lista_cuadros"></datalist>
<datalist id="lista_actividades"></datalist>
<datalist id="lista_orientaciones"></datalist>

<script>
    let DB = {
        cuadros: JSON.parse(localStorage.getItem('v47_cuadros')) || [],
        actividades: JSON.parse(localStorage.getItem('v47_act')) || [],
        jornadas: JSON.parse(localStorage.getItem('v47_jornadas')) || [],
        sesiones: JSON.parse(localStorage.getItem('v47_sesiones')) || [],
        currentSessionId: parseInt(localStorage.getItem('v47_currentIdx')) || 0,
        avance: JSON.parse(localStorage.getItem('v47_avance')) || [],
        staff: JSON.parse(localStorage.getItem('v47_staff')) || [],
        globalConfig: JSON.parse(localStorage.getItem('v47_config')) || null,
        archive: JSON.parse(localStorage.getItem('v47_archive')) || []
    };

    let html5QrCode = null;
    let lastScanTime = {};
    const audioBeep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    window.onload = () => {
        actualizarSelectores();
        if (DB.globalConfig && DB.sesiones.length > 0) irAlMapa();
    };

    // --- LÓGICA DE ORIENTACIONES (CORREGIDA) ---
    function alEscribirCuadro(prefix) {
        const val = document.getElementById(prefix + '_cuadro').value;
        const regs = DB.cuadros.filter(c => c.nombre === val);
        
        if (regs.length > 0) {
            // Cargar TODAS las orientaciones disponibles para este cuadro sin repetir
            const orientacionesUnicas = [...new Set(regs.map(r => r.ori))];
            const listO = document.getElementById('lista_orientaciones');
            listO.innerHTML = orientacionesUnicas.map(o => `<option value="${o}">`).join('');
            
            // Auto-completar datos basados en el primero (pero dejar elegir orientación)
            document.getElementById(prefix + '_inicio').value = 1;
            document.getElementById(prefix + '_fin').value = regs[0].max;
            // No forzamos el valor de orientación para que el usuario use el datalist
        }
    }

    // --- SISTEMA ---
    function iniciarSistema() {
        const resp = document.getElementById('conf_resp').value, total = parseInt(document.getElementById('conf_total_global').value);
        if(!resp || isNaN(total)) return alert("Faltan datos.");
        DB.globalConfig = { resp, supId: document.getElementById('conf_sup_id').value, supAct: document.getElementById('conf_sup_act').value, jornada: document.getElementById('conf_jornada').value, totalStaff: total };
        DB.sesiones = []; DB.staff = []; DB.avance = []; 
        crearSesionDesdeForm('conf'); irAlMapa();
    }

    function crearSesionDesdeForm(p) {
        const c = document.getElementById(p + '_cuadro').value;
        const ori = document.getElementById(p + '_ori').value;
        DB.sesiones.push({ 
            uid: Date.now(), 
            cuadro: c, 
            orientacion: ori,
            act: document.getElementById(p + '_act').value, 
            inicio: parseInt(document.getElementById(p + '_inicio').value), 
            fin: parseInt(document.getElementById(p + '_fin').value), 
            modo: document.getElementById(p + '_modo').value 
        });
        DB.currentSessionId = DB.sesiones.length - 1; 
        guardarTodo();
    }

    function irAlMapa() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
        document.getElementById('viewMain').classList.add('open');
        document.getElementById('disp_resp').innerText = DB.globalConfig.resp;
        renderTabs(); renderSession(); startCam();
    }

    function startCam() {
        if(html5QrCode) { html5QrCode.stop().then(() => initScanner()); } else { initScanner(); }
    }

    function initScanner() {
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, onScan).catch(() => {
            document.getElementById('retryCam').style.display = 'block';
        });
    }

    function forzarCamara() { startCam(); }

    function onScan(id) {
        id = id.trim().toUpperCase();
        let now = Date.now();
        if (lastScanTime[id] && (now - lastScanTime[id] < 3000)) return;
        lastScanTime[id] = now;
        audioBeep.play();
        
        let sA = DB.sesiones[DB.currentSessionId], t = DB.staff.find(s => s.id === id);
        if(!t) { 
            if (DB.staff.length >= DB.globalConfig.totalStaff) return alert("¡Límite alcanzado!");
            t = { id, fila: null, cuadroUid: null }; DB.staff.push(t); 
        }
        
        if(t.fila !== null) {
            if(t.cuadroUid === sA.uid) {
                let n = prompt(`ID ${t.id} en Fila ${t.fila}. ¿Mover a?`, buscarSiguienteFilaVacia(sA));
                if(n) { cerrarTarea(t); asignarFilaEspecifica(t, parseInt(n), sA); }
            } else {
                if(confirm(`Viene de otro cuadro. ¿Pasar al cuadro actual?`)) { cerrarTarea(t); asignarFilaEspecifica(t, buscarSiguienteFilaVacia(sA), sA); }
            }
        } else { asignarFilaEspecifica(t, buscarSiguienteFilaVacia(sA), sA); }
        guardarTodo(); renderSession();
    }

    function asignarFilaEspecifica(t, f, s) {
        if(f > s.fin) return alert("¡Cuadro lleno!");
        t.fila = f; t.cuadroUid = s.uid;
        DB.avance.push({ fila: f, obrero: t.id, inicio: new Date().toLocaleTimeString(), fin: null, nomCuadro: s.cuadro, cuadroUid: s.uid, supAct: s.act });
    }

    function cerrarTarea(t) {
        let reg = DB.avance.find(a => a.obrero === t.id && a.fin === null);
        if(reg) reg.fin = new Date().toLocaleTimeString();
        t.fila = null; t.cuadroUid = null;
    }

    function buscarSiguienteFilaVacia(s) {
        let ocupadas = new Set(DB.avance.filter(a => a.cuadroUid === s.uid && a.fin !== null).map(a => a.fila));
        for(let i = s.inicio; i <= s.fin; i++) {
            if(ocupadas.has(i)) continue;
            let o = DB.staff.filter(st => st.cuadroUid === s.uid && st.fila === i).length;
            if(s.modo === 'PAREJAS' ? o < 2 : o === 0) return i;
        }
        return s.fin + 1;
    }

    function ejecutarAvanceMasivoFix() {
        let sO = DB.sesiones[DB.currentSessionId];
        let activos = DB.staff.filter(st => st.cuadroUid === sO.uid && st.fila !== null);
        if (!activos.length) return alert("Sin personal activo.");

        let pF = buscarSiguienteFilaVacia(sO);
        if (pF > sO.fin) {
            let siguienteIdx = DB.currentSessionId + 1;
            let sDestino = DB.sesiones[siguienteIdx];
            if (sDestino) {
                if (confirm(`¿Transferir personal al cuadro ${sDestino.cuadro}?`)) {
                    activos.forEach(t => { cerrarTarea(t); asignarFilaEspecifica(t, buscarSiguienteFilaVacia(sDestino), sDestino); });
                    DB.currentSessionId = siguienteIdx;
                    guardarTodo(); renderTabs(); renderSession();
                }
            } else {
                if (confirm("Cuadro lleno. ¿Añadir otro cuadro ahora?")) document.getElementById('modalAddCuadro').classList.add('open');
            }
        } else {
            if (confirm(`¿Avanzar grupos?`)) {
                let grupos = {}; activos.forEach(t => { if(!grupos[t.fila]) grupos[t.fila] = []; grupos[t.fila].push(t); });
                Object.keys(grupos).map(Number).sort((a,b)=>a-b).forEach(f => {
                    let nextF = buscarSiguienteFilaVacia(sO);
                    if(nextF <= sO.fin) { grupos[f].forEach(t => { cerrarTarea(t); asignarFilaEspecifica(t, nextF, sO); }); }
                });
                guardarTodo(); renderSession();
            }
        }
    }

    // --- REPORTES Y CIERRE ---
    function generarCorteParcial() {
        document.getElementById('partial_title').innerText = "📡 CORTE PARCIAL";
        const qrData = { 
            resp: DB.globalConfig.resp, 
            personal: DB.staff.length, 
            avance: DB.avance.length,
            cuadro: DB.sesiones[DB.currentSessionId].cuadro
        };
        document.getElementById('viewMain').classList.remove('open');
        document.getElementById('viewPartial').classList.add('open');
        
        const qC = document.getElementById('qrcode_partial'); qC.innerHTML = "";
        new QRCode(qC, { text: JSON.stringify(qrData), width: 260, height: 260 });
        document.getElementById('partial_summary').innerText = `Resp: ${qrData.resp} | Personal: ${qrData.personal} | Registros: ${qrData.avance}`;
    }

    function cerrarCorteParcial() {
        document.getElementById('viewPartial').classList.remove('open');
        document.getElementById('viewMain').classList.add('open');
    }

    function confirmarFinDia() {
        if(confirm("¿Cerrar jornada completa?")) {
            DB.staff.forEach(t => { if(t.fila) cerrarTarea(t); });
            DB.archive.push({ fecha: new Date().toLocaleString(), config: DB.globalConfig, avance: [...DB.avance] });
            localStorage.setItem('v47_archive', JSON.stringify(DB.archive));
            
            // Limpieza y reinicio
            localStorage.removeItem('v47_sesiones');
            localStorage.removeItem('v47_avance');
            localStorage.removeItem('v47_staff');
            localStorage.removeItem('v47_config');
            location.reload();
        }
    }

    // --- UI RENDER ---
    function renderMapa() {
        let s = DB.sesiones[DB.currentSessionId]; if(!s) return;
        const grid = document.getElementById('mapGrid'); grid.innerHTML = "";
        let term = new Set(DB.avance.filter(a => a.cuadroUid === s.uid && a.fin !== null).map(a => a.fila));
        for(let i = s.inicio; i <= s.fin; i++) {
            let div = document.createElement('div'), gente = DB.staff.filter(st => st.cuadroUid === s.uid && st.fila === i);
            div.className = "row-item " + (gente.length ? "active-row" : (term.has(i) ? "done" : ""));
            div.innerHTML = `<span>${i}</span>` + (gente.length ? `<span class="row-tag">${gente.map(g=>g.id).join(',')}</span>` : "");
            grid.appendChild(div);
        }
    }

    function renderSession() { renderMapa(); if(DB.globalConfig) document.getElementById('disp_count_global').innerText = `${DB.staff.length}/${DB.globalConfig.totalStaff}`; }
    
    function renderTabs() {
        const container = document.getElementById('tabsContainer');
        container.innerHTML = DB.sesiones.map((s, idx) => {
            return `<div class="tab ${idx === DB.currentSessionId ? 'active' : ''}" onclick="cambiarTab(${idx})">${s.cuadro} - ${s.orientacion}</div>`;
        }).join('') + `<div class="tab" style="background:var(--blue);color:white" onclick="document.getElementById('modalAddCuadro').classList.add('open')">+</div>`;
    }

    function cambiarTab(idx) { DB.currentSessionId = idx; renderTabs(); renderSession(); }

    function procesarYGuardar() {
        const txtC = document.getElementById('csv_cuadros').value, txtA = document.getElementById('csv_act').value, txtJ = document.getElementById('csv_jor').value;
        if(txtC.trim()) DB.cuadros = txtC.split('\n').map(l => { let c = l.split(/[,\t]/); return (c.length >= 6) ? { id: c[0].trim(), nombre: c[1].trim(), ori: c[3].trim(), max: parseInt(c[5].trim()) } : null }).filter(x => x);
        if(txtA.trim()) DB.actividades = txtA.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        if(txtJ.trim()) DB.jornadas = txtJ.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        guardarTodo(); actualizarSelectores(); document.getElementById('modalDB').classList.remove('open');
    }

    function guardarTodo() {
        localStorage.setItem('v47_cuadros', JSON.stringify(DB.cuadros));
        localStorage.setItem('v47_act', JSON.stringify(DB.actividades));
        localStorage.setItem('v47_jornadas', JSON.stringify(DB.jornadas));
        localStorage.setItem('v47_sesiones', JSON.stringify(DB.sesiones));
        localStorage.setItem('v47_currentIdx', DB.currentSessionId);
        localStorage.setItem('v47_avance', JSON.stringify(DB.avance));
        localStorage.setItem('v47_staff', JSON.stringify(DB.staff));
        localStorage.setItem('v47_config', JSON.stringify(DB.globalConfig));
    }

    function confirmarNuevoCuadro() {
        crearSesionDesdeForm('add');
        document.getElementById('modalAddCuadro').classList.remove('open');
        renderTabs(); renderSession();
    }

    function registrarManual() { 
        let v = document.getElementById('manual_id').value.toUpperCase(); 
        if(v) { onScan(v); document.getElementById('manual_id').value = ""; } 
    }

    function abrirHistorial() {
        if (!DB.archive.length) return alert("Vacio");
        let h = `<h2>📜 HISTORIAL</h2>`;
        DB.archive.forEach((item, idx) => { h += `<div class="card">${item.fecha} <button class="btn-sm btn-b" onclick="descargarHistorialIdx(${idx})">⬇️</button></div>`; });
        document.getElementById('editorList').innerHTML = h; document.getElementById('modalEditor').classList.add('open');
    }

    function descargarHistorialIdx(idx) {
        let b = new Blob([JSON.stringify(DB.archive[idx], null, 2)], {type: 'application/json'});
        let a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `HISTORICO.json`; a.click();
    }
    
    function abrirEditor() {
        let s = DB.sesiones[DB.currentSessionId];
        const list = document.getElementById('editorList'); list.innerHTML = "";
        DB.staff.filter(st => st.cuadroUid === s.uid && st.fila !== null).forEach(st => {
            list.innerHTML += `<div class="edit-item"><b>${st.id}</b> - Fila: ${st.fila} <button class="btn-sm btn-r" onclick="borrarRegistroManual('${st.id}')">X</button></div>`;
        });
        document.getElementById('modalEditor').classList.add('open');
    }

    function borrarRegistroManual(id) {
        if(!confirm(`¿Eliminar registro?`)) return;
        let st = DB.staff.find(x=>x.id===id);
        if(st) {
            let idx = DB.avance.findIndex(a=>a.obrero===id && a.fin===null && a.cuadroUid===st.cuadroUid);
            if(idx !== -1) DB.avance.splice(idx, 1);
            st.fila = null; st.cuadroUid = null;
            guardarTodo(); renderSession(); abrirEditor();
        }
    }
</script>
</body>
</html>
