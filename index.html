<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus Pro - Cuadrillero V7</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --p: #2e7d32; --s: #f1f8e9; --danger: #d32f2f; 
            --info: #1976d2; --sup: #673ab7; --accent: #f57c00; --dark: #212121; 
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #e0e0e0; margin: 0; padding: 10px; padding-bottom: 100px; }
        
        /* Dashboard de arriba - Muy visual */
        .monitor-avance { 
            background: var(--dark); color: white; padding: 15px; border-radius: 15px; 
            margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; text-align: center;
        }
        .monitor-avance b { font-size: 18px; display: block; color: var(--accent); }
        .monitor-avance span { font-size: 10px; text-transform: uppercase; opacity: 0.8; }

        /* Estado del Cuadro actual */
        .config-status { 
            background: white; border: 3px solid var(--p); padding: 15px; border-radius: 15px; 
            margin-bottom: 10px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .conteo-grande { 
            position: absolute; top: 10px; right: 10px; width: 60px; height: 60px; 
            background: var(--p); color: white; border-radius: 50%; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .conteo-grande small { font-size: 8px; text-transform: uppercase; }

        /* Botones Principales */
        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-accion { 
            padding: 15px; border: none; border-radius: 12px; font-weight: bold; 
            color: white; font-size: 14px; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .card { background: white; padding: 15px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Inputs y Selects Gigantes */
        label { display: block; font-weight: bold; font-size: 12px; color: #333; margin-top: 10px; margin-bottom: 5px; }
        select, input { 
            width: 100%; height: 55px; border: 2px solid #ccc; border-radius: 10px; 
            font-size: 18px; padding: 0 15px; box-sizing: border-box; background: #fafafa;
        }
        
        /* Zona de Escaneo */
        #reader { width: 100%; background: #000; border-radius: 15px; margin-top: 10px; overflow: hidden; border: 4px solid #fff; }
        #status { text-align: center; font-weight: bold; padding: 15px; border-radius: 10px; margin: 10px 0; font-size: 16px; background: #eee; }

        /* La "Fila" de gente esperando */
        .division-box { 
            background: #fff3e0; border: 3px solid var(--accent); padding: 15px; 
            border-radius: 15px; margin-top: 10px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        
        .cola-list { max-height: 200px; overflow-y: auto; margin: 10px 0; }
        .cola-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: white; padding: 12px; border-radius: 10px; margin-bottom: 5px; border: 1px solid #ffccbc;
        }

        /* Modales */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; padding: 20px; box-sizing: border-box; }
        
        /* Botón de Enviar - El más importante */
        .btn-enviar { 
            position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--sup); 
            color: white; padding: 20px; border: none; border-radius: 20px; font-weight: bold; 
            font-size: 18px; box-shadow: 0 6px 20px rgba(103, 58, 183, 0.4); z-index: 1000;
        }

        .btn-edit { background: #eee; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; color: #555; }
        .success-flash { animation: flashGreen 0.5s; }
        @keyframes flashGreen { from { background: var(--p); } to { background: white; } }
    </style>
</head>
<body id="mainBody">

<div class="monitor-avance">
    <div><span>Hileras</span><b id="statLineas">0</b></div>
    <div><span>Gente</span><b id="statGente">0</b></div>
    <div><span>L/Hora</span><b id="statEficiencia">0.0</b></div>
</div>

<div class="config-status">
    <div class="conteo-grande" id="circuloConteo">
        <span id="conteoRestante">0</span>
        <small>Faltan</small>
    </div>
    <div style="width: 80%;">
        <span style="font-size: 10px; color: #666;">TRABAJANDO EN:</span><br>
        <b>CUADRO <span id="displayCuadro">--</span></b> (<span id="displayLado">--</span>)<br>
        🌱 <span id="displayVariedad">--</span> | 🧵 <span id="displayRango">-- al --</span>
    </div>
    <div class="progress-container"><div id="progressBar"></div></div>
</div>

<div class="nav-buttons">
    <button class="btn-accion" style="background:var(--sup)" onclick="activarEscaneoSup()">🛰️ RECIBIR CUADRO</button>
    <button class="btn-accion" style="background:#455a64" onclick="abrirRegistros()">📋 VER LISTA</button>
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <label>ACTIVIDAD / TRABAJO</label>
        <button onclick="abrirModal('modalConfig')" style="border:none; background:none; color:var(--info); font-size:11px;">⚙️ AJUSTES</button>
    </div>
    <select id="selActividad"></select>

    <label>TURNO</label>
    <select id="selTurno">
        <option value="9">MATUTINO (9)</option>
        <option value="11">VESPERTINO (11)</option>
        <option value="16">1 TAREA (16)</option>
        <option value="17">2 TAREAS (17)</option>
        <option value="18">MATUTINO VESPERTINO (18)</option>
        <option value="0">SE DESCANSÓ (0)</option>
    </select>
    
    <button id="btnReuse" style="background:var(--info); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; width:100%; margin-top:15px; display:none;" onclick="reutilizarCuadrilla()">
        ♻️ TRAER GENTE DE LA VEZ PASADA
    </button>

    <div id="reader"></div>
    <div id="status">CÁMARA LISTA</div>

    <div style="display:flex; margin-top:10px; gap:5px;">
        <input type="number" id="manualID" placeholder="N° de Credencial..." style="flex-grow:1;">
        <button class="btn-accion" style="background:var(--accent); width:80px;" onclick="agregarManual()">AÑADIR</button>
    </div>
</div>

<div class="division-box" id="areaCola" style="display:none;">
    <h3 style="margin:0; text-align:center;">👥 GENTE LISTA (<span id="colaCount">0</span>)</h3>
    <div class="cola-list" id="colaUI"></div>
    <button onclick="guardarGrupo()" style="width:100%; background:var(--p); color:white; padding:20px; border:none; border-radius:15px; font-weight:bold; font-size:20px; box-shadow: 0 6px 0 #1b5e20;">✅ GUARDAR ESTE GRUPO</button>
    <button onclick="vaciarCola()" style="width:100%; background:none; color:red; border:none; margin-top:10px; font-weight:bold;">X CANCELAR Y BORRAR FILA</button>
</div>

<!-- BOTÓN GIGANTE FINAL -->
<button class="btn-enviar" onclick="prepararReporte()">📤 ENTREGAR TRABAJO AL JEFE</button>

<!-- MODAL LISTADO (Simplificado) -->
<div id="modalListado" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>LISTA DE HOY</h2>
        <button onclick="cerrarModal('modalListado')" style="padding:10px; background:#f44336; color:white; border:none; border-radius:8px;">CERRAR</button>
    </div>
    <div id="listaRegsUI" style="max-height: 70vh; overflow-y: auto;"></div>
    <button onclick="borrarTodo()" style="width:100%; margin-top:20px; padding:15px; background:white; color:red; border: 2px solid red; border-radius:10px;">🗑️ BORRAR TODO EL DÍA</button>
</div>

<!-- MODAL CONFIGURACIÓN (Solo para el que sabe) -->
<div id="modalConfig" class="modal">
    <h3>⚙️ CATÁLOGOS Y AJUSTES</h3>
    <label>PEGAR ACTIVIDADES (ID, NOMBRE, CLAVE)</label>
    <textarea id="csvActividades" style="height:150px;"></textarea>
    <button onclick="cargarActividades()" style="width:100%; padding:15px; background:black; color:white; border-radius:10px;">CARGAR DATOS</button>
    <hr>
    <h3>AJUSTE MANUAL DE CUADRO</h3>
    <input type="text" id="m_cuadro" placeholder="Número de Cuadro">
    <input type="text" id="m_variedad" placeholder="Variedad">
    <select id="m_lado">
        <option value="NORTE">NORTE</option><option value="SUR">SUR</option><option value="ORIENTE">ORIENTE</option><option value="PONIENTE">PONIENTE</option><option value="COMPLETA">COMPLETA</option>
    </select>
    <input type="number" id="m_ini" placeholder="Hilera Inicio">
    <input type="number" id="m_fin" placeholder="Hilera Fin">
    <input type="text" id="m_sup" placeholder="Supervisor">
    <button onclick="fijarManual()" style="width:100%; padding:15px; background:var(--p); color:white; border-radius:10px; font-weight:bold;">FIJAR MANUALMENTE</button>
    <button onclick="cerrarModal('modalConfig')" style="width:100%; margin-top:20px; padding:15px; background:#ddd; border:none; border-radius:10px;">VOLVER</button>
</div>

<!-- MODAL QR FINAL -->
<div id="modalQR" class="modal" style="text-align:center;">
    <h2>TRABAJO LISTO</h2>
    <p>Enséñale este código al Jefe:</p>
    <div id="qrcode" style="display:flex; justify-content:center; margin:20px; border:10px solid white; border-radius:10px;"></div>
    <button class="btn-accion" style="background:var(--p); width:100%;" onclick="descargarReporteFile()">💾 O DESCARGAR ARCHIVO (.JSON)</button>
    <button onclick="cerrarModal('modalQR')" style="width:100%; padding:15px; background:#ddd; border:none; border-radius:10px; margin-top:20px;">VOLVER</button>
</div>

<script>
let REGS = JSON.parse(localStorage.getItem('c_regs_v7')) || [];
let ACTS = JSON.parse(localStorage.getItem('c_acts_v7')) || [];
let COLA = [];
let CUR = JSON.parse(localStorage.getItem('c_cur_v7')) || { c:"", lado:"", li:0, lf:0, v:"", s:"" };
let MODO_SUP = false;

window.onload = () => {
    actualizarInterfaz();
    filtrarActividades();
    verificarBotones();
    const scanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
    scanner.render(alEscanear);
};

function alEscanear(codigo) {
    if(MODO_SUP) {
        const p = codigo.split('|');
        if(p[0].startsWith("SUP_")) {
            CUR = { c: p[1], lado: p[2], li: parseInt(p[3]), lf: parseInt(p[4]), v: p[5] || "--", s: p[6] || p[7] || "SIN NOMBRE" };
            localStorage.setItem('c_cur_v7', JSON.stringify(CUR));
            document.getElementById('mainBody').classList.add('success-flash');
            setTimeout(()=>document.getElementById('mainBody').classList.remove('success-flash'), 500);
            actualizarInterfaz(); MODO_SUP = false;
            document.getElementById('status').innerText = "✅ CUADRO "+CUR.c+" CARGADO";
            verificarBotones();
        }
    } else {
        if(!CUR.c) return alert("¡Alto! Primero escanea el código del Jefe/Supervisor.");
        agregarACola(codigo.trim());
    }
}

function agregarACola(id) {
    if(REGS.find(r => r.e === id && r.c === CUR.c && r.lado === CUR.lado)) {
        document.getElementById('status').innerText = "⚠️ "+id+" YA ESTÁ REGISTRADO";
        return;
    }
    if(COLA.find(c => c.e === id)) return;
    COLA.push({ e: id });
    document.getElementById('status').innerText = "👤 "+id+" AÑADIDO A FILA";
    renderCola();
    actualizarInterfaz();
}

function renderCola() {
    const cont = document.getElementById('colaUI');
    document.getElementById('areaCola').style.display = COLA.length > 0 ? 'block' : 'none';
    document.getElementById('colaCount').innerText = COLA.length;
    cont.innerHTML = COLA.map((item, idx) => `
        <div class="cola-item">
            <span><b>${item.e}</b></span>
            <button class="btn-remove" onclick="removerCola(${idx})">QUITAR</button>
        </div>
    `).join('');
}

function guardarGrupo() {
    const ahora = new Date();
    const h = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
    const f = ahora.toLocaleDateString('en-GB');
    const turno = document.getElementById('selTurno').value;
    const actID = document.getElementById('selActividad').value;
    const actObj = ACTS.find(a => a.id === actID);

    COLA.forEach((p, i) => {
        let ocupadosActualmente = REGS.filter(r => r.c === CUR.c && r.lado === CUR.lado).length;
        let hilera = CUR.li + Math.floor((ocupadosActualmente + i) / 2); 
        if(hilera > CUR.lf) hilera = CUR.lf;

        REGS.push({
            id: Date.now() + i, f: f, h: h, ts: ahora.getTime(),
            c: CUR.c, l: hilera, lado: CUR.lado, v: CUR.v,
            e: p.e, s: CUR.s, t: turno, a: actObj ? actObj.n : "--", ak: actObj ? actObj.ak : "--"
        });
    });

    localStorage.setItem('c_regs_v7', JSON.stringify(REGS));
    COLA = []; renderCola(); actualizarInterfaz();
    document.getElementById('status').innerText = "✅ TRABAJADORES GUARDADOS";
}

function actualizarInterfaz() {
    document.getElementById('displayCuadro').innerText = CUR.c || "--";
    document.getElementById('displayLado').innerText = CUR.lado || "--";
    document.getElementById('displayVariedad').innerText = CUR.v || "--";
    document.getElementById('displayRango').innerText = `${CUR.li} al ${CUR.lf}`;
    document.getElementById('sup').value = CUR.s;
    
    let totalCap = (CUR.lf - CUR.li + 1) * 2;
    let ocupados = REGS.filter(r => r.c === CUR.c && r.lado === CUR.lado).length;
    let enCola = COLA.length;
    let resto = Math.max(0, totalCap - ocupados - enCola);

    document.getElementById('conteoRestante').innerText = resto;
    document.getElementById('circuloConteo').style.background = resto === 0 ? 'var(--danger)' : (resto < 5 ? 'var(--accent)' : 'var(--p)');
    document.getElementById('progressBar').style.width = Math.min(((ocupados + enCola) / (totalCap || 1)) * 100, 100) + "%";
    document.getElementById('displayCapacidad').innerText = `Ocupado: ${ocupados + enCola}/${totalCap}`;
    
    actualizarMonitor();
}

function actualizarMonitor() {
    if(REGS.length === 0) return;
    const hUnicas = new Set(REGS.map(r => `${r.c}-${r.l}-${r.lado}`)).size;
    const ts = REGS.map(r => r.ts);
    const diff = Math.max(0.1, (Math.max(...ts) - Math.min(...ts)) / (3600000));
    document.getElementById('statLineas').innerText = hUnicas;
    document.getElementById('statGente').innerText = [...new Set(REGS.map(r=>r.e))].length;
    document.getElementById('statEficiencia').innerText = (hUnicas / diff).toFixed(1);
    document.getElementById('labelHora').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function prepararReporte() {
    if(REGS.length === 0) return alert("No has registrado a nadie todavía.");
    const qrCont = document.getElementById("qrcode");
    qrCont.innerHTML = "";
    // Solo últimos 50 por QR para que lea rápido
    const pSmall = { res: { l: document.getElementById('statLineas').innerText, g: REGS.length }, det: REGS.slice(-50).map(r => ({ e: r.e, c: r.c, l: r.l, a: r.ak, t: r.t, h: r.h })) };
    new QRCode(qrCont, { text: "AGRI_REP|" + JSON.stringify(pSmall), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L });
    abrirModal('modalQR');
}

function abrirRegistros() {
    const cont = document.getElementById('listaRegsUI');
    cont.innerHTML = REGS.slice(-100).reverse().map(r => `
        <div style="border-bottom:1px solid #ddd; padding:10px; background:#f9f9f9; margin-bottom:5px; border-radius:8px;">
            <b>${r.e}</b> - Cuadro ${r.c} (L:${r.l})<br>
            <small>${r.a} | ${r.h} | Turno: ${r.t}</small>
        </div>
    `).join('') || "No hay registros hoy";
    abrirModal('modalListado');
}

function descargarReporteFile() {
    const p = { fecha: new Date().toLocaleDateString(), resumen: { lineas: document.getElementById('statLineas').innerText, gente: REGS.length }, detalles: REGS };
    const blob = new Blob([JSON.stringify(p, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Corte_AgriCactus_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
}

function filtrarActividades() {
    const bus = (document.getElementById('busA') ? document.getElementById('busA').value.toLowerCase() : "");
    const sel = document.getElementById('selActividad');
    const filt = ACTS.filter(a => a.n.toLowerCase().includes(bus) || (a.ak && a.ak.toLowerCase().includes(bus)));
    sel.innerHTML = filt.map(a => `<option value="${a.id}">${a.n} (${a.ak})</option>`).join('');
}

function cargarActividades() {
    const raw = document.getElementById('csvActividades').value.trim();
    if(!raw) return;
    ACTS = raw.split('\n').map(l => { const p = l.split(','); return { id: p[0].trim(), n: p[1].trim(), ak: p[2].trim() }; });
    localStorage.setItem('c_acts_v7', JSON.stringify(ACTS)); alert("✅ Catálogo Actualizado"); filtrarActividades();
}

function fijarManual() {
    CUR = { c: document.getElementById('m_cuadro').value, lado: document.getElementById('m_lado').value, li: parseInt(document.getElementById('m_ini').value), lf: parseInt(document.getElementById('m_fin').value), v: document.getElementById('m_variedad').value || "--", s: document.getElementById('m_sup').value || "MANUAL" };
    localStorage.setItem('c_cur_v7', JSON.stringify(CUR)); actualizarInterfaz(); cerrarModal('modalConfig'); verificarBotones();
}

function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
function verificarBotones() { document.getElementById('btnReuse').style.display = REGS.length > 0 ? 'block' : 'none'; }
function borrarTodo() { if(confirm("¿Estás seguro? Se borrarán todos los registros de hoy.")) { REGS = []; localStorage.setItem('c_regs_v7', '[]'); actualizarInterfaz(); cerrarModal('modalListado'); } }
function activarEscaneoSup() { MODO_SUP = true; document.getElementById('status').innerText = "🛰️ ESCANEA EL QR DEL JEFE..."; }
function agregarManual() { const id = document.getElementById('manualID').value.trim(); if(id) { agregarACola(id); document.getElementById('manualID').value = ""; } }
function vaciarCola() { if(confirm("¿Vaciar fila?")) { COLA = []; renderCola(); actualizarInterfaz(); } }
function reutilizarCuadrilla() { if(REGS.length === 0) return; const ult = REGS[REGS.length - 1]; const g = REGS.filter(r => r.c === ult.c && r.lado === ult.lado).map(r => r.e); COLA = [...new Set(g)].map(e => ({ e: e })); renderCola(); actualizarInterfaz(); }
</script>
</body>
</html>
