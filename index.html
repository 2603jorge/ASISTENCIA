<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus Maestro V14.0 - Vista Cuadros</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #2e7d32; --accent: #f57c00; --dark: #121212; --danger: #d32f2f; --info: #1976d2; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: #1a1a1a; margin: 0; padding: 10px; color: white;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://raw.githubusercontent.com/tu-usuario/tu-repo/main/image_83f71e.jpg'); 
            background-size: cover; background-attachment: fixed;
        }
        .setup-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; z-index: 5000; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: none; background: rgba(255,255,255,0.95); font-size: 16px; box-sizing: border-box; color: #333; font-weight: bold; }
        .btn { padding: 18px; border: none; border-radius: 15px; font-weight: bold; width: 100%; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        .btn-p { background: var(--p); color: white; }
        .btn-info { background: var(--info); color: white; font-size: 11px; padding: 10px; margin-bottom: 10px; }
        
        .manual-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .manual-box input { margin-bottom: 0; flex-grow: 1; }
        .manual-box .btn-mini { width: 80px; padding: 0; background: var(--accent); color: white; border-radius: 12px; border: none; font-weight: bold; }

        .map-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr)); 
            gap: 8px; 
            margin-top: 15px; 
            max-height: 300px; 
            overflow-y: auto; 
            padding: 10px; 
            background: rgba(0,0,0,0.4); 
            border-radius: 15px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .row-box { 
            height: 45px; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px; 
            font-weight: bold; 
            background: #333; 
            border: 2px solid #444; 
            transition: 0.3s;
        }
        .row-done { background: var(--p) !important; border-color: #81c784; box-shadow: 0 0 8px var(--p); }
        .row-active { background: var(--accent) !important; border-color: #ffb74d; animation: pulse 2s infinite; }
        .row-tag { font-size: 8px; opacity: 0.9; text-transform: uppercase; margin-top: 2px; }
        
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.95); } }
        .hidden { display: none !important; }
        label { display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; color: #aaa; }
        .edit-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 6px solid var(--info); color: white; }
    </style>
</head>
<body>

<div id="screenSetup" class="setup-screen">
    <div style="text-align:center; margin-bottom:20px;">
        <img src="https://raw.githubusercontent.com/tu-usuario/tu-repo/main/image_83f31f.png" style="max-width:180px;">
    </div>
    <button class="btn btn-info" onclick="abrirModal('modalImport')">📂 CARGAR CUADROS / ACTIVIDADES</button>
    <div class="glass">
        <label>Responsable</label><input type="text" id="in_resp">
        <label>N° Trabajadores</label><input type="number" id="in_gente">
        <label>Cuadro</label><input type="text" id="in_cuadro" list="lC" oninput="sugerir()">
        <datalist id="lC"></datalist>
        <label>Actividad</label><input type="text" id="in_act" list="lA">
        <datalist id="lA"></datalist>
        <label>Rango Hileras (Ej: 1-50)</label><input type="text" id="in_rangos">
    </div>
    <button class="btn btn-p" onclick="iniciarMision()">DESPLEGAR EQUIPO</button>
</div>

<div id="screenCheckIn" class="setup-screen hidden">
    <h2 style="text-align: center; color: var(--accent);">👤 REGISTRO DE PERSONAL</h2>
    <div id="readerCheckIn" style="border-radius:15px; overflow:hidden;"></div>
    <div class="manual-box glass">
        <input type="number" id="manualCheckIn" placeholder="N° Credencial...">
        <button class="btn-mini" onclick="regManualCheckIn()">ADD</button>
    </div>
    <div id="listaCheckIn" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;"></div>
    <button class="btn btn-p" id="btnIrAMapa" onclick="autoAsignarYPasar()" style="display: none; margin-top: 20px;">INICIAR MAPA DE AVANCE</button>
</div>

<div id="mainUI" class="hidden">
    <div class="glass" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom:10px;">
        <div style="text-align:center;"><small>HECHAS</small><br><b id="statH" style="font-size:24px; color:#4caf50;">0</b></div>
        <div style="text-align:center;"><small>PERSONAL</small><br><b id="statP" style="font-size:24px; color:var(--accent);">0/0</b></div>
    </div>
    
    <div class="glass">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <b>📍 CUADRO <span id="dispC">--</span></b>
            <button onclick="nuevoCuadroRapido()" style="background:var(--info); border:none; color:white; padding:5px 10px; border-radius:8px; font-size:10px; font-weight:bold;">🔄 NUEVO CUADRO</button>
        </div>
        <div id="mapaHileras" class="map-grid"></div>
    </div>

    <div id="readerMain" style="border-radius:20px; overflow:hidden; border:2px solid white; margin:10px 0;"></div>
    
    <div class="manual-box glass">
        <input type="number" id="manualAvance" placeholder="ID para Mover...">
        <button class="btn-mini" onclick="regManualAvance()">MOVER</button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn" style="background:var(--info); color:white;" onclick="abrirModal('modalListado')">👥 GESTIÓN</button>
        <button class="btn btn-accent" onclick="prepararReporte()">📤 REPORTES</button>
    </div>
</div>

<div id="modalListado" class="setup-screen hidden">
    <h2>🛠️ Edición de Cuadrilla</h2>
    <div id="listaEdicionUI"></div>
    <button class="btn btn-p" style="margin-top:20px;" onclick="cerrarModal('modalListado')">VOLVER AL MAPA</button>
</div>

<div id="modalImport" class="setup-screen hidden">
    <h3>📂 Catálogos Maestros</h3>
    <textarea id="csvC" placeholder="Cuadros: ID, Lado, Hileras, Var"></textarea>
    <textarea id="csvA" placeholder="Actividades: ID, Desc, Clave"></textarea>
    <button class="btn btn-p" onclick="saveDB()">GUARDAR</button>
    <button class="btn" onclick="cerrarModal('modalImport')" style="background:none; color:white;">VOLVER</button>
</div>

<div id="modalQR" class="setup-screen hidden">
    <h2 style="text-align:center;">REPORTES</h2>
    <div class="glass" style="background:white; color:black; text-align:center; padding:15px;">
        <div id="qr1" style="display:flex; justify-content:center; margin-bottom:10px;"></div>
        <div id="qr2" style="display:flex; justify-content:center;"></div>
    </div>
    <button class="btn" style="background:var(--danger); color:white; margin-top:10px;" onclick="if(confirm('¿Reiniciar todo?')){localStorage.clear();location.reload();}">🛑 FIN JORNADA</button>
    <button class="btn btn-p" style="margin-top:10px;" onclick="cerrarModal('modalQR')">VOLVER</button>
</div>

<script>
let CONFIG = JSON.parse(localStorage.getItem('v13_conf')) || null;
let STAFF = JSON.parse(localStorage.getItem('v13_staff')) || [];
let AVANCE = JSON.parse(localStorage.getItem('v13_avan')) || [];
let DB_C = JSON.parse(localStorage.getItem('v13_db_c')) || [];
let DB_A = JSON.parse(localStorage.getItem('v13_db_a')) || [];
const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

window.onload = () => {
    actualizarSugerencias();
    if(CONFIG) {
        if(STAFF.length < CONFIG.gente) iniciarCheckIn();
        else pasarAMapa();
    }
};

function nuevoCuadroRapido() {
    if(confirm("¿Deseas asignar un nuevo cuadro/actividad manteniendo al personal?")) {
        // Marcamos como terminadas las hileras actuales para que se graben en el reporte
        AVANCE.forEach(a => { if(!a.fin) a.fin = Date.now(); });
        STAFF.forEach(s => s.l = 0);
        save();
        document.getElementById('mainUI').classList.add('hidden');
        document.getElementById('screenSetup').classList.remove('hidden');
    }
}

function iniciarMision() {
    const rInput = document.getElementById('in_rangos').value;
    if(!rInput.includes('-')) return alert("Formato hileras: 1-50");
    const r = rInput.split('-').map(Number);
    CONFIG = { resp: document.getElementById('in_resp').value, gente: parseInt(document.getElementById('in_gente').value), cuadro: document.getElementById('in_cuadro').value, act: document.getElementById('in_act').value, start: r[0], end: r[1], meta: (r[1]-r[0]+1) };
    localStorage.setItem('v13_conf', JSON.stringify(CONFIG));
    
    // Si ya tenemos personal de una misión anterior, vamos directo al mapa
    if(STAFF.length > 0) autoAsignarYPasar();
    else iniciarCheckIn();
}

function autoAsignarYPasar() {
    let hList = []; for(let i=CONFIG.start; i<=CONFIG.end; i++) hList.push(i);
    STAFF.forEach((p, idx) => {
        let hIdx = Math.floor(idx / 2);
        let hAsignada = hList[hIdx] || CONFIG.start;
        AVANCE.push({ e: p.id, l: hAsignada, inicio: Date.now(), fin: null, act: CONFIG.act });
        p.l = hAsignada;
    });
    save(); 
    pasarAMapa();
}

function ejecutarMovimiento(id, nH) {
    if (nH >= CONFIG.start && nH <= CONFIG.end) {
        let p = STAFF.find(x => x.id == id);
        // Al mover, damos por concluida la hilera anterior (se pone verde)
        AVANCE.forEach(a => { if(a.e == id && !a.fin) a.fin = Date.now(); });
        // Registramos la nueva hilera asignada
        AVANCE.push({ e: id, l: nH, inicio: Date.now(), fin: null, act: CONFIG.act });
        p.l = nH; audio.play(); save();
    } else alert("Rango inválido");
}

function onScanAvance(id) {
    let p = STAFF.find(x => x.id == id.trim());
    if(!p) return alert("ID no registrado.");
    // El sistema informa hilera actual y pregunta a cuál se mueve (concluyendo la actual)
    let nH = prompt(`ID ${id.trim()} terminó hilera ${p.l}.\n¿A qué hilera se mueve ahora?`);
    if(nH) ejecutarMovimiento(id.trim(), parseInt(nH));
}

function actualizarInterfaz() {
    // Las hileras hechas son aquellas que tienen fecha de 'fin' (fueron concluidas)
    document.getElementById('statH').innerText = new Set(AVANCE.filter(a=>a.fin).map(a=>a.l)).size;
    document.getElementById('statP').innerText = `${STAFF.length}/${CONFIG.gente}`;
    document.getElementById('dispC').innerText = CONFIG.cuadro;
    const mapa = document.getElementById('mapaHileras'); 
    mapa.innerHTML = "";
    for(let i=CONFIG.start; i<=CONFIG.end; i++) {
        let d = document.createElement('div'); 
        d.className="row-box"; 
        d.innerHTML=`<span>${i}</span>`;
        // Pintar de verde (Hechas)
        if(AVANCE.some(a=>a.l==i && a.fin)) d.classList.add('row-done');
        // Pintar de naranja (Activas)
        const g = STAFF.filter(s=>s.l == i).length;
        if(g > 0) {
            d.classList.add('row-active');
            d.innerHTML += `<span class="row-tag">${g==1?'MITAD':'PAR'}</span>`;
        }
        mapa.appendChild(d);
    }
}

function renderEdicion() {
    const cont = document.getElementById('listaEdicionUI');
    cont.innerHTML = STAFF.map((s, idx) => `
        <div class="edit-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div><b>ID: ${s.id}</b><br><small>Hilera: ${s.l}</small></div>
                <div style="display:flex; gap:5px;">
                    <button class="btn-mini" style="background:var(--info); height:35px;" onclick="editarID(${idx})">ID</button>
                    <button class="btn-mini" style="background:var(--accent); height:35px;" onclick="editarHilera(${idx})">MOVE</button>
                </div>
            </div>
        </div>
    `).join('');
}

function editarID(idx) {
    const nID = prompt("Corregir ID para " + STAFF[idx].id + ":", STAFF[idx].id);
    if(nID && nID !== STAFF[idx].id) {
        let vID = STAFF[idx].id;
        STAFF[idx].id = nID;
        AVANCE.forEach(a => { if(a.e === vID) a.e = nID; });
        save(); renderEdicion();
    }
}

function editarHilera(idx) {
    const nH = prompt("Cambiar manualmente a hilera:", STAFF[idx].l);
    if(nH) { ejecutarMovimiento(STAFF[idx].id, parseInt(nH)); renderEdicion(); }
}

function prepararReporte() {
    abrirModal('modalQR');
    document.getElementById('qr1').innerHTML = ""; 
    document.getElementById('qr2').innerHTML = "";
    const hDone = new Set(AVANCE.filter(a=>a.fin).map(a=>a.l)).size;
    new QRCode(document.getElementById('qr1'), { text: JSON.stringify({resp: CONFIG.resp, cuadro: CONFIG.cuadro, act: CONFIG.act, hechas: hDone}), width: 150, height: 150 });
    new QRCode(document.getElementById('qr2'), { text: JSON.stringify(STAFF.map(s => s.id)), width: 150, height: 150 });
}

function save() { localStorage.setItem('v13_staff', JSON.stringify(STAFF)); localStorage.setItem('v13_avan', JSON.stringify(AVANCE)); actualizarInterfaz(); }
function saveDB() {
    DB_C = document.getElementById('csvC').value.split('\n').map(l=>{const p=l.split(','); return {id:p[0].trim(), h:p[2]?.trim()||0};});
    DB_A = document.getElementById('csvA').value.split('\n').map(l=>{const p=l.split(','); return {id:p[0].trim(), n:p[1]?.trim()||""};});
    localStorage.setItem('v13_db_c', JSON.stringify(DB_C)); localStorage.setItem('v13_db_a', JSON.stringify(DB_A));
    actualizarSugerencias(); cerrarModal('modalImport');
}
function actualizarSugerencias() {
    document.getElementById('lC').innerHTML = DB_C.map(c=>`<option value="${c.id}">`).join('');
    document.getElementById('lA').innerHTML = DB_A.map(a=>`<option value="${a.n}">`).join('');
}
function sugerir() { const m = DB_C.find(c=>c.id == document.getElementById('in_cuadro').value); if(m) document.getElementById('in_rangos').value = `1-${m.h}`; }
function regManualCheckIn() { const val = document.getElementById('manualCheckIn').value.trim(); if(val) procesarCheckIn(val), document.getElementById('manualCheckIn').value = ""; }
function procesarCheckIn(id) { if (STAFF.length < CONFIG.gente && !STAFF.some(s => s.id === id)) { STAFF.push({ id: id, l: 0 }); save(); renderCheckInList(); if (STAFF.length >= CONFIG.gente) document.getElementById('btnIrAMapa').style.display = 'block'; } }
function renderCheckInList() { document.getElementById('listaCheckIn').innerHTML = STAFF.map(s => `<div style="background:rgba(255,255,255,0.2); padding:5px; border-radius:8px; font-size:10px; text-align:center;">👤 ${s.id}</div>`).join(''); }
function iniciarCheckIn() { document.getElementById('screenSetup').classList.add('hidden'); document.getElementById('screenCheckIn').classList.remove('hidden'); renderCheckInList(); new Html5QrcodeScanner("readerCheckIn", {fps:20, qrbox:200}).render(procesarCheckIn); }
function pasarAMapa() { document.getElementById('screenSetup').classList.add('hidden'); document.getElementById('screenCheckIn').classList.add('hidden'); document.getElementById('mainUI').classList.remove('hidden'); setTimeout(() => { actualizarInterfaz(); new Html5QrcodeScanner("readerMain", {fps:20, qrbox:250}).render(onScanAvance); }, 500); }
function regManualAvance() { const val = document.getElementById('manualAvance').value.trim(); if(val) onScanAvance(val); document.getElementById('manualAvance').value = ""; }
function abrirModal(id) { if(id==='modalListado') renderEdicion(); document.getElementById(id).classList.remove('hidden'); }
function cerrarModal(id) { document.getElementById(id).classList.add('hidden'); }
</script>
</body>
</html>
