<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V47 - TOTAL OFFLINE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; --blue: #1565c0; --danger: #c62828; --purple: #7b1fa2; --active-tab: #00e676; --info: #0288d1; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; padding-bottom: 50px; }
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 13px; margin-bottom: 12px; cursor: pointer; text-transform: uppercase; color: white; display: block; box-sizing: border-box; }
        .btn-g { background: var(--main); } .btn-o { background: var(--sec); color: black; }
        .btn-b { background: var(--blue); } .btn-r { background: var(--danger); } .btn-p { background: var(--purple); }
        .btn-sm { padding: 8px 12px; font-size: 11px; width: auto; margin: 0; display: inline-block; }
        .flex-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .flex-row .btn { margin-bottom: 0; flex: 1; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }
        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; max-height: 280px; overflow-y: auto; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .row-item { height: 42px; background: #333; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; border: 1px solid #444; position: relative; }
        .done { background: var(--main); border-color: #66bb6a; opacity: 0.5; }
        .active-row { background: var(--sec); border-color: #ffca28; color: black; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        #reader { width: 100% !important; border-radius: 12px; overflow: hidden; background: black; margin-bottom: 15px; min-height: 250px; }
        .status-box { padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; font-size: 12px; }
        .status-ok { background: #1b5e20; color: #00e676; border: 1px solid #00e676; }
        .status-ko { background: #b71c1c; color: #ff8a80; border: 1px solid #ff8a80; }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">AgriCactus V47</h2>
    
    <div id="offlineStatus" class="status-box status-ko">Estado: No guardado en teléfono</div>
    <div class="flex-row">
        <button class="btn btn-sm btn-b" onclick="forzarDescarga()">📥 DESCARGAR CEREBRO</button>
        <button class="btn btn-sm btn-g" onclick="verificarAlmacenamiento()">🔄 VERIFICAR</button>
    </div>

    <div class="flex-row">
        <button class="btn btn-b" onclick="abrirDB()">📂 BD</button>
        <button class="btn btn-p" onclick="abrirHistorial()">📜 HISTORIAL</button>
    </div>

    <div class="card">
        <label>Nombre Supervisor</label><input type="text" id="conf_resp">
        <label>👥 Total Personal</label><input type="number" id="conf_total_global">
    </div>

    <div class="card">
        <label>🔍 Cuadro</label><input type="text" id="conf_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('conf')">
        <label>Actividad</label><input type="text" id="conf_act" list="lista_actividades">
        <div class="flex-row">
            <input type="number" id="conf_inicio" placeholder="Desde">
            <input type="number" id="conf_fin" placeholder="Hasta">
        </div>
    </div>
    <button class="btn btn-g" onclick="iniciarSistema()">🚀 INICIAR JORNADA</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div id="disp_resp" style="font-weight:bold; color:var(--main);">--</div>
        <div id="disp_count_global" style="font-size:12px;">0/0</div>
    </div>
    <div id="reader"></div>
    <div id="mapGrid" class="grid-map"></div>
    <div style="margin-top:15px;">
        <button class="btn btn-p" onclick="abrirReporteAsistencia()">📊 REPORTE</button>
        <button class="btn btn-r" onclick="confirmarFinDia()">🏁 CERRAR DÍA</button>
    </div>
</div>

<div id="viewPartial" class="modal" style="background:#111;">
    <h2 style="text-align:center;">📡 REPORTE FINAL</h2>
    <div class="card" style="text-align:center;">
        <div id="qrcode_partial" style="background:white; padding:10px; display:inline-block; border-radius:10px;"></div>
        <button class="btn btn-p" onclick="descargarJSONReporte()" style="margin-top:15px;">💾 GUARDAR JSON</button>
    </div>
    <button class="btn btn-b" id="btnSalidaFinal" onclick="location.reload()">🏁 FINALIZAR Y VOLVER AL INICIO</button>
</div>

<div id="modalDB" class="modal"><h3>📂 Catálogos</h3><textarea id="csv_cuadros" rows="5"></textarea><button class="btn btn-g" onclick="procesarYGuardar()">GUARDAR</button><button class="btn" onclick="document.getElementById('modalDB').classList.remove('open')">VOLVER</button></div>

<script>
    const CACHE_NAME = 'agri-v47-cache-v1';
    let DB = { 
        cuadros: JSON.parse(localStorage.getItem('v47_cuadros')) || [], 
        actividades: JSON.parse(localStorage.getItem('v47_act')) || [],
        sesiones: JSON.parse(localStorage.getItem('v47_sesiones')) || [],
        avance: JSON.parse(localStorage.getItem('v47_avance')) || [],
        staff: JSON.parse(localStorage.getItem('v47_staff')) || [],
        globalConfig: JSON.parse(localStorage.getItem('v47_config')) || { resp: "", totalStaff: 0 },
        archive: JSON.parse(localStorage.getItem('v47_archive')) || []
    };

    let scanner = null;

    // --- 🚀 LÓGICA DE ALMACENAMIENTO OFFLINE ---
    async function forzarDescarga() {
        const status = document.getElementById('offlineStatus');
        status.innerText = "⏳ DESCARGANDO... NO CIERRES";
        try {
            const cache = await caches.open(CACHE_NAME);
            const urls = [location.href, 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js', 'https://unpkg.com/html5-qrcode'];
            for (const url of urls) { await cache.add(url); }
            alert("✅ Cerebro guardado. Revisa ahora 'Datos almacenados' en Chrome.");
            verificarAlmacenamiento();
        } catch (e) { alert("❌ Error: Necesitas internet para descargar."); }
    }

    async function verificarAlmacenamiento() {
        const status = document.getElementById('offlineStatus');
        if ('caches' in window) {
            const cache = await caches.open(CACHE_NAME);
            const keys = await cache.keys();
            if (keys.length >= 3) {
                status.className = "status-box status-ok";
                status.innerText = "✅ TODO GUARDADO: LISTO PARA EL CAMPO";
            } else {
                status.innerText = "⚠️ NO GUARDADO: PICA 'DESCARGAR'";
            }
        }
    }

    // --- RESTO DE FUNCIONES RESTAURADAS ---
    function abrirDB() { document.getElementById('modalDB').classList.add('open'); }
    function procesarYGuardar() {
        const txtC = document.getElementById('csv_cuadros').value;
        const txtA = document.getElementById('csv_act').value;
        const txtJ = document.getElementById('csv_jor').value;
        if(txtC.trim()) {
            DB.cuadros = txtC.split('\n').map(l => { let c = l.split(/[,\t]/); return (c.length >= 6) ? { id: c[0].trim(), nombre: c[1].trim(), ori: c[3].trim(), max: parseInt(c[5].trim()) } : null }).filter(x => x);
        }
        if(txtA.trim()) DB.actividades = txtA.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        if(txtJ.trim()) DB.jornadas = txtJ.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        localStorage.setItem('v47_cuadros', JSON.stringify(DB.cuadros));
        localStorage.setItem('v47_act', JSON.stringify(DB.actividades));
        localStorage.setItem('v47_jornadas', JSON.stringify(DB.jornadas));
        actualizarSelectores();
        document.getElementById('modalDB').classList.remove('open');
        alert("Catálogos cargados correctamente");
    }

    function actualizarSelectores() {
        const listaC = document.getElementById('lista_cuadros');
        const listaA = document.getElementById('lista_actividades');
        const nombresUnicos = [...new Set(DB.cuadros.map(c => c.nombre))];
        listaC.innerHTML = nombresUnicos.map(nombre => `<option value="${nombre}">`).join('');
        listaA.innerHTML = DB.actividades.map(a => `<option value="${a.desc}">`).join('');
        document.getElementById('conf_jornada').innerHTML = DB.jornadas.map(j => `<option value="${j.desc}">${j.desc}</option>`).join('');
    }

    function alEscribirCuadro(prefix) {
        const val = document.getElementById(prefix + '_cuadro').value;
        const registros = DB.cuadros.filter(c => c.nombre === val);
        if (registros.length > 0) {
            const primero = registros[0];
            document.getElementById(prefix + '_inicio').value = 1;
            document.getElementById(prefix + '_fin').value = primero.max;
            const listaOri = document.getElementById('lista_orientaciones');
            const orientacionesUnicas = [...new Set(registros.map(r => r.ori))];
            listaOri.innerHTML = orientacionesUnicas.map(o => `<option value="${o}">`).join('');
            if (orientacionesUnicas.length === 1) document.getElementById(prefix + '_ori').value = orientacionesUnicas[0];
        }
    }

    function iniciarSistema() {
        const resp = document.getElementById('conf_resp').value;
        const total = parseInt(document.getElementById('conf_total_global').value);
        if(!resp || isNaN(total)) return alert("Faltan datos");
        DB.globalConfig = { resp, supId: document.getElementById('conf_sup_id').value, supAct: document.getElementById('conf_sup_act').value, jornada: document.getElementById('conf_jornada').value, totalStaff: total };
        DB.sesiones = []; DB.staff = []; DB.avance = [];
        crearSesionDesdeForm('conf');
        irAlMapa();
    }

    function crearSesionDesdeForm(prefix) {
        const cuadro = document.getElementById(prefix + '_cuadro').value;
        if (!cuadro) return alert("Selecciona un cuadro");
        DB.sesiones.push({ uid: Date.now(), cuadro, act: document.getElementById(prefix + '_act').value, inicio: parseInt(document.getElementById(prefix + '_inicio').value) || 1, fin: parseInt(document.getElementById(prefix + '_fin').value) || 10, modo: document.getElementById(prefix + '_modo').value });
        DB.currentSessionId = DB.sesiones.length - 1;
        guardarTodo();
    }

    function confirmarNuevoCuadro() {
        crearSesionDesdeForm('add');
        document.getElementById('modalAddCuadro').classList.remove('open');
        renderTabs(); renderSession();
    }

    function irAlMapa() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
        document.getElementById('viewMain').classList.add('open');
        document.getElementById('disp_resp').innerText = DB.globalConfig.resp;
        renderTabs(); renderSession();
        // CÁMARA MEJORADA OFFLINE
        if(!scanner) { 
            scanner = new Html5QrcodeScanner("reader", { 
                fps: 15, 
                qrbox: 250, 
                rememberLastUsedCamera: true 
            }, false); // El false es vital para NO buscar archivos en internet
            scanner.render(onScan); 
        }
    }

    function renderTabs() {
        const container = document.getElementById('tabsContainer');
        container.innerHTML = DB.sesiones.map((s, idx) => `<div class="tab ${idx === DB.currentSessionId ? 'active' : ''}" onclick="cambiarTab(${idx})">${s.cuadro}</div>`).join('') + `<div class="tab tab-add" onclick="document.getElementById('modalAddCuadro').classList.add('open')">+</div>`;
    }

    function cambiarTab(idx) { DB.currentSessionId = idx; renderTabs(); renderSession(); }

    function onScan(id) {
        id = id.trim().toUpperCase();
        let now = Date.now();
        if (lastScanTime[id] && (now - lastScanTime[id] < 3000)) return;
        lastScanTime[id] = now;
        let s = DB.sesiones[DB.currentSessionId];
        let t = DB.staff.find(x => x.id === id);
        if(!t) {
            if (DB.staff.length >= DB.globalConfig.totalStaff) return alert("⛔ Límite alcanzado");
            t = { id, fila: null, cuadroUid: null };
            DB.staff.push(t);
        }
        if(t.fila !== null) {
            if(t.cuadroUid === s.uid) {
                let n = prompt(`Ya está en Fila ${t.fila}. ¿Mover a?`, buscarSiguienteFilaVacia(s));
                if(n) { cerrarTarea(t); asignarFilaEspecifica(t, parseInt(n), s); }
            } else {
                if(confirm("¿Pasar a este cuadro actual?")) { cerrarTarea(t); asignarFilaEspecifica(t, buscarSiguienteFilaVacia(s), s); }
            }
        } else { asignarFilaEspecifica(t, buscarSiguienteFilaVacia(s), s); }
        audioBeep.play(); guardarTodo(); renderSession();
    }

    function buscarSiguienteFilaVacia(sesion) {
        let quemadas = new Set(DB.avance.filter(a => a.cuadroUid === sesion.uid && a.fin !== null).map(a => a.fila));
        for(let i = sesion.inicio; i <= sesion.fin; i++) {
            if(quemadas.has(i)) continue;
            let ocupantes = DB.staff.filter(s => s.cuadroUid === sesion.uid && s.fila === i).length;
            if(sesion.modo === 'PAREJAS' ? ocupantes < 2 : ocupantes === 0) return i;
        }
        return sesion.fin + 1;
    }

    function asignarFilaEspecifica(t, fila, s) {
        if(fila > s.fin) return alert("Cuadro lleno");
        t.fila = fila; t.cuadroUid = s.uid;
        DB.avance.push({ fila, obrero: t.id, inicio: new Date().toLocaleTimeString(), fin: null, nomCuadro: s.cuadro, cuadroUid: s.uid, supAct: s.act });
    }

    function cerrarTarea(t) {
        let reg = DB.avance.find(a => a.obrero === t.id && a.fin === null);
        if(reg) reg.fin = new Date().toLocaleTimeString();
        t.fila = null; t.cuadroUid = null;
    }

    function renderSession() {
        let s = DB.sesiones[DB.currentSessionId];
        const g = document.getElementById('mapGrid'); g.innerHTML = "";
        let term = new Set(DB.avance.filter(a => a.cuadroUid === s.uid && a.fin !== null).map(a => a.fila));
        for(let i = s.inicio; i <= s.fin; i++) {
            let gente = DB.staff.filter(st => st.cuadroUid === s.uid && st.fila === i);
            g.innerHTML += `<div class="row-item ${gente.length ? 'active-row' : (term.has(i) ? 'done' : '')}"><span>${i}</span><span class="row-tag">${gente.map(p=>p.id).join(',')}</span></div>`;
        }
        document.getElementById('disp_count_global').innerText = `${DB.staff.length}/${DB.globalConfig.totalStaff} Personal`;
    }

    // --- CORRECCIÓN DE CIERRE (SALIR AL INICIO) ---
    function confirmarFinDia() {
        if(confirm("¿Cerrar jornada definitivamente?")) {
            DB.staff.forEach(t => { if(t.fila) cerrarTarea(t); });
            DB.archive.push({ fecha: new Date().toLocaleDateString(), hora: new Date().toLocaleTimeString(), config: DB.globalConfig, avance: [...DB.avance] });
            localStorage.setItem('v47_archive', JSON.stringify(DB.archive));
            generarCorteParcial();
            const btn = document.getElementById('btnSalidaFinal');
            btn.innerText = "🏁 FINALIZAR Y SALIR AL INICIO"; btn.style.background = "var(--main)";
            btn.onclick = () => {
                if(confirm("¿Seguro? Se limpiará el mapa actual.")) {
                    localStorage.removeItem('v47_sesiones'); localStorage.removeItem('v47_avance'); localStorage.removeItem('v47_staff');
                    location.reload(); // ESTO TE REGRESA A LA VENTANA SETUP
                }
            };
        }
    }

    function generarCorteParcial() {
        document.getElementById('viewMain').classList.remove('open');
        document.getElementById('viewPartial').classList.add('open');
        const qr = document.getElementById('qrcode_partial'); qr.innerHTML = "";
        new QRCode(qr, { text: JSON.stringify({ config: DB.globalConfig, avance: DB.avance }), width: 250, height: 250 });
    }

    function descargarJSONReporte() {
        let b = new Blob([JSON.stringify({ config: DB.globalConfig, avance: DB.avance, staff: DB.staff }, null, 2)], {type: "application/json"});
        let a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `AVANCE_${DB.globalConfig.resp}.json`; a.click();
    }

    function cerrarCorteParcial() { document.getElementById('viewPartial').classList.remove('open'); document.getElementById('viewMain').classList.add('open'); }

    function abrirReporteAsistencia() {
        const j = DB.jornadas.find(x => x.desc === DB.globalConfig.jornada) || {id:"N/A"};
        let html = `<table style="width:100%; border-collapse:collapse; font-size:10px;"><tr style="background:#ddd;"><th>ID</th><th>ACT</th><th>CUADRO</th><th>LÍNEAS</th></tr>`;
        [...new Set(DB.avance.map(a => a.obrero))].forEach(id => {
            let hist = DB.avance.filter(a => a.obrero === id);
            let u = hist[hist.length - 1];
            let act = DB.actividades.find(a => a.desc === u.supAct) || {id:"N/A"};
            html += `<tr><td>${id}</td><td>${act.id}</td><td>${u.nomCuadro}</td><td>${hist.length}</td></tr>`;
        });
        document.getElementById('tablaAsistenciaContainer').innerHTML = html + `</table>`;
        document.getElementById('modalReporte').classList.add('open');
    }

    function descargarCSVAsistencia() {
        let csv = [];
        document.querySelectorAll("#tablaAsistenciaContainer tr").forEach(tr => {
            let row = []; tr.querySelectorAll("td, th").forEach(col => row.push(col.innerText));
            csv.push(row.join(","));
        });
        let a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv.join("\n")], { type: "text/csv" }));
        a.download = `Reporte_${DB.globalConfig.resp}.csv`; a.click();
    }

    function ejecutarAvanceMasivoFix() {
        let s = DB.sesiones[DB.currentSessionId];
        let activos = DB.staff.filter(st => st.cuadroUid === s.uid && st.fila !== null);
        if (!activos.length) return alert("Sin personal activo.");
        let ptr = buscarSiguienteFilaVacia(s);
        if (ptr > s.fin) {
            let nS = DB.sesiones[DB.currentSessionId + 1];
            if (nS && confirm(`¿Transferir a ${nS.cuadro}?`)) {
                activos.forEach(t => { cerrarTarea(t); asignarFilaEspecifica(t, buscarSiguienteFilaVacia(nS), nS); });
                DB.currentSessionId++; guardarTodo(); renderTabs(); renderSession();
            }
        } else {
            if (confirm("¿Avanzar grupos?")) {
                let grupos = {}; activos.forEach(t => { if(!grupos[t.fila]) grupos[t.fila] = []; grupos[t.fila].push(t); });
                Object.keys(grupos).sort((a,b)=>a-b).forEach(f => {
                    let nextF = buscarSiguienteFilaVacia(s);
                    if(nextF <= s.fin) grupos[f].forEach(t => { cerrarTarea(t); asignarFilaEspecifica(t, nextF, s); });
                });
                guardarTodo(); renderSession();
            }
        }
    }

    function abrirEditor() {
        let s = DB.sesiones[DB.currentSessionId];
        let list = DB.staff.filter(st => st.cuadroUid === s.uid && st.fila !== null).map(st => `<div class="edit-item"><span><b>${st.id}</b> - Fila: ${st.fila}</span><button class="btn-sm btn-r" onclick="borrarRegistroEditor('${st.id}')">BORRAR</button></div>`).join('');
        document.getElementById('editorList').innerHTML = list || "Sin personal activo";
        document.getElementById('modalEditor').classList.add('open');
    }

    function borrarRegistroEditor(id) {
        let t = DB.staff.find(x => x.id === id);
        if(t) {
            let idx = DB.avance.findIndex(a => a.obrero === id && a.fin === null);
            if(idx !== -1) DB.avance.splice(idx, 1);
            t.fila = null; t.cuadroUid = null;
            guardarTodo(); renderSession(); abrirEditor();
        }
    }

    function abrirHistorial() {
        let h = DB.archive.slice(-5).map((a, i) => `<div class="card">${a.fecha} - ${a.config.resp} <button class="btn-sm btn-b" onclick="descargarHistIdx(${i})">JSON</button></div>`).join('');
        document.getElementById('editorList').innerHTML = h || "Sin historial";
        document.getElementById('modalEditor').classList.add('open');
    }

    function descargarHistIdx(i) {
        let b = new Blob([JSON.stringify(DB.archive[i], null, 2)], {type: "application/json"});
        let a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `BACKUP_${i}.json`; a.click();
    }

    function guardarTodo() {
        localStorage.setItem('v47_sesiones', JSON.stringify(DB.sesiones));
        localStorage.setItem('v47_avance', JSON.stringify(DB.avance));
        localStorage.setItem('v47_staff', JSON.stringify(DB.staff));
        localStorage.setItem('v47_config', JSON.stringify(DB.globalConfig));
    }
    
    function registrarManual() {
        let v = document.getElementById('manual_id').value;
        if(v) { onScan(v); document.getElementById('manual_id').value = ""; }
    }
</script>
</body>
</html>
