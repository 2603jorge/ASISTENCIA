<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus Pro - Cuadrillero V7</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #1b5e20; --s: #f4f7f6; --danger: #c62828; --info: #0277bd; --sup: #673ab7; --accent: #ff9800; }
        body { font-family: sans-serif; background: var(--s); margin: 0; padding: 10px; padding-bottom: 80px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
        
        .monitor-avance { background: #263238; color: #cfd8dc; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 11px; border-left: 5px solid var(--accent); }
        .monitor-avance b { color: white; font-size: 13px; }
        
        .progress-container { background: #ddd; border-radius: 10px; height: 10px; width: 100%; margin: 8px 0; overflow: hidden; }
        #progressBar { background: var(--p); height: 100%; width: 0%; transition: 0.5s; }
        
        .config-status { background: #e8f5e9; border: 1px solid var(--p); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; }
        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .btn-nav { padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 10px; }
        
        label { display: block; font-weight: bold; font-size: 11px; color: #555; margin-top: 10px; text-transform: uppercase; }
        input, select, textarea { width: 100%; height: 45px; margin-top: 5px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; padding: 0 10px; box-sizing: border-box; }
        textarea { height: 80px; padding: 10px; font-family: monospace; font-size: 12px; }
        
        .division-box { background: #fff3e0; border: 2px dashed #ff9800; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .cola-list { max-height: 150px; overflow-y: auto; margin: 10px 0; background: rgba(255,255,255,0.5); border-radius: 8px; padding: 5px; }
        .cola-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #ffd180; font-size: 13px; }
        .btn-remove { background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 4px; }
        
        #status { text-align: center; font-weight: bold; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; background: #eee; font-size: 13px; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .btn-manual { background: var(--accent); color: white; border: none; border-radius: 8px; height: 45px; padding: 0 15px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

<div class="nav-buttons">
    <button class="btn-nav" style="background:#607d8b" onclick="abrirModal('modalConfig')">⚙️ CATALOGOS</button>
    <button class="btn-nav" style="background:var(--sup)" onclick="activarEscaneoSup()">🛰️ QR SUPERVISOR</button>
    <button class="btn-nav" style="background:var(--info)" onclick="abrirRegistros()">📋 LISTADO</button>
</div>

<div class="monitor-avance">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>📊 AVANCE JORNADA</span>
        <span id="labelHora">--:--</span>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-top:8px; text-align:center;">
        <div>Hileras<br><b id="statLineas">0</b></div>
        <div>Gente<br><b id="statGente">0</b></div>
        <div>Eficiencia<br><b id="statEficiencia">0</b> <small>L/h</small></div>
    </div>
</div>

<div class="config-status">
    📍 Cuadro: <b id="displayCuadro">--</b> (<b id="displayLado">--</b>) | 🌱 <b id="displayVariedad">--</b><br>
    🧵 Rango: <b id="displayRango">-- al --</b>
    <div class="progress-container"><div id="progressBar"></div></div>
    <small id="displayCapacidad">Ocupación: 0/0 personas</small>
</div>

<div class="card">
    <label>SUPERVISOR</label>
    <input type="text" id="sup" readonly placeholder="Escanea al Supervisor..." style="background:#f5f5f5;">
    
    <button id="btnReuse" style="background:var(--info); color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; width:100%; margin-top:10px; display:none;" onclick="reutilizarCuadrilla()">
        ♻️ CARGAR GENTE DEL CUADRO ANTERIOR
    </button>

    <label>TURNO / JORNADA</label>
    <select id="selTurno">
        <option value="9">MATUTINO (9)</option>
        <option value="11">VESPERTINO (11)</option>
        <option value="16">1 TAREA (16)</option>
        <option value="17">2 TAREAS (17)</option>
        <option value="18">MATUTINO VESPERTINO (18)</option>
        <option value="0">SE DESCANSÓ (0)</option>
    </select>

    <label>ACTIVIDAD</label>
    <input type="text" id="busA" placeholder="Filtrar por nombre o clave..." oninput="filtrarActividades()">
    <select id="selActividad"></select>
    
    <div id="reader" style="width: 100%; background: #000; border-radius: 12px; margin-top: 15px; overflow: hidden;"></div>
    <div id="status">INICIANDO CÁMARA...</div>

    <div style="display:flex; margin-top:10px;">
        <input type="text" id="manualID" placeholder="ID Manual si no lee..." style="flex-grow:1;">
        <button class="btn-manual" onclick="agregarManual()">AÑADIR</button>
    </div>
</div>

<div class="division-box" id="areaCola" style="display:none;">
    <h4 style="margin:0">📦 GRUPO EN COLA</h4>
    <div class="cola-list" id="colaUI"></div>
    <button onclick="guardarGrupo()" style="width:100%; background:var(--p); color:white; padding:15px; border:none; border-radius:8px; font-weight:bold; font-size:16px;">✅ REGISTRAR ESTE GRUPO</button>
    <button onclick="vaciarCola()" style="width:100%; background:none; color:red; border:none; margin-top:8px; font-size:11px;">Cancelar / Vaciar</button>
</div>

<button onclick="prepararReporte()" style="width:100%; background:var(--sup); color:white; padding:20px; border:none; border-radius:12px; font-weight:bold; margin-top:10px; margin-bottom:20px;">📤 PASAR REPORTE AL JEFE</button>

<!-- MODAL CONFIG -->
<div id="modalConfig" class="modal">
    <h3 style="color:var(--p)">⚙️ Configuración del Sistema</h3>
    
    <label>1. CATÁLOGO ACTIVIDADES (ID, Descripción, Clave)</label>
    <textarea id="csvActividades" placeholder="Ejemplo:&#10;6, APOYO CAMPO AGUA, 1000&#10;11, APOYO CAMPO ASISTENCIA, 1005"></textarea>
    <button onclick="cargarActividades()" style="width:100%; background:black; color:white; padding:12px; border:none; border-radius:8px; margin-top:5px;">ACTUALIZAR ACTIVIDADES</button>
    
    <hr style="margin:20px 0;">
    
    <label>2. AJUSTE MANUAL (SÓLO SI NO HAY QR)</label>
    <input type="text" id="m_cuadro" placeholder="Cuadro (Ej: 105)">
    <input type="text" id="m_variedad" placeholder="Variedad (Ej: SWEET GLOBE)">
    <select id="m_lado">
        <option value="NORTE">NORTE</option><option value="SUR">SUR</option>
        <option value="ORIENTE">ORIENTE</option><option value="PONIENTE">PONIENTE</option>
        <option value="COMPLETA">COMPLETA</option>
    </select>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
        <input type="number" id="m_ini" placeholder="L. Inicio">
        <input type="number" id="m_fin" placeholder="L. Fin">
    </div>
    <input type="text" id="m_sup" placeholder="Nombre Supervisor">
    <button onclick="fijarManual()" style="width:100%; background:var(--p); color:white; padding:12px; border:none; border-radius:8px; margin-top:5px; font-weight:bold;">FIJAR ASIGNACIÓN MANUAL</button>

    <button onclick="cerrarModal('modalConfig')" style="width:100%; padding:15px; background:#ddd; border:none; border-radius:8px; margin-top:30px;">CERRAR</button>
</div>

<!-- MODAL LISTADO -->
<div id="modalListado" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>📋 Registros del Día</h3>
        <button onclick="borrarTodo()" style="background:red; color:white; border:none; padding:8px; border-radius:5px; font-size:11px;">LIMPIAR DÍA</button>
    </div>
    <div id="listaRegsUI"></div>
    <button onclick="cerrarModal('modalListado')" style="width:100%; padding:15px; background:#ddd; border:none; border-radius:8px; margin-top:20px;">VOLVER</button>
</div>

<!-- MODAL QR REPORTE -->
<div id="modalQR" class="modal" style="text-align:center;">
    <h3>REPORTE PARA JEFE</h3>
    <div id="qrcode" style="display:flex; justify-content:center; margin:20px;"></div>
    <button onclick="cerrarModal('modalQR')" style="width:100%; padding:15px; background:#ddd; border:none; border-radius:8px;">CERRAR</button>
</div>

<script>
let REGS = JSON.parse(localStorage.getItem('c_regs_v7')) || [];
let ACTS = JSON.parse(localStorage.getItem('c_acts_v7')) || [];
let COLA = [];
let CUR = JSON.parse(localStorage.getItem('c_cur_v7')) || { c:"", lado:"", li:0, lf:0, v:"", s:"" };
let MODO_SUP = false;

window.onload = () => {
    actualizarInterfaz();
    filtrarActividades();
    verificarMemoria();
    const scanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
    scanner.render(alEscanear);
};

// --- ESCANEO ---
function activarEscaneoSup() { 
    MODO_SUP = true; 
    document.getElementById('status').innerText = "🛰️ ESCANEE QR DEL SUPERVISOR..."; 
}

function alEscanear(codigo) {
    if(MODO_SUP) {
        const p = codigo.split('|');
        // Soporta formatos SUP_ORDEN, SUP_CONFIG, SUP_V7
        if(p[0].startsWith("SUP_")) {
            CUR = { 
                c: p[1], lado: p[2], 
                li: parseInt(p[3]), lf: parseInt(p[4]), 
                v: p[5] || "--", s: p[6] || p[7] || "SIN NOMBRE" 
            };
            localStorage.setItem('c_cur_v7', JSON.stringify(CUR));
            actualizarInterfaz();
            MODO_SUP = false;
            document.getElementById('status').innerText = "✅ TRAMO OK: " + CUR.c;
            verificarMemoria();
        }
    } else {
        if(!CUR.c) return alert("Primero recibe asignación del Supervisor");
        agregarACola(codigo.trim());
    }
}

// --- GESTIÓN DE PERSONAL ---
function agregarManual() {
    const id = document.getElementById('manualID').value.trim();
    if(id) { agregarACola(id); document.getElementById('manualID').value = ""; }
}

function agregarACola(id) {
    if(REGS.find(r => r.e === id && r.c === CUR.c && r.lado === CUR.lado)) {
        document.getElementById('status').innerText = "❌ YA ESTÁ EN ESTE CUADRO: " + id;
        return;
    }
    if(COLA.find(c => c.e === id)) return;
    COLA.push({ e: id });
    renderCola();
}

function renderCola() {
    const cont = document.getElementById('colaUI');
    document.getElementById('areaCola').style.display = COLA.length > 0 ? 'block' : 'none';
    cont.innerHTML = COLA.map((item, idx) => `
        <div class="cola-item">
            <span><b>${item.e}</b></span>
            <button class="btn-remove" onclick="removerCola(${idx})">Eliminar</button>
        </div>
    `).join('');
}

function removerCola(idx) { COLA.splice(idx, 1); renderCola(); }

function vaciarCola() { if(confirm("¿Vaciar cola?")) { COLA = []; renderCola(); } }

function reutilizarCuadrilla() {
    if(REGS.length === 0) return;
    const ult = REGS[REGS.length - 1];
    const genteAnterior = REGS.filter(r => r.c === ult.c && r.lado === ult.lado).map(r => r.e);
    COLA = [...new Set(genteAnterior)].map(e => ({ e: e }));
    renderCola();
    document.getElementById('status').innerText = "♻️ CUADRILLA ANTERIOR CARGADA";
}

function guardarGrupo() {
    const ahora = new Date();
    const h = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
    const f = ahora.toLocaleDateString('en-GB');
    const turno = document.getElementById('selTurno').value;
    const actID = document.getElementById('selActividad').value;
    const actObj = ACTS.find(a => a.id === actID);

    COLA.forEach((p, i) => {
        let hilera = CUR.li + Math.floor(i / 2); // 2 personas por hilera
        if(hilera > CUR.lf) hilera = CUR.lf;

        REGS.push({
            id: Date.now() + i, f: f, h: h, ts: ahora.getTime(),
            c: CUR.c, l: hilera, lado: CUR.lado, v: CUR.v,
            e: p.e, s: CUR.s, t: turno,
            a: actObj ? actObj.n : "--", ak: actObj ? actObj.ak : "--"
        });
    });

    localStorage.setItem('c_regs_v7', JSON.stringify(REGS));
    COLA = []; renderCola(); actualizarInterfaz();
    alert("✅ Registros guardados.");
}

// --- CATALOGOS Y CONFIG ---
function cargarActividades() {
    const raw = document.getElementById('csvActividades').value.trim();
    if(!raw) return;
    const lineas = raw.split('\n');
    ACTS = lineas.map(l => {
        const p = l.split(',');
        return { 
            id: p[0] ? p[0].trim() : "", 
            n: p[1] ? p[1].trim() : "", 
            ak: p[2] ? p[2].trim() : "" 
        };
    }).filter(a => a.id !== "");
    localStorage.setItem('c_acts_v7', JSON.stringify(ACTS));
    alert("Catálogo actualizado.");
    filtrarActividades();
}

function filtrarActividades() {
    const bus = document.getElementById('busA').value.toLowerCase();
    const sel = document.getElementById('selActividad');
    const filtrados = ACTS.filter(a => a.n.toLowerCase().includes(bus) || a.ak.toLowerCase().includes(bus));
    sel.innerHTML = filtrados.map(a => `<option value="${a.id}">${a.n} (Clave: ${a.ak})</option>`).join('');
}

function fijarManual() {
    CUR = {
        c: document.getElementById('m_cuadro').value,
        lado: document.getElementById('m_lado').value,
        li: parseInt(document.getElementById('m_ini').value),
        lf: parseInt(document.getElementById('m_fin').value),
        v: document.getElementById('m_variedad').value || "--",
        s: document.getElementById('m_sup').value || "MANUAL"
    };
    localStorage.setItem('c_cur_v7', JSON.stringify(CUR));
    actualizarInterfaz(); cerrarModal('modalConfig');
    document.getElementById('status').innerText = "⚠️ CONFIGURACIÓN MANUAL ACTIVA";
}

// --- INTERFAZ ---
function actualizarInterfaz() {
    document.getElementById('displayCuadro').innerText = CUR.c || "--";
    document.getElementById('displayLado').innerText = CUR.lado || "--";
    document.getElementById('displayVariedad').innerText = CUR.v || "--";
    document.getElementById('displayRango').innerText = `${CUR.li} al ${CUR.lf}`;
    document.getElementById('sup').value = CUR.s;
    
    // Progreso
    let ocupados = REGS.filter(r => r.c === CUR.c && r.lado === CUR.lado).length;
    let totalCap = (CUR.lf - CUR.li + 1) * 2;
    document.getElementById('progressBar').style.width = Math.min((ocupados / (totalCap || 1)) * 100, 100) + "%";
    document.getElementById('displayCapacidad').innerText = `Ocupación: ${ocupados}/${totalCap} personas`;
    
    actualizarMonitor();
}

function actualizarMonitor() {
    if(REGS.length === 0) return;
    const hilerasUnicas = new Set(REGS.map(r => `${r.c}-${r.l}-${r.lado}`));
    const timestamps = REGS.map(r => r.ts);
    const diff = Math.max(0.1, (Math.max(...timestamps) - Math.min(...timestamps)) / (1000 * 60 * 60));
    document.getElementById('statLineas').innerText = hilerasUnicas.size;
    document.getElementById('statGente').innerText = [...new Set(REGS.map(r=>r.e))].length;
    document.getElementById('statEficiencia').innerText = (hilerasUnicas.size / diff).toFixed(1);
    document.getElementById('labelHora').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function abrirRegistros() {
    const cont = document.getElementById('listaRegsUI');
    cont.innerHTML = REGS.slice().reverse().map(r => `
        <div class="reg-item" style="border-bottom:1px solid #eee; padding:8px; font-size:12px;">
            <b>${r.e}</b> - C:${r.c} L:${r.l} - ${r.a} (${r.ak})<br>
            <small>Turno: ${r.t} | ${r.h}</small>
        </div>
    `).join('') || "No hay registros";
    abrirModal('modalListado');
}

function prepararReporte() {
    const paquete = { 
        resumen: { lineas: document.getElementById('statLineas').innerText, gente: REGS.length }, 
        detalles: REGS 
    };
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById("qrcode"), { text: "AGRI_REP|" + JSON.stringify(paquete), width: 250, height: 250 });
    abrirModal('modalQR');
}

function abrirModal(id) { document.getElementById(id).style.display = 'block'; }
function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }
function verificarMemoria() { document.getElementById('btnReuse').style.display = REGS.length > 0 ? 'block' : 'none'; }
function borrarTodo() { if(confirm("¿Borrar todo?")) { REGS = []; localStorage.setItem('c_regs_v7', '[]'); actualizarInterfaz(); cerrarModal('modalListado'); } }
</script>
</body>
</html>
