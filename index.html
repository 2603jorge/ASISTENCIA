<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V27 - Smart Search</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; }
        
        /* UI Elements */
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; color: white; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-g { background: var(--main); }
        .btn-o { background: var(--sec); }
        .btn-b { background: #1976d2; }
        .btn-r { background: #d32f2f; }
        
        /* Inputs mejorados para búsqueda */
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: var(--sec); outline: none; background: #333; }
        
        label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }

        /* Mapa Grid */
        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 8px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .row-item { height: 50px; background: #333; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border: 2px solid #444; position: relative; }
        .done { background: var(--main); border-color: #66bb6a; opacity: 0.8; }
        .active { background: var(--sec); border-color: #ffca28; color: black; animation: pulse 1.5s infinite; }
        .row-tag { font-size: 9px; position: absolute; bottom: 2px; }
        
        /* Modales */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        .status-bar { font-size: 12px; text-align: center; color: #888; padding: 8px; background: #222; border-radius: 6px; margin-bottom: 15px; border: 1px dashed #444; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main); margin-top:0;">🌵 AGRICACTUS V27</h2>
    
    <div class="status-bar" id="dbStatus">Cargando base de datos...</div>
    <button class="btn btn-b" style="padding:10px; font-size:14px;" onclick="abrirDB()">📂 CARGAR FORMATOS CSV</button>

    <div class="card">
        <label>1. Supervisor</label>
        <input type="text" id="conf_resp" placeholder="Tu Nombre">

        <label>2. Buscar Cuadro 🔍</label>
        <input type="text" id="conf_cuadro" list="lista_cuadros" placeholder="Escribe para filtrar..." oninput="alEscribirCuadro()" autocomplete="off">
        <datalist id="lista_cuadros"></datalist>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label>3. Orientación / Lado</label>
                <select id="conf_lado">
                    <option value="COMPLETA">COMPLETA</option>
                    <option value="NORTE">NORTE</option>
                    <option value="SUR">SUR</option>
                </select>
            </div>
            <div>
                <label>4. Total Hileras</label>
                <input type="number" id="conf_max_lineas" readonly style="background:#444; color:#aaa;">
            </div>
        </div>

        <label>5. Buscar Actividad 🔍</label>
        <input type="text" id="conf_act" list="lista_actividades" placeholder="Escribe actividad..." autocomplete="off">
        <datalist id="lista_actividades"></datalist>

        <label>6. Rango de Trabajo (Opcional)</label>
        <div style="display:flex; gap:10px;">
            <input type="number" id="conf_inicio" value="1">
            <input type="number" id="conf_fin" placeholder="Fin">
        </div>
    </div>

    <button class="btn btn-g" onclick="iniciarJornada()">🚀 INICIAR JORNADA</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div>
            <b id="disp_cuadro" style="font-size:22px; color:white;">--</b>
            <span id="disp_lado" style="font-size:12px; background:#444; padding:2px 6px; border-radius:4px; color:#aaa;">--</span>
        </div>
        <button class="btn btn-r" style="width:auto; padding:8px 15px; font-size:12px; margin:0;" onclick="if(confirm('¿Salir?')) location.reload()">❌ SALIR</button>
    </div>

    <div class="card" style="display:grid; grid-template-columns:1fr 1fr; text-align:center; padding:10px;">
        <div><small>PROGRESO</small><br><b id="stat_done" style="font-size:24px; color:var(--main);">0%</b></div>
        <div><small>PERSONAL</small><br><b id="stat_active" style="font-size:24px; color:var(--sec);">0</b></div>
    </div>

    <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; border:2px solid #555; background:black; margin-bottom:10px;"></div>
    
    <div class="card" style="padding:10px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <small>MAPA DE HILERAS</small>
            <small id="disp_actividad" style="color:var(--sec);">--</small>
        </div>
        <div id="mapGrid" class="grid-map"></div>
    </div>

    <button class="btn btn-b" onclick="descargarReporte()">📥 DESCARGAR REPORTE (.CSV)</button>
</div>

<div id="modalDB" class="modal" style="background:#111;">
    <h3 style="color:var(--b);">📂 Carga de Datos Masiva</h3>
    <p style="font-size:12px; color:#aaa;">Copia y pega directamente desde tus Excel.</p>
    
    <label>TABLA DE CUADROS</label>
    <div style="font-size:10px; color:#888; margin-bottom:5px;">Orden: ID, CUADRO, VARIEDAD, ORIENTACION, AREA, LINEAS</div>
    <textarea id="csv_cuadros" rows="6" placeholder="Pega aquí las celdas de Excel..."></textarea>
    
    <label>TABLA DE ACTIVIDADES</label>
    <div style="font-size:10px; color:#888; margin-bottom:5px;">Orden: ID, DESCRIPCION, CLAVE</div>
    <textarea id="csv_act" rows="4" placeholder="Pega aquí las celdas de Excel..."></textarea>

    <button class="btn btn-g" onclick="procesarYGuardar()">💾 GUARDAR DATOS</button>
    <button class="btn btn-o" onclick="document.getElementById('modalDB').classList.remove('open')">VOLVER</button>
</div>

<script>
    // --- LÓGICA DE DATOS ---
    let DB = {
        cuadros: JSON.parse(localStorage.getItem('v26_cuadros')) || [],
        actividades: JSON.parse(localStorage.getItem('v26_act')) || [],
        sesion: JSON.parse(localStorage.getItem('v26_sesion')) || null,
        avance: JSON.parse(localStorage.getItem('v26_avance')) || [],
        staff: JSON.parse(localStorage.getItem('v26_staff')) || []
    };
    let scanner = null;
    const audioBeep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    window.onload = () => {
        actualizarSelectores();
        if (DB.sesion && DB.sesion.activo) irAlMapa();
    };

    // --- 1. PROCESAMIENTO DE CSV ---
    function abrirDB() { document.getElementById('modalDB').classList.add('open'); }
    
    function procesarYGuardar() {
        const txtC = document.getElementById('csv_cuadros').value;
        const txtA = document.getElementById('csv_act').value;

        // Procesar Cuadros
        if(txtC.trim()){
            DB.cuadros = txtC.split('\n').map(line => {
                let col = line.split(/[,\t]/);
                if(col.length < 5 || col[0].toUpperCase().includes('ID')) return null;
                return {
                    id: col[1].trim(),       // ID/Nombre del cuadro
                    ori: col[3].trim(),      // Orientación
                    max: parseInt(col[5])    // Líneas
                };
            }).filter(x => x && x.id);
        }

        // Procesar Actividades
        if(txtA.trim()){
            DB.actividades = txtA.split('\n').map(line => {
                let col = line.split(/[,\t]/);
                if(col.length < 2 || col[0].toUpperCase().includes('ID')) return null;
                return {
                    desc: col[1].trim(), 
                    clave: col[2] ? col[2].trim() : "" 
                };
            }).filter(x => x);
        }

        localStorage.setItem('v26_cuadros', JSON.stringify(DB.cuadros));
        localStorage.setItem('v26_act', JSON.stringify(DB.actividades));
        alert("✅ Datos actualizados con éxito");
        actualizarSelectores();
        document.getElementById('modalDB').classList.remove('open');
    }

    function actualizarSelectores() {
        const listaC = document.getElementById('lista_cuadros');
        const listaA = document.getElementById('lista_actividades');
        const st = document.getElementById('dbStatus');

        // Llenar Lista de Cuadros para el buscador
        if(DB.cuadros.length > 0) {
            st.innerHTML = `✅ BD LISTA: ${DB.cuadros.length} Cuadros | ${DB.actividades.length} Actividades`;
            st.style.color = "#4caf50";
            
            // Creamos las opciones del buscador
            listaC.innerHTML = DB.cuadros.map(c => 
                `<option value="${c.id}">Orientación: ${c.ori}</option>`
            ).join('');
        } else {
            st.innerHTML = "⚠️ Base de datos vacía";
        }

        // Llenar Lista de Actividades
        if(DB.actividades.length > 0) {
            listaA.innerHTML = DB.actividades.map(a => 
                `<option value="${a.desc}">Clave: ${a.clave}</option>`
            ).join('');
        }
    }

    // --- 2. LÓGICA DE BÚSQUEDA Y CONFIGURACIÓN ---
    
    function alEscribirCuadro() {
        // Esta función se ejecuta cada vez que escribes una letra
        const inputVal = document.getElementById('conf_cuadro').value;
        
        // Buscamos si lo que escribiste coincide EXACTAMENTE con un cuadro de la BD
        const data = DB.cuadros.find(c => c.id === inputVal);
        
        if(data) {
            // Si hay coincidencia exacta, rellenamos los datos automáticamente
            document.getElementById('conf_max_lineas').value = data.max;
            document.getElementById('conf_fin').value = data.max;
            
            // Auto-seleccionar lado
            const selLado = document.getElementById('conf_lado');
            if(data.ori && (data.ori.includes('SUR') || data.ori.includes('Sur'))) selLado.value = 'SUR';
            else if(data.ori && (data.ori.includes('NORTE') || data.ori.includes('Norte'))) selLado.value = 'NORTE';
            else selLado.value = 'COMPLETA';
            
            // Feedback visual: Borde verde
            document.getElementById('conf_cuadro').style.borderColor = "#4caf50";
        } else {
            // Si no coincide, limpiamos o indicamos que sigue buscando
            document.getElementById('conf_max_lineas').value = "";
            document.getElementById('conf_cuadro').style.borderColor = "#ff9800";
        }
    }

    function iniciarJornada() {
        const c = document.getElementById('conf_cuadro').value;
        const lado = document.getElementById('conf_lado').value;
        const ini = parseInt(document.getElementById('conf_inicio').value);
        const fin = parseInt(document.getElementById('conf_fin').value);
        const act = document.getElementById('conf_act').value;

        if(!c || !fin || !act) return alert("Faltan datos de configuración (Cuadro, Actividad o Líneas)");

        DB.sesion = {
            cuadro: c,
            lado: lado, 
            actividad: act,
            responsable: document.getElementById('conf_resp').value,
            inicio: ini,
            fin: fin,
            activo: true
        };
        // Reset diario
        DB.avance = [];
        DB.staff = [];
        guardarTodo();
        irAlMapa();
    }

    // --- 3. LÓGICA DEL MAPA Y ESCÁNER ---
    function irAlMapa() {
        document.getElementById('viewSetup').classList.remove('open');
        document.getElementById('viewMain').classList.add('open');
        
        document.getElementById('disp_cuadro').innerText = DB.sesion.cuadro;
        document.getElementById('disp_lado').innerText = DB.sesion.lado;
        document.getElementById('disp_actividad').innerText = DB.sesion.actividad;

        renderMapa();

        if(!scanner) {
            scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render(onScan);
        }
    }

    function onScan(id) {
        id = id.trim();
        let trabajador = DB.staff.find(s => s.id === id);

        if(trabajador && trabajador.fila) {
            const filaCerrar = trabajador.fila;
            const registro = DB.avance.find(a => a.fila === filaCerrar && !a.fin);
            
            if(registro) {
                registro.fin = new Date().toLocaleTimeString();
                registro.ts_fin = Date.now();
                trabajador.fila = null;
                audioBeep.play();
                alert(`✅ ${id} terminó fila ${filaCerrar}`);
            }
        } else {
            if(!trabajador) {
                trabajador = { id: id, fila: null };
                DB.staff.push(trabajador);
            }
            
            const nuevaFila = buscarFilaLibre();
            if(nuevaFila) {
                trabajador.fila = nuevaFila;
                DB.avance.push({
                    fila: nuevaFila,
                    obrero: id,
                    inicio: new Date().toLocaleTimeString(),
                    fin: null,
                    ts: Date.now()
                });
                audioBeep.play();
                alert(`🚜 ${id} inicia fila ${nuevaFila}`);
            } else {
                alert("¡Cuadro finalizado!");
            }
        }
        guardarTodo();
        renderMapa();
    }

    function buscarFilaLibre() {
        for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            if(!DB.avance.some(a => a.fila === i)) return i;
        }
        return null;
    }

    function renderMapa() {
        const grid = document.getElementById('mapGrid');
        grid.innerHTML = "";
        let hechos = 0, activos = 0;
        
        for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            const reg = DB.avance.find(a => a.fila === i);
            const div = document.createElement('div');
            div.className = "row-item";
            
            let etiqueta = i;
            if(DB.sesion.lado === 'NORTE') etiqueta += 'N';
            if(DB.sesion.lado === 'SUR') etiqueta += 'S';
            
            div.innerHTML = `<span>${etiqueta}</span>`;

            if(reg) {
                if(reg.fin) {
                    div.className += " done";
                    hechos++;
                } else {
                    div.className += " active";
                    div.innerHTML += `<span class="row-tag">${reg.obrero}</span>`;
                    activos++;
                }
            }
            grid.appendChild(div);
        }

        const total = DB.sesion.fin - DB.sesion.inicio + 1;
        document.getElementById('stat_done').innerText = Math.round((hechos/total)*100) + "%";
        document.getElementById('stat_active').innerText = activos;
    }

    function guardarTodo() {
        localStorage.setItem('v26_sesion', JSON.stringify(DB.sesion));
        localStorage.setItem('v26_avance', JSON.stringify(DB.avance));
        localStorage.setItem('v26_staff', JSON.stringify(DB.staff));
    }

    function descargarReporte() {
        const s = DB.sesion;
        let csv = "CUADRO,LADO,ACTIVIDAD,FILA,OBRERO,INICIO,FIN,RESPONSABLE\n";
        DB.avance.forEach(r => {
            csv += `${s.cuadro},${s.lado},${s.actividad},${r.fila},${r.obrero},${r.inicio},${r.fin || "EN PROCESO"},${s.responsable}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `REPORTE_${s.cuadro}_${s.lado}.csv`;
        link.click();
    }
</script>
</body>
</html>
