<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V32 - Stable Scan</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; --blue: #1565c0; --danger: #c62828; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; }
        
        /* UI Elements */
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; color: white; }
        .btn-g { background: var(--main); }
        .btn-o { background: var(--sec); color: black; }
        .btn-b { background: var(--blue); }
        .btn-r { background: var(--danger); }
        .btn-sm { padding: 8px; width: auto; font-size: 12px; margin: 0; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }

        /* Mapa Grid */
        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; max-height: 350px; overflow-y: auto; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .row-item { height: 45px; background: #333; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 1px solid #444; position: relative; overflow: hidden; }
        .done { background: var(--main); border-color: #66bb6a; opacity: 0.6; }
        .active { background: var(--sec); border-color: #ffca28; color: black; animation: pulse 2s infinite; }
        .row-tag { font-size: 8px; position: absolute; bottom: 1px; width: 100%; text-align: center; }
        .badge { position: absolute; top: 0; right: 0; background: var(--blue); color: white; font-size: 8px; padding: 2px 4px; border-radius: 0 0 0 5px; }
        
        /* Editor List */
        .edit-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px; border-radius: 8px; margin-bottom: 5px; border: 1px solid #444; }

        /* Modales */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        .flex-row { display: flex; gap: 10px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">🌵 AGRICACTUS V32</h2>
    <button class="btn btn-b" style="padding:10px;" onclick="abrirDB()">📂 CARGAR CATÁLOGOS</button>

    <div class="card">
        <label>Supervisor</label>
        <input type="text" id="conf_resp" placeholder="Nombre Responsable">

        <label>🔍 Buscar Cuadro</label>
        <input type="text" id="conf_cuadro" list="lista_cuadros" placeholder="Escribe ID o Nombre..." oninput="alEscribirCuadro('conf')">
        <datalist id="lista_cuadros"></datalist>
        <div style="font-size:10px; color:#aaa; margin-bottom:10px; text-align:right;">ID Interno: <b id="conf_id_interno">--</b> | Total: <b id="conf_info_total">--</b></div>

        <div class="flex-row">
            <div style="flex:1">
                <label>Lado</label>
                <select id="conf_lado"><option value="COMPLETA">COMPLETA</option><option value="NORTE">NORTE</option><option value="SUR">SUR</option></select>
            </div>
            <div style="flex:1">
                <label>Actividad</label>
                <input type="text" id="conf_act" list="lista_actividades">
                <datalist id="lista_actividades"></datalist>
            </div>
        </div>
        
        <label style="color:var(--sec);">🕒 JORNADA</label>
        <select id="conf_jornada"><option value="">-- Cargar Lista --</option></select>

        <label>RANGO DE TRABAJO</label>
        <div class="flex-row">
            <input type="number" id="conf_inicio" placeholder="Desde">
            <input type="number" id="conf_fin" placeholder="Hasta">
        </div>

        <label>🛠️ MODO ASIGNACIÓN</label>
        <select id="conf_modo" onchange="toggleModoInput('conf')">
            <option value="INDIVIDUAL">👤 INDIVIDUAL</option>
            <option value="PAREJAS">👥 PAREJAS</option>
        </select>
        <div id="div_tarea_conf">
            <label>Filas por Tarea</label>
            <input type="number" id="conf_tarea_size" value="1" min="1">
        </div>
    </div>

    <button class="btn btn-g" onclick="iniciarJornada()">🚀 INICIAR</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <div style="line-height:1.2;">
            <b id="disp_cuadro" style="font-size:16px; color:white;">--</b>
            <div style="font-size:11px; color:#aaa;">
                <span id="disp_act">--</span> | <span id="disp_jornada" style="color:var(--sec);">--</span>
            </div>
        </div>
        <div style="text-align:right;">
            <span style="font-size:10px; color:#888;">RANGO:</span><br>
            <b id="disp_rango" style="font-size:12px;">--</b>
        </div>
    </div>

    <div class="card" style="display:grid; grid-template-columns:1fr 1fr; text-align:center; padding:10px; gap:5px; margin-bottom:10px;">
        <div style="background:#333; border-radius:8px; padding:5px;">
            <small>HECHO</small><br><b id="stat_done" style="font-size:20px; color:var(--main);">0%</b>
        </div>
        <div style="background:#333; border-radius:8px; padding:5px;">
            <small>GENTE</small><br><b id="stat_active" style="font-size:20px; color:var(--sec);">0</b>
        </div>
    </div>

    <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; border:2px solid #555; background:black; margin-bottom:10px; height:250px;"></div>
    
    <div class="card" style="padding:5px;">
        <div id="mapGrid" class="grid-map"></div>
    </div>

    <button class="btn btn-b" onclick="abrirEditor()">✏️ EDITAR / CORREGIR (VER LISTA)</button>
    
    <div class="flex-row">
        <button class="btn btn-o" onclick="abrirAvanceMasivo()">⏩ CAMBIO MASIVO</button>
        <button class="btn btn-b" onclick="descargarReporte('ASISTENCIA')">📊 VER PARCIAL</button>
    </div>
    <button class="btn btn-r" onclick="finalizarDia()">🏁 FINALIZAR DÍA (CERRAR)</button>
</div>

<div id="modalEditor" class="modal" style="background:#111;">
    <h2>✏️ CORRECCIÓN DE DATOS</h2>
    <p style="font-size:12px; color:#aaa;">Aquí puedes cambiar la fila asignada o borrar un registro erróneo de la sesión actual.</p>
    <div id="editorList" style="max-height: 400px; overflow-y: auto;"></div>
    <button class="btn" onclick="document.getElementById('modalEditor').classList.remove('open')">VOLVER</button>
</div>

<div id="modalMass" class="modal" style="background:rgba(0,0,0,0.95);">
    <h2 style="color:var(--sec); text-align:center;">⏩ CAMBIO DE CUADRO/ACT</h2>
    
    <div class="card">
        <label>Siguiente Cuadro</label>
        <input type="text" id="mass_cuadro" list="lista_cuadros" placeholder="Buscar..." oninput="alEscribirCuadro('mass')">
        <div class="flex-row">
            <div style="flex:1"><label>Lado</label><select id="mass_lado"><option value="COMPLETA">COMPLETA</option><option value="NORTE">NORTE</option><option value="SUR">SUR</option></select></div>
            <div style="flex:1"><label>Actividad</label><input type="text" id="mass_act" list="lista_actividades"></div>
        </div>
        <label>Jornada</label><select id="mass_jornada"></select>
        <label>Nuevo Rango</label>
        <div class="flex-row"><input type="number" id="mass_inicio" placeholder="Desde"><input type="number" id="mass_fin" placeholder="Hasta"></div>
        <label>Modo</label><select id="mass_modo" onchange="toggleModoInput('mass')"><option value="INDIVIDUAL">INDIVIDUAL</option><option value="PAREJAS">PAREJAS</option></select>
        <div id="div_tarea_mass"><label>Filas</label><input type="number" id="mass_tarea_size" value="1"></div>
    </div>
    <button class="btn btn-g" onclick="ejecutarCambioActividad()">✅ MOVER A TODOS</button>
    <button class="btn btn-r" onclick="document.getElementById('modalMass').classList.remove('open')">CANCELAR</button>
</div>

<div id="modalDB" class="modal" style="background:#111;">
    <h3>📂 Carga de Catálogos</h3>
    <label>1. CUADROS</label><textarea id="csv_cuadros" rows="2"></textarea>
    <label>2. ACTIVIDADES</label><textarea id="csv_act" rows="2"></textarea>
    <label>3. JORNADAS</label><textarea id="csv_jor" rows="2"></textarea>
    <button class="btn btn-g" onclick="procesarYGuardar()">GUARDAR</button>
    <button class="btn" onclick="document.getElementById('modalDB').classList.remove('open')">VOLVER</button>
</div>

<script>
    // --- ESTADO ---
    let DB = {
        cuadros: JSON.parse(localStorage.getItem('v32_cuadros')) || [],
        actividades: JSON.parse(localStorage.getItem('v32_act')) || [],
        jornadas: JSON.parse(localStorage.getItem('v32_jornadas')) || [],
        sesion: JSON.parse(localStorage.getItem('v32_sesion')) || null,
        avance: JSON.parse(localStorage.getItem('v32_avance')) || [],
        historial: JSON.parse(localStorage.getItem('v32_historial')) || [],
        staff: JSON.parse(localStorage.getItem('v32_staff')) || []
    };
    let scanner = null;
    let lastScanTime = {}; // Para evitar rebotes
    const audioBeep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    window.onload = () => {
        actualizarSelectores();
        toggleModoInput('conf');
        if (DB.sesion && DB.sesion.activo) irAlMapa();
    };

    // --- SETUP & UTILS ---
    function abrirDB() { document.getElementById('modalDB').classList.add('open'); }
    function toggleModoInput(prefix) {
        let modo = document.getElementById(prefix + '_modo').value;
        document.getElementById('div_tarea_' + prefix).style.display = (modo === 'INDIVIDUAL') ? 'block' : 'none';
    }

    function procesarYGuardar() {
        const txtC = document.getElementById('csv_cuadros').value;
        const txtA = document.getElementById('csv_act').value;
        const txtJ = document.getElementById('csv_jor').value;

        if(txtC.trim()) DB.cuadros = txtC.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=5) ? {id:c[0].trim(), nombre:c[1].trim(), ori:c[3].trim(), max:parseInt(c[5])} : null }).filter(x=>x&&x.id);
        if(txtA.trim()) DB.actividades = txtA.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        if(txtJ.trim()) DB.jornadas = txtJ.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);

        localStorage.setItem('v32_cuadros', JSON.stringify(DB.cuadros));
        localStorage.setItem('v32_act', JSON.stringify(DB.actividades));
        localStorage.setItem('v32_jornadas', JSON.stringify(DB.jornadas));
        actualizarSelectores();
        alert("✅ Datos Actualizados");
        document.getElementById('modalDB').classList.remove('open');
    }

    function actualizarSelectores() {
        const listaC = document.getElementById('lista_cuadros');
        const listaA = document.getElementById('lista_actividades');
        
        if(DB.cuadros.length) listaC.innerHTML = DB.cuadros.map(c => `<option value="${c.nombre}">ID: ${c.id} | Ori: ${c.ori}</option>`).join('');
        if(DB.actividades.length) listaA.innerHTML = DB.actividades.map(a => `<option value="${a.desc}">ID: ${a.id}</option>`).join('');
        
        const optsJ = `<option value="">-- Seleccionar --</option>` + DB.jornadas.map(j => `<option value="${j.desc}">${j.desc}</option>`).join('');
        document.getElementById('conf_jornada').innerHTML = optsJ;
        document.getElementById('mass_jornada').innerHTML = optsJ;
    }

    function alEscribirCuadro(prefix) {
        const val = document.getElementById(prefix+'_cuadro').value;
        const data = DB.cuadros.find(c => c.nombre === val);
        if(data) {
            if(prefix==='conf') { document.getElementById('conf_id_interno').innerText = data.id; document.getElementById('conf_info_total').innerText = data.max; }
            document.getElementById(prefix+'_inicio').value = 1;
            document.getElementById(prefix+'_fin').value = data.max;
            let lado = 'COMPLETA';
            if(data.ori && data.ori.toUpperCase().includes('SUR')) lado = 'SUR';
            if(data.ori && data.ori.toUpperCase().includes('NORTE')) lado = 'NORTE';
            document.getElementById(prefix+'_lado').value = lado;
        }
    }

    // --- SESIÓN ---
    function iniciarJornada() { configurarSesion('conf'); }

    function configurarSesion(prefix) {
        const cNombre = document.getElementById(prefix+'_cuadro').value;
        const aNombre = document.getElementById(prefix+'_act').value;
        const jNombre = document.getElementById(prefix+'_jornada').value;
        const ini = parseInt(document.getElementById(prefix+'_inicio').value);
        const fin = parseInt(document.getElementById(prefix+'_fin').value);

        if(!cNombre || !jNombre || isNaN(ini)) return alert("Faltan datos obligatorios.");
        const cObj = DB.cuadros.find(x => x.nombre === cNombre);
        const aObj = DB.actividades.find(x => x.desc === aNombre);
        
        DB.sesion = {
            idCuadro: cObj ? cObj.id : "??",
            nomCuadro: cNombre,
            idActividad: aObj ? aObj.id : "??",
            nomActividad: aNombre,
            jornada: jNombre,
            lado: document.getElementById(prefix+'_lado').value,
            modo: document.getElementById(prefix+'_modo').value,
            tareaSize: parseInt(document.getElementById(prefix+'_tarea_size').value) || 1,
            inicio: ini,
            fin: fin,
            responsable: document.getElementById('conf_resp').value || DB.sesion?.responsable || "Admin",
            activo: true
        };
        
        if(prefix === 'conf') { DB.avance = []; DB.historial = []; DB.staff = []; }
        guardarTodo();
        irAlMapa();
    }

    function irAlMapa() {
        document.getElementById('viewSetup').classList.remove('open');
        document.getElementById('modalMass').classList.remove('open');
        document.getElementById('viewMain').classList.add('open');
        document.getElementById('disp_cuadro').innerText = `${DB.sesion.nomCuadro}`;
        document.getElementById('disp_act').innerText = DB.sesion.nomActividad;
        document.getElementById('disp_jornada').innerText = DB.sesion.jornada;
        document.getElementById('disp_rango').innerText = `Hileras ${DB.sesion.inicio} - ${DB.sesion.fin}`;
        renderMapa();
        
        if(!scanner) {
            scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render(onScan);
        }
    }

    // --- LOGICA DE ESCANEO ANTI-REBOTE ---
    function onScan(id) {
        id = id.trim();
        let now = Date.now();

        // COOLDOWN: Si pasaron menos de 3000ms (3 segundos) desde el último scan de ESTA MISMA credencial, ignorar.
        if (lastScanTime[id] && (now - lastScanTime[id] < 3000)) {
            console.log("Scan ignorado por rebote: " + id);
            return;
        }
        lastScanTime[id] = now; // Actualizar tiempo

        let trabajador = DB.staff.find(s => s.id === id);

        if(trabajador && trabajador.fila) {
            cerrarTarea(trabajador);
            audioBeep.play();
        } else {
            if(!trabajador) { trabajador = { id: id, fila: null }; DB.staff.push(trabajador); }
            asignarNuevaTarea(trabajador);
            audioBeep.play();
        }
        guardarTodo();
        renderMapa();
    }

    function cerrarTarea(trabajador) {
        let regs = DB.avance.filter(a => a.obrero === trabajador.id && !a.fin);
        regs.forEach(r => { r.fin = new Date().toLocaleTimeString(); r.ts_fin = Date.now(); });
        trabajador.fila = null;
    }

    function asignarNuevaTarea(trabajador) {
        let filaInicio = 0;
        let filasAsignadas = [];

        if (DB.sesion.modo === 'PAREJAS') {
            for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
                let activos = DB.avance.filter(a => a.fila === i && !a.fin).length;
                if(activos < 2) { filaInicio = i; filasAsignadas = [i]; break; }
            }
        } else {
            let size = DB.sesion.tareaSize;
            for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
                if ((i + size - 1) > DB.sesion.fin) continue;
                let bloqueLibre = true;
                for(let k=0; k<size; k++) {
                    if(DB.avance.some(a => a.fila === (i+k))) { bloqueLibre=false; break; }
                }
                if(bloqueLibre) { filaInicio = i; for(let k=0; k<size; k++) filasAsignadas.push(i+k); break; }
            }
        }

        if(filasAsignadas.length > 0) {
            trabajador.fila = filaInicio;
            filasAsignadas.forEach(f => {
                DB.avance.push({
                    fila: f, obrero: trabajador.id, inicio: new Date().toLocaleTimeString(), ts_inicio: Date.now(), fin: null,
                    idCuadro: DB.sesion.idCuadro, nomCuadro: DB.sesion.nomCuadro, idActividad: DB.sesion.idActividad, jornada: DB.sesion.jornada, lado: DB.sesion.lado
                });
            });
        } else {
            alert("⚠️ Rango lleno. Cambia de actividad.");
        }
    }

    // --- EDITOR MANUAL ---
    function abrirEditor() {
        const list = document.getElementById('editorList');
        list.innerHTML = "";
        
        // Mostrar solo registros activos (sin hora fin)
        const activos = DB.avance.filter(a => !a.fin);
        
        if(activos.length === 0) list.innerHTML = "<p style='color:#aaa; text-align:center;'>No hay gente trabajando ahora.</p>";

        activos.forEach((rec, idx) => {
            // Buscamos el índice real en el array principal para editarlo
            let realIdx = DB.avance.indexOf(rec);
            
            list.innerHTML += `
            <div class="edit-item">
                <div>
                    <b style="color:var(--sec);">${rec.obrero}</b><br>
                    <small>Fila Actual: ${rec.fila}</small>
                </div>
                <div>
                    <button class="btn btn-sm btn-b" onclick="cambiarFilaManual(${realIdx})">CAMBIAR FILA</button>
                    <button class="btn btn-sm btn-r" onclick="borrarRegistro(${realIdx}, '${rec.obrero}')">BORRAR</button>
                </div>
            </div>`;
        });
        document.getElementById('modalEditor').classList.add('open');
    }

    function cambiarFilaManual(idx) {
        let nueva = prompt("Ingresa el nuevo número de fila:");
        if(nueva && !isNaN(nueva)) {
            DB.avance[idx].fila = parseInt(nueva);
            guardarTodo();
            abrirEditor(); // Refrescar lista
            renderMapa();
        }
    }

    function borrarRegistro(idx, idObrero) {
        if(confirm("¿Eliminar este registro?")) {
            DB.avance.splice(idx, 1);
            // También liberar al staff
            let st = DB.staff.find(s => s.id === idObrero);
            if(st) st.fila = null;
            
            guardarTodo();
            abrirEditor();
            renderMapa();
        }
    }

    // --- CAMBIO MASIVO ---
    function abrirAvanceMasivo() { 
        document.getElementById('mass_jornada').value = DB.sesion.jornada;
        document.getElementById('modalMass').classList.add('open'); 
    }

    function ejecutarCambioActividad() {
        if(!confirm("¿Mover a todos al nuevo cuadro/actividad?")) return;
        let ahora = new Date().toLocaleTimeString();
        let ts = Date.now();
        DB.avance.forEach(a => { if(!a.fin) { a.fin = ahora; a.ts_fin = ts; } });
        DB.historial = DB.historial.concat(DB.avance);
        DB.avance = [];
        configurarSesion('mass');
        DB.staff.forEach(s => { s.fila = null; asignarNuevaTarea(s); });
        guardarTodo();
        renderMapa();
    }

    // --- CIERRE ---
    function finalizarDia() {
        if(!confirm("🛑 ¿FINALIZAR DÍA? Se descargarán los reportes.")) return;
        let ahora = new Date().toLocaleTimeString();
        let ts = Date.now();
        DB.avance.forEach(a => { if(!a.fin) { a.fin = ahora; a.ts_fin = ts; } });
        DB.historial = DB.historial.concat(DB.avance);
        DB.avance = [];
        descargarReporte('ASISTENCIA');
        setTimeout(() => location.reload(), 2000);
    }

    function renderMapa() {
        const grid = document.getElementById('mapGrid');
        grid.innerHTML = "";
        let terminadas = new Set();
        DB.avance.forEach(a => { if(a.fin) terminadas.add(a.fila); });
        let personasActivas = new Set(DB.avance.filter(a=>!a.fin).map(a=>a.obrero)).size;

        for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            let div = document.createElement('div');
            div.className = "row-item";
            let gente = DB.avance.filter(a => a.fila === i && !a.fin).map(a => a.obrero);
            let done = terminadas.has(i) && gente.length === 0;
            div.innerHTML = `<span>${i}</span>`;
            if(done) div.className += " done";
            else if(gente.length > 0) {
                div.className += " active";
                div.innerHTML += `<span class="row-tag">${gente.join(',')}</span>`;
                div.innerHTML += `<div class="badge">${gente.length}</div>`;
            }
            grid.appendChild(div);
        }
        let total = DB.sesion.fin - DB.sesion.inicio + 1;
        document.getElementById('stat_done').innerText = Math.round((terminadas.size/total)*100) + "%";
        document.getElementById('stat_active').innerText = personasActivas;
    }

    function guardarTodo() {
        localStorage.setItem('v32_sesion', JSON.stringify(DB.sesion));
        localStorage.setItem('v32_avance', JSON.stringify(DB.avance));
        localStorage.setItem('v32_historial', JSON.stringify(DB.historial));
        localStorage.setItem('v32_staff', JSON.stringify(DB.staff));
    }

    function descargarReporte(tipo) {
        // CORRECCIÓN: Unimos historial + avance actual para el reporte parcial
        let data = DB.historial.concat(DB.avance);
        let csv = "";
        let filename = "";

        if(tipo === 'ASISTENCIA') {
            csv = "CREDENCIAL,ID_CUADRO,ID_ACTIVIDAD,JORNADA,HORA_ENTRADA,HORA_SALIDA\n";
            let unicos = []; 
            data.forEach(r => {
                let key = `${r.obrero}|${r.idCuadro}|${r.idActividad}|${r.jornada}`;
                if(!unicos.includes(key)) unicos.push(key);
            });
            unicos.forEach(key => {
                let parts = key.split('|');
                let recs = data.filter(r => r.obrero==parts[0] && r.idCuadro==parts[1] && r.jornada==parts[3]);
                recs.sort((a,b) => a.ts_inicio - b.ts_inicio);
                let entrada = recs[0].inicio;
                let salida = recs[recs.length-1].fin || "ACTIVO";
                csv += `${parts[0]},${parts[1]},${parts[2]},${parts[3]},${entrada},${salida}\n`;
            });
            filename = `ASISTENCIA_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`;
        }
        let blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
    }
</script>
</body>
</html>
