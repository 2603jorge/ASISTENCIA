<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V43 - Smart Move</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; --blue: #1565c0; --danger: #c62828; --purple: #7b1fa2; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; }
        
        /* ESTILOS DE V40 (RECUPERADOS) */
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 13px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; color: white; }
        .btn-g { background: var(--main); } .btn-o { background: var(--sec); color: black; }
        .btn-b { background: var(--blue); } .btn-r { background: var(--danger); } .btn-p { background: var(--purple); }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }

        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; max-height: 280px; overflow-y: auto; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .row-item { height: 45px; background: #333; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 1px solid #444; position: relative; overflow: hidden; }
        .done { background: var(--main); border-color: #66bb6a; opacity: 0.6; }
        .active { background: var(--sec); border-color: #ffca28; color: black; animation: pulse 2s infinite; }
        .row-tag { font-size: 8px; position: absolute; bottom: 1px; width: 100%; text-align: center; }
        .badge { position: absolute; top: 0; right: 0; background: var(--blue); color: white; font-size: 8px; padding: 2px 4px; border-radius: 0 0 0 5px; }
        
        .manual-box { display: flex; gap: 5px; background: #222; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #444; }
        .manual-box input { margin: 0; flex: 1; }
        .manual-box button { width: auto; padding: 0 20px; margin: 0; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        .flex-row { display: flex; gap: 10px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">AgriCactus V43</h2>
    <button class="btn btn-b" style="padding:10px;" onclick="abrirDB()">📂 CARGAR CATÁLOGOS</button>

    <div class="card">
        <h3 style="margin-top:0; color:var(--sec);">👷 SUPERVISOR</h3>
        <label>ID Credencial Supervisor</label>
        <input type="text" id="conf_sup_id" placeholder="Escanea o escribe ID">
        <label>Nombre Supervisor</label>
        <input type="text" id="conf_resp" placeholder="Nombre Completo">

        <hr style="border-color:#333; margin: 15px 0;">

        <label>🔍 Buscar Cuadro</label>
        <input type="text" id="conf_cuadro" list="lista_cuadros" placeholder="Escribe ID..." oninput="alEscribirCuadro('conf')">
        <datalist id="lista_cuadros"></datalist>
        <div style="font-size:10px; color:#aaa; margin-bottom:10px; text-align:right;">Total Hileras: <b id="conf_info_total">--</b></div>

        <div class="flex-row">
            <div style="flex:1"><label>Lado</label><select id="conf_lado"><option value="COMPLETA">COMPLETA</option><option value="NORTE">NORTE</option><option value="SUR">SUR</option></select></div>
            <div style="flex:1"><label>Actividad</label><input type="text" id="conf_act" list="lista_actividades"><datalist id="lista_actividades"></datalist></div>
        </div>
        
        <label>🕒 JORNADA</label><select id="conf_jornada"><option value="">-- Seleccionar --</option></select>
        <label style="color:var(--sec);">👥 TOTAL PERSONAL</label><input type="number" id="conf_total_staff" placeholder="Ej: 20">
        <label>RANGO DE TRABAJO</label><div class="flex-row"><input type="number" id="conf_inicio" placeholder="Desde"><input type="number" id="conf_fin" placeholder="Hasta"></div>

        <label>🛠️ MODO ASIGNACIÓN</label>
        <select id="conf_modo" onchange="toggleModoInput('conf')"><option value="PAREJAS">👥 PAREJAS (2 por fila)</option><option value="INDIVIDUAL">👤 INDIVIDUAL (1 por fila)</option></select>
    </div>
    <button class="btn btn-g" onclick="iniciarJornada()">🚀 INICIAR DÍA</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <div style="line-height:1.2;">
            <b id="disp_cuadro" style="font-size:16px; color:white;">--</b>
            <div style="font-size:11px; color:#aaa;"><span id="disp_act">--</span> | <span id="disp_jornada" style="color:var(--sec);">--</span></div>
            <div style="font-size:10px; color:var(--main);">Sup: <span id="disp_sup_name">--</span></div>
        </div>
        <div style="text-align:right;"><span style="font-size:10px; color:#888;">RANGO:</span><br><b id="disp_rango" style="font-size:12px;">--</b></div>
    </div>

    <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; border:2px solid #555; background:black; margin-bottom:10px; height:200px;"></div>
    
    <div class="manual-box">
        <input type="text" id="manual_id" placeholder="⌨️ Entrada Manual (ID)">
        <button class="btn btn-b" onclick="registrarManual()">OK</button>
    </div>

    <div class="card" style="display:grid; grid-template-columns:1fr 1fr; text-align:center; padding:10px; gap:5px; margin-bottom:10px;">
        <div style="background:#333; border-radius:8px; padding:5px;"><small>HECHO</small><br><b id="stat_done" style="font-size:20px; color:var(--main);">0%</b></div>
        <div style="background:#333; border-radius:8px; padding:5px;"><small>ASISTENCIA</small><br><b id="stat_active" style="font-size:20px; color:var(--sec);">0/0</b></div>
    </div>
    
    <div class="card" style="padding:5px;"><div id="mapGrid" class="grid-map"></div></div>
    
    <div class="flex-row">
        <button class="btn btn-g" onclick="ejecutarAvanceMasivoInteligente()">⏩ AVANCE MASIVO<br><small>(Mover grupos al sig. bloque vacío)</small></button>
    </div>
    
    <div class="flex-row">
        <button class="btn btn-b" onclick="abrirEditor()">✏️ EDITAR</button>
        <button class="btn btn-p" onclick="descargarReporte('PARCIAL')">📊 REPORTE</button>
    </div>
    <button class="btn btn-r" onclick="confirmarFinDia()">🏁 FINALIZAR DÍA (Cerrar todo)</button>
</div>

<div id="modalNextAct" class="modal" style="background:rgba(0,0,0,0.95);">
    <h2 style="color:var(--sec); text-align:center;">🔄 SIGUIENTE ACTIVIDAD</h2>
    <p style="text-align:center; color:#fff;">El cuadro anterior se completó. Configura el siguiente paso.</p>
    <div class="card">
        <label>Nuevo Cuadro</label><input type="text" id="chg_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('chg')">
        <label>Actividad</label><input type="text" id="chg_act" list="lista_actividades">
        <label>Jornada</label><select id="chg_jornada"></select>
        <label>Rango</label><div class="flex-row"><input type="number" id="chg_inicio"><input type="number" id="chg_fin"></div>
        <label>Modo</label><select id="chg_modo" onchange="toggleModoInput('chg')"><option value="PAREJAS">PAREJAS</option><option value="INDIVIDUAL">INDIVIDUAL</option></select>
    </div>
    <button class="btn btn-o" onclick="ejecutarCambioActividad()">✅ INICIAR NUEVO CUADRO</button>
    <button class="btn btn-r" onclick="document.getElementById('modalNextAct').classList.remove('open')">CANCELAR</button>
</div>

<div id="modalDB" class="modal" style="background:#111;"><h3>📂 Catálogos</h3><label>1. CUADROS</label><textarea id="csv_cuadros" rows="2"></textarea><label>2. ACTIVIDADES</label><textarea id="csv_act" rows="2"></textarea><label>3. JORNADAS</label><textarea id="csv_jor" rows="2"></textarea><button class="btn btn-g" onclick="procesarYGuardar()">GUARDAR</button><button class="btn" onclick="document.getElementById('modalDB').classList.remove('open')">VOLVER</button></div>
<div id="modalEditor" class="modal" style="background:#111;"><h2>✏️ CORRECCIÓN</h2><div id="editorList" style="max-height: 400px; overflow-y: auto;"></div><button class="btn" onclick="document.getElementById('modalEditor').classList.remove('open')">VOLVER</button></div>

<script>
    // Recuperar datos estilo V40
    let DB = {
        cuadros: JSON.parse(localStorage.getItem('v43_cuadros')) || [],
        actividades: JSON.parse(localStorage.getItem('v43_act')) || [],
        jornadas: JSON.parse(localStorage.getItem('v43_jornadas')) || [],
        sesion: JSON.parse(localStorage.getItem('v43_sesion')) || null,
        avance: JSON.parse(localStorage.getItem('v43_avance')) || [], // Historial completo
        staff: JSON.parse(localStorage.getItem('v43_staff')) || [] // Estado actual de trabajadores
    };
    let scanner = null, lastScanTime = {};
    const audioBeep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    window.onload = () => {
        actualizarSelectores();
        if (DB.sesion && DB.sesion.activo) irAlMapa();
    };

    function abrirDB() { document.getElementById('modalDB').classList.add('open'); }
    function toggleModoInput(prefix) { /* No-op, mantenido por compatibilidad visual */ }

    function procesarYGuardar() {
        const txtC = document.getElementById('csv_cuadros').value;
        const txtA = document.getElementById('csv_act').value;
        const txtJ = document.getElementById('csv_jor').value;

        if(txtC.trim()) DB.cuadros = txtC.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=5) ? {id:c[0].trim(), nombre:c[1].trim(), ori:c[3].trim(), max:parseInt(c[5])} : null }).filter(x=>x&&x.id);
        if(txtA.trim()) DB.actividades = txtA.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        if(txtJ.trim()) DB.jornadas = txtJ.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);

        localStorage.setItem('v43_cuadros', JSON.stringify(DB.cuadros));
        localStorage.setItem('v43_act', JSON.stringify(DB.actividades));
        localStorage.setItem('v43_jornadas', JSON.stringify(DB.jornadas));
        actualizarSelectores();
        alert("✅ Datos Actualizados");
        document.getElementById('modalDB').classList.remove('open');
    }

    function actualizarSelectores() {
        const listaC = document.getElementById('lista_cuadros'), listaA = document.getElementById('lista_actividades');
        if(DB.cuadros.length) listaC.innerHTML = DB.cuadros.map(c => `<option value="${c.nombre}">ID: ${c.id} | Ori: ${c.ori}</option>`).join('');
        if(DB.actividades.length) listaA.innerHTML = DB.actividades.map(a => `<option value="${a.desc}">ID: ${a.id}</option>`).join('');
        const optsJ = `<option value="">-- Seleccionar --</option>` + DB.jornadas.map(j => `<option value="${j.desc}">${j.desc}</option>`).join('');
        document.getElementById('conf_jornada').innerHTML = optsJ; document.getElementById('chg_jornada').innerHTML = optsJ;
    }

    function alEscribirCuadro(prefix) {
        const val = document.getElementById(prefix+'_cuadro').value;
        const data = DB.cuadros.find(c => c.nombre === val);
        if(data) {
            let infoTotal = document.getElementById('conf_info_total');
            if(infoTotal) infoTotal.innerText = data.max;
            document.getElementById(prefix+'_inicio').value = 1; document.getElementById(prefix+'_fin').value = data.max;
            let lado = 'COMPLETA';
            if(data.ori && data.ori.toUpperCase().includes('SUR')) lado = 'SUR';
            if(data.ori && data.ori.toUpperCase().includes('NORTE')) lado = 'NORTE';
            document.getElementById(prefix+'_lado').value = lado;
        }
    }

    // --- INICIO SESIÓN ---
    function iniciarJornada() { 
        const supId = document.getElementById('conf_sup_id').value;
        const supNom = document.getElementById('conf_resp').value;
        if(!supId || !supNom) return alert("❌ Debes ingresar ID y Nombre del Supervisor");
        configurarSesion('conf'); 
    }

    function configurarSesion(prefix) {
        const cNombre = document.getElementById(prefix+'_cuadro').value;
        const ini = parseInt(document.getElementById(prefix+'_inicio').value);
        const fin = parseInt(document.getElementById(prefix+'_fin').value);

        if(!cNombre || isNaN(ini)) return alert("Faltan datos obligatorios.");
        const cObj = DB.cuadros.find(x => x.nombre === cNombre);
        
        let aNombre, jNombre, modo, totalStaff;
        
        if (prefix === 'chg') { 
             aNombre = document.getElementById(prefix+'_act').value; jNombre = document.getElementById(prefix+'_jornada').value;
             modo = document.getElementById(prefix+'_modo').value; 
             totalStaff = DB.sesion.totalStaff;
        } else {
            aNombre = document.getElementById(prefix+'_act').value; jNombre = document.getElementById(prefix+'_jornada').value;
            modo = document.getElementById(prefix+'_modo').value; 
            totalStaff = parseInt(document.getElementById('conf_total_staff').value) || (DB.sesion ? DB.sesion.totalStaff : 0);
        }
        
        const aObj = DB.actividades.find(x => x.desc === aNombre);
        const supId = document.getElementById('conf_sup_id').value || (DB.sesion ? DB.sesion.supId : '');
        const supNom = document.getElementById('conf_resp').value || (DB.sesion ? DB.sesion.responsable : '');

        DB.sesion = {
            idCuadro: cObj ? cObj.id : "??", nomCuadro: cNombre,
            idActividad: aObj ? aObj.id : "??", nomActividad: aNombre,
            jornada: jNombre, lado: document.getElementById(prefix+'_lado').value,
            modo: modo, inicio: ini, fin: fin, totalStaff: totalStaff,
            supId: supId, responsable: supNom,
            activo: true
        };
        
        if(prefix === 'conf') { DB.avance = []; DB.staff = []; }
        guardarTodo();
        irAlMapa();
    }

    function irAlMapa() {
        document.getElementById('viewSetup').classList.remove('open'); document.getElementById('modalNextAct').classList.remove('open');
        document.getElementById('viewMain').classList.add('open');
        document.getElementById('disp_cuadro').innerText = `${DB.sesion.nomCuadro}`;
        document.getElementById('disp_act').innerText = DB.sesion.nomActividad;
        document.getElementById('disp_jornada').innerText = DB.sesion.jornada;
        document.getElementById('disp_sup_name').innerText = DB.sesion.responsable;
        document.getElementById('disp_rango').innerText = `Hileras ${DB.sesion.inicio} - ${DB.sesion.fin} (${DB.sesion.modo})`;
        renderMapa();
        if(!scanner) { scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }); scanner.render(onScan); }
    }

    // --- ENTRADA MANUAL ---
    function registrarManual() {
        let id = document.getElementById('manual_id').value.toUpperCase().trim();
        if(id) { onScan(id); document.getElementById('manual_id').value = ''; }
    }

    // ==========================================
    // LÓGICA CORE V43 (RE-ESCANEO Y AVANCE)
    // ==========================================

    function onScan(id) {
        id = id.trim();
        let now = Date.now();
        if (lastScanTime[id] && (now - lastScanTime[id] < 3000)) return;
        lastScanTime[id] = now;

        let trabajador = DB.staff.find(s => s.id === id);

        if(trabajador && trabajador.fila) {
            // === YA TIENE FILA: PREGUNTAR A DÓNDE MOVER ===
            let sugerencia = buscarSiguienteFilaVacia();
            let nuevaFila = prompt(`⚠️ ${id} ya está en la fila ${trabajador.fila}.\n\n¿A qué fila desea moverlo? (Sugerencia: ${sugerencia})`, sugerencia);
            
            if (nuevaFila !== null) { // Si no dio Cancelar
                nuevaFila = parseInt(nuevaFila);
                if (!isNaN(nuevaFila) && nuevaFila >= DB.sesion.inicio && nuevaFila <= DB.sesion.fin) {
                    // Validar espacio
                    if (validarEspacioEnFila(nuevaFila)) {
                        cerrarTarea(trabajador);
                        asignarFilaEspecifica(trabajador, nuevaFila);
                        alert(`✅ Movido a fila ${nuevaFila}`);
                        audioBeep.play();
                    } else {
                        alert("⛔ Fila llena.");
                    }
                } else {
                    alert("⛔ Número de fila inválido.");
                }
            }
        } else {
            // === NUEVO O LIBRE: ASIGNAR AUTOMÁTICO ===
            if(!trabajador) { trabajador = { id: id, fila: null }; DB.staff.push(trabajador); }
            asignarNuevaTareaAuto(trabajador);
            audioBeep.play();
        }
        guardarTodo();
        renderMapa();
    }

    // Busca la primera fila que cumpla las condiciones (vacía o con 1 espacio si es parejas)
    function buscarSiguienteFilaVacia() {
        for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            if (validarEspacioEnFila(i)) return i;
        }
        return DB.sesion.fin + 1; // Si todo está lleno
    }

    function validarEspacioEnFila(filaNum) {
        let ocupantes = DB.staff.filter(s => s.fila === filaNum).length;
        if (DB.sesion.modo === 'PAREJAS') return ocupantes < 2;
        return ocupantes === 0;
    }

    function cerrarTarea(trabajador) {
        // Encontrar registro abierto en avance (fin: null)
        // Usamos DB.avance que tiene todo el historial. Los activos tienen fin: null
        // OJO: DB.avance en V43 es historial acumulativo.
        let reg = DB.avance.find(a => a.obrero === trabajador.id && a.fin === null);
        if(reg) {
            reg.fin = new Date().toLocaleTimeString('es-MX');
            reg.ts_fin = Date.now();
        }
        trabajador.fila = null;
    }

    function asignarNuevaTareaAuto(trabajador) {
        let filaDestino = buscarSiguienteFilaVacia();
        
        if (filaDestino > DB.sesion.fin) {
            preguntaFinDeCuadro(); // Lleno
            return;
        }

        asignarFilaEspecifica(trabajador, filaDestino);
    }

    function asignarFilaEspecifica(trabajador, filaNum) {
        trabajador.fila = filaNum;
        DB.avance.push({
            fila: filaNum,
            obrero: trabajador.id,
            inicio: new Date().toLocaleTimeString('es-MX'),
            ts_inicio: Date.now(),
            fin: null, // Activo
            ts_fin: null,
            idCuadro: DB.sesion.idCuadro,
            nomCuadro: DB.sesion.nomCuadro,
            responsable: DB.sesion.responsable
        });
    }

    // ==========================================
    // AVANCE MASIVO INTELIGENTE
    // ==========================================
    function ejecutarAvanceMasivoInteligente() {
        if(!confirm("¿AVANZAR A TODOS AL SIGUIENTE BLOQUE?\n(Se respetarán las agrupaciones actuales)")) return;

        // 1. Obtener trabajadores activos y agruparlos por su fila actual
        let activos = DB.staff.filter(s => s.fila !== null);
        
        if (activos.length === 0) return alert("Nadie trabajando para mover.");

        // Mapa: FilaActual -> [Trabajador1, Trabajador2]
        let grupos = {};
        activos.forEach(t => {
            if (!grupos[t.fila]) grupos[t.fila] = [];
            grupos[t.fila].push(t);
        });

        // Ordenar las filas actuales (1, 2, 3...) para mover en orden
        let filasOrdenadas = Object.keys(grupos).map(Number).sort((a,b) => a - b);

        // 2. Cerrar tareas de todos (para liberar las filas viejas en la logica)
        activos.forEach(t => cerrarTarea(t));

        // 3. Buscar nuevos lugares para cada grupo
        let movidos = 0;
        let filaPuntero = DB.sesion.inicio; // Empezamos a buscar desde el inicio del cuadro

        // Función auxiliar para encontrar fila vacía REAL desde un punto
        const buscarVaciaDesde = (inicioBusqueda) => {
            for(let f = inicioBusqueda; f <= DB.sesion.fin; f++) {
                // Verificamos en DB.staff (que ya tiene los .fila = null de los que acabamos de cerrar)
                // Y verificamos contra los que YA HEMOS REASIGNADO en este bucle
                let ocupantes = DB.staff.filter(s => s.fila === f).length;
                if (ocupantes === 0) return f; // Queremos filas COMPLETAMENTE vacías para el bloque nuevo
            }
            return null;
        };

        // Recorrer grupo por grupo y asignar
        for (let filaVieja of filasOrdenadas) {
            let trabajadoresEnGrupo = grupos[filaVieja]; // Array [t1] o [t1, t2]
            
            // Buscar fila para este grupo
            let nuevaFila = buscarVaciaDesde(filaPuntero);
            
            if (nuevaFila !== null) {
                trabajadoresEnGrupo.forEach(t => {
                    asignarFilaEspecifica(t, nuevaFila);
                    movidos++;
                });
                // Actualizar puntero para que el siguiente grupo busque DESPUÉS de esta fila
                filaPuntero = nuevaFila + 1;
            } else {
                alert("⚠️ No hay espacio suficiente para mover a todos. El cuadro se llenó.");
                break;
            }
        }

        guardarTodo();
        renderMapa();
        alert(`✅ ${movidos} trabajadores avanzados.`);
    }

    // ==========================================
    // CIERRE Y UTILIDADES
    // ==========================================

    function preguntaFinDeCuadro() {
        // Evitar spam de modales
        if(document.querySelector('.modal.open') && document.querySelector('.modal.open').id !== 'viewMain') return;

        if(confirm("⚠️ ¡CUADRO LLENO! \n\n¿Terminó el día de trabajo? \n\n[ACEPTAR] = SÍ, Cerrar Día. \n[CANCELAR] = NO, Cambiar Actividad.")) {
            confirmarFinDia(); 
        } else {
            abrirSiguienteActividad();
        }
    }

    function abrirSiguienteActividad() { 
        document.getElementById('chg_jornada').value = DB.sesion.jornada; 
        document.getElementById('modalNextAct').classList.add('open'); 
    }

    function ejecutarCambioActividad() { 
        if(!document.getElementById('chg_cuadro').value) return alert("Selecciona cuadro");
        
        let ahora = new Date().toLocaleTimeString('es-MX'), ts = Date.now();
        // Cerrar abiertos
        DB.staff.forEach(t => cerrarTarea(t));
        
        configurarSesion('chg'); // Nueva sesión
        
        // Limpiar filas del staff (quedan "en el limbo" hasta ser escaneados o movidos)
        DB.staff.forEach(s => s.fila = null);
        
        guardarTodo();
        renderMapa();
    }

    function confirmarFinDia() {
        if(!confirm("🛑 ¿CONFIRMAS QUE EL DÍA TERMINÓ?")) return;
        DB.staff.forEach(t => cerrarTarea(t));
        descargarReporte('FINAL');
        setTimeout(() => location.reload(), 3000);
    }

    function renderMapa() {
        const grid = document.getElementById('mapGrid'); grid.innerHTML = "";
        let terminadas = new Set(); 
        // En V43, miramos el avance para ver qué filas se han tocado hoy en este cuadro
        DB.avance.filter(a => a.idCuadro === DB.sesion.idCuadro && a.fin !== null).forEach(a => terminadas.add(a.fila));
        
        let presentes = DB.staff.length; 
        document.getElementById('stat_active').innerText = `${presentes}/${DB.sesion.totalStaff || '?'}`;

        for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            let div = document.createElement('div'); div.className = "row-item";
            let gente = DB.staff.filter(s => s.fila === i).map(s => s.id); // Gente actualmente ahí
            
            div.innerHTML = `<span>${i}</span>`;
            
            if (gente.length > 0) {
                div.className += " active"; 
                div.innerHTML += `<span class="row-tag">${gente.join(',')}</span><div class="badge">${gente.length}</div>`;
            } else if (terminadas.has(i)) {
                div.className += " done";
            }
            grid.appendChild(div);
        }
        
        let total = DB.sesion.fin - DB.sesion.inicio + 1;
        document.getElementById('stat_done').innerText = Math.round((terminadas.size/total)*100) + "%";
    }

    function guardarTodo() {
        localStorage.setItem('v43_sesion', JSON.stringify(DB.sesion));
        localStorage.setItem('v43_avance', JSON.stringify(DB.avance));
        localStorage.setItem('v43_staff', JSON.stringify(DB.staff));
    }

    function descargarReporte(tipo) {
        let data = DB.avance;
        let csv = "ID_OBRERO,SUPERVISOR,CUADRO,FILA,HORA_INICIO,HORA_FIN\n";
        
        data.sort((a,b) => a.ts_inicio - b.ts_inicio);
        
        data.forEach(r => {
            let fin = r.fin || "EN PROCESO";
            csv += `${r.obrero},${r.responsable},${r.nomCuadro},${r.fila},${r.inicio},${fin}\n`;
        });
        
        let b = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        let l = document.createElement("a"); l.href = URL.createObjectURL(b); l.download = `REPORTE_${tipo}_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`; l.click();
    }
    
    // Editor simple
    function abrirEditor() {
        const list = document.getElementById('editorList'); list.innerHTML = "";
        let activos = DB.staff.filter(s => s.fila !== null);
        if(activos.length === 0) list.innerHTML = "<p>Nadie activo.</p>";
        activos.forEach((s) => {
            list.innerHTML += `<div class="edit-item"><div><b>${s.id}</b><br><small>Fila: ${s.fila}</small></div><div><button class="btn btn-sm btn-b" onclick="cambiarFilaManual('${s.id}')">CAMBIAR</button></div></div>`;
        });
        document.getElementById('modalEditor').classList.add('open');
    }
    function cambiarFilaManual(id) {
        let n = prompt("Nueva fila:");
        if(n && !isNaN(n)) {
            let s = DB.staff.find(x=>x.id===id);
            cerrarTarea(s);
            asignarFilaEspecifica(s, parseInt(n));
            guardarTodo(); renderMapa(); abrirEditor();
        }
    }
</script>
</body>
</html>
