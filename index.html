<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus - Cuadrillero v2.5</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --p: #1b5e20; --s: #f4f7f6; --danger: #c62828; --info: #0277bd; --accent: #ff9800; --sup: #673ab7; }
        body { font-family: sans-serif; background: var(--s); margin: 0; padding: 10px; padding-bottom: 80px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .counter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .counter-box { padding: 10px; border-radius: 8px; text-align: center; color: white; }
        .c-total { background: var(--info); }
        .c-temp { background: #2e7d32; }
        .count-val { font-size: 24px; font-weight: bold; display: block; }
        
        /* Indicador de Líneas Actuales */
        .config-status { background: #e8f5e9; border: 1px solid var(--p); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; }
        
        label { display: block; font-weight: bold; font-size: 11px; color: #555; margin-top: 10px; }
        input, select { width: 100%; height: 50px; margin-top: 5px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; padding: 0 10px; box-sizing: border-box; }
        
        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn-nav { padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 10px; }
        .btn-config { background: #607d8b; }
        .btn-view { background: var(--info); }
        .btn-sup { background: var(--sup); }

        #status { text-align: center; font-weight: bold; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; background: #eee; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .division-box { background: #fff3e0; border: 2px dashed #ff9800; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .btn-transfer { width: 100%; background: #673ab7; color: white; padding: 20px; border: none; border-radius: 12px; font-weight: bold; margin-top: 10px; font-size: 16px; }
    </style>
</head>
<body>

<div class="nav-buttons">
    <button class="btn-nav btn-config" onclick="abrirConfig()">⚙️ CONFIG / MAPEO</button>
    <button class="btn-nav btn-sup" onclick="activarEscaneoSup()">🛰️ QR SUPERVISOR</button>
    <button class="btn-nav btn-view" onclick="abrirRegistros()">📋 VER LISTADO</button>
</div>

<div class="config-status">
    📍 Cuadro: <b id="displayCuadro">--</b> | 🧵 Líneas: <b id="displayRango">-- al --</b>
</div>

<div class="counter-grid">
    <div class="counter-box c-total"><span class="count-val" id="countTotal">0</span><small>Total Local</small></div>
    <div class="counter-box c-temp"><span class="count-val" id="countEspera">0</span><small>En Cola</small></div>
</div>

<div class="card">
    <label>SUPERVISOR</label>
    <input type="text" id="sup" oninput="localStorage.setItem('c_sup', this.value)">
    <label>ACTIVIDAD</label>
    <input type="text" id="busA" placeholder="Buscar..." oninput="filtrar()">
    <select id="selA"></select>
    <label>JORNADA</label>
    <select id="selJ">
        <option value="9">MATUTINA</option>
        <option value="11">VESPERTINA</option>
        <option value="14">NOCTURNA</option>
        <option value="16">1 TAREA</option>
    </select>
</div>

<div class="card">
    <div id="reader" style="width: 100%; background: #000; border-radius: 8px;"></div>
    <div id="status">ESCANEANDO...</div>
</div>

<div class="division-box" id="areaDivision" style="display:none;">
    <h4 style="margin:0">📦 REPARTO AUTOMÁTICO</h4>
    <p id="infoReparto" style="font-size:12px; color:#666;"></p>
    <button onclick="confirmarDivision()" style="width:100%; background:var(--p); color:white; padding:15px; border:none; border-radius:8px; margin-top:10px; font-weight:bold;">✅ GUARDAR Y ASIGNAR LÍNEAS</button>
    <button onclick="cancelarCaptura()" style="width:100%; background:none; color:red; border:none; margin-top:10px;">Cancelar cola</button>
</div>

<button class="btn-transfer" onclick="prepararTransferencia()">📤 GENERAR QR PARA JEFE</button>

<div id="config" class="modal">
    <h3>Configuración y Mapeos</h3>
    <label>Asignación Manual de Cuadro/Líneas:</label>
    <input type="text" id="m_cuadro" placeholder="Cuadro (Ej: 201)">
    <div style="display:flex; gap:5px;">
        <input type="number" id="m_ini" placeholder="L. Inicio">
        <input type="number" id="m_fin" placeholder="L. Fin">
    </div>
    <button onclick="guardarConfigManual()" style="width:100%; padding:10px; background:var(--p); color:white; border:none; margin-top:5px;">FIJAR TRAMO</button>
    <hr>
    <label>MAPEO (Act, Emp, Cua)</label>
    <textarea id="importPuestos" style="width:100%; height:80px;"></textarea>
    <button onclick="guardarMapeo()" style="width:100%; padding:10px; background:var(--info); color:white; border:none;">GUARDAR MAPEO</button>
    <hr>
    <label>CATÁLOGOS (ID, Nombre, Var)</label>
    <textarea id="importInput" style="width:100%; height:80px;"></textarea>
    <button onclick="procesarCarga()" style="width:100%; padding:10px; background:black; color:white; border:none;">CARGAR</button>
    <button onclick="document.getElementById('config').style.display='none'" style="width:100%; padding:15px; margin-top:20px; background:#ddd; border:none;">CERRAR</button>
</div>

<div id="modalRegs" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Registros Capturados</h3>
        <button onclick="limpiarTodo()" style="background:var(--danger); color:white; border:none; padding:8px; border-radius:5px;">BORRAR TODO</button>
    </div>
    <div id="listaRegistros"></div>
    <button onclick="document.getElementById('modalRegs').style.display='none'" style="width:100%; padding:15px; margin-top:20px; background:#ddd; border:none;">VOLVER</button>
</div>

<div id="modalQR" class="modal" style="text-align:center;">
    <h3>Muestre este código al Jefe</h3>
    <div id="qrcode" style="display:flex; justify-content:center; margin:20px;"></div>
    <p>Registros: <span id="cantQR">0</span></p>
    <button onclick="document.getElementById('modalQR').style.display='none'" style="width:100%; padding:15px; background:#ddd; border:none;">CERRAR</button>
</div>

<script>
let CUADROS = JSON.parse(localStorage.getItem('c_cuadros')) || [];
let ACTS = JSON.parse(localStorage.getItem('c_acts')) || [];
let MAPEO_COMPLETO = JSON.parse(localStorage.getItem('c_mapeo_v2')) || {}; 
let REGS = JSON.parse(localStorage.getItem('c_regs')) || [];
let COLA_ESPERA = [];

let CUR_C = localStorage.getItem('cur_c') || "";
let CUR_LI = parseInt(localStorage.getItem('cur_li')) || 0;
let CUR_LF = parseInt(localStorage.getItem('cur_lf')) || 0;
let MODO_SUP = false;

function activarEscaneoSup() {
    MODO_SUP = true;
    document.getElementById('status').innerText = "🛰️ ESCANEE QR SUPERVISOR...";
}

function alEscanear(codigo) {
    if(MODO_SUP) {
        // Formato QR Sup: SUP_CONFIG|CUADRO|L_INI|L_FIN
        const p = codigo.split('|');
        if(p[0] === "SUP_CONFIG") {
            CUR_C = p[1]; CUR_LI = parseInt(p[2]); CUR_LF = parseInt(p[3]);
            localStorage.setItem('cur_c', CUR_C); localStorage.setItem('cur_li', CUR_LI); localStorage.setItem('cur_lf', CUR_LF);
            actualizarInterfaz();
            MODO_SUP = false;
            document.getElementById('status').innerText = "✅ TRAMO CONFIGURADO";
        }
    } else {
        if(!CUR_C) { alert("🛑 Configure el Cuadro primero"); return; }
        procesarRegistro(codigo);
    }
}

function procesarRegistro(codigo) {
    const cod = codigo.trim();
    if(REGS.find(r => r.e === cod) || COLA_ESPERA.find(c => c.e === cod)) {
        document.getElementById('status').innerText = "❌ YA REGISTRADO: " + cod;
        return;
    }
    COLA_ESPERA.push({ e: cod });
    document.getElementById('countEspera').innerText = COLA_ESPERA.length;
    document.getElementById('areaDivision').style.display = 'block';
    document.getElementById('infoReparto').innerText = `${COLA_ESPERA.length} personas listas para repartir desde línea ${CUR_LI}.`;
    document.getElementById('status').innerText = "👤 EN COLA: " + cod;
}

function confirmarDivision() {
    const h = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });
    const f = new Date().toLocaleDateString('en-GB');
    const jVal = document.getElementById('selJ').value;
    const jTex = document.getElementById('selJ').options[document.getElementById('selJ').selectedIndex].text;
    const sup = document.getElementById('sup').value;
    const actGral = document.getElementById('selA').value;

    COLA_ESPERA.forEach((persona, index) => {
        // LÓGICA DE 2 PERSONAS POR LÍNEA
        let avance = Math.floor(index / 2);
        let lineaAsignada = CUR_LI + avance;
        if(lineaAsignada > CUR_LF) lineaAsignada = CUR_LF;

        let regla = MAPEO_COMPLETO[persona.e];
        let actFinal = (regla && regla.act) ? regla.act : actGral;
        let cObj = CUADROS.find(c => c.id == CUR_C);

        REGS.push({
            id: Date.now() + index,
            f: f, h: h,
            c: CUR_C,
            l: lineaAsignada, // <--- LÍNEA CALCULADA
            a: actFinal,
            e: persona.e,
            j: jVal, jt: jTex, s: sup,
            v: cObj ? cObj.v : ""
        });
    });

    localStorage.setItem('c_regs', JSON.stringify(REGS));
    COLA_ESPERA = [];
    document.getElementById('areaDivision').style.display = 'none';
    actualizarInterfaz();
    alert("✅ Registros guardados y repartidos.");
}

function actualizarInterfaz() {
    document.getElementById('displayCuadro').innerText = CUR_C || "--";
    document.getElementById('displayRango').innerText = CUR_C ? `${CUR_LI} al ${CUR_LF}` : "--";
    document.getElementById('countTotal').innerText = REGS.length;
    document.getElementById('countEspera').innerText = COLA_ESPERA.length;
}

function guardarConfigManual() {
    CUR_C = document.getElementById('m_cuadro').value;
    CUR_LI = parseInt(document.getElementById('m_ini').value);
    CUR_LF = parseInt(document.getElementById('m_fin').value);
    localStorage.setItem('cur_c', CUR_C); 
    localStorage.setItem('cur_li', CUR_LI); 
    localStorage.setItem('cur_lf', CUR_LF);
    actualizarInterfaz();
    document.getElementById('config').style.display = 'none';
}

// ... (Funciones de Mapeo, Carga y Listado que ya tenías se mantienen igual) ...

function abrirRegistros() {
    const cont = document.getElementById('listaRegistros');
    cont.innerHTML = REGS.slice().reverse().map(r => `
        <div class="reg-item">
            <div><b>${r.e}</b><br><small>C:${r.c} L:${r.l} | ${r.h}</small></div>
            <button class="btn-del-mini" onclick="borrarRegistro(${r.id})">Eliminar</button>
        </div>
    `).join('') || "Vacio";
    document.getElementById('modalRegs').style.display = 'block';
}

function filtrar() {
    const fA = document.getElementById('busA').value.toLowerCase();
    document.getElementById('selA').innerHTML = ACTS.filter(a => a.id.toLowerCase().includes(fA) || a.n.toLowerCase().includes(fA)).map(a => `<option value="${a.id}">${a.n}</option>`).join('');
}

function guardarMapeo() {
    const lines = document.getElementById('importPuestos').value.trim().split('\n');
    let nuevo = {};
    lines.forEach(l => { 
        const p = l.split(',').map(x => x.trim()); 
        if(p.length >= 2) { nuevo[p[1]] = { act: p[0], cua: p[2] || "" }; } 
    });
    MAPEO_COMPLETO = nuevo;
    localStorage.setItem('c_mapeo_v2', JSON.stringify(MAPEO_COMPLETO));
    alert("Mapeos guardados");
}

function procesarCarga() {
    const lines = document.getElementById('importInput').value.trim().split('\n');
    let nC = [], nA = [];
    lines.forEach(l => {
        const p = l.split(',').map(x => x.trim());
        if(p.length === 3) nC.push({id: p[0], n: p[1], v: p[2]});
        else if(p.length === 2) nA.push({id: p[0], n: p[1]});
    });
    CUADROS = nC; ACTS = nA;
    localStorage.setItem('c_cuadros', JSON.stringify(CUADROS));
    localStorage.setItem('c_acts', JSON.stringify(ACTS));
    alert("Catálogos cargados"); filtrar();
}

function prepararTransferencia() {
    if(REGS.length === 0) return alert("No hay datos");
    document.getElementById('qrcode').innerHTML = "";
    document.getElementById('cantQR').innerText = REGS.length;
    const paquete = "AGRICACTUS_PACK|" + JSON.stringify(REGS);
    new QRCode(document.getElementById("qrcode"), { text: paquete, width: 300, height: 300, correctLevel : QRCode.CorrectLevel.L });
    document.getElementById('modalQR').style.display = 'block';
}

function borrarRegistro(id) {
    if(confirm("¿Borrar?")) { REGS = REGS.filter(r => r.id !== id); localStorage.setItem('c_regs', JSON.stringify(REGS)); actualizarInterfaz(); abrirRegistros(); }
}

function limpiarTodo() {
    if(confirm("¿Borrar todo?")) { REGS = []; localStorage.setItem('c_regs', '[]'); actualizarInterfaz(); abrirRegistros(); }
}

window.onload = () => {
    actualizarInterfaz();
    document.getElementById('sup').value = localStorage.getItem('c_sup') || "";
    filtrar();
    new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 }).render(alEscanear);
};
</script>
</body>
</html>
