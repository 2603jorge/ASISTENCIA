<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V42 - MultiZona & Tiempos</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; --blue: #1565c0; --danger: #c62828; --purple: #7b1fa2; --highlight: #00e676; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; padding-bottom: 50px; }
        
        /* UI Elements */
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 13px; margin-bottom: 5px; cursor: pointer; text-transform: uppercase; color: white; }
        .btn-g { background: var(--main); } .btn-o { background: var(--sec); color: black; }
        .btn-b { background: var(--blue); } .btn-r { background: var(--danger); } .btn-p { background: var(--purple); }
        
        input, select { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        label { font-size: 10px; color: #aaa; text-transform: uppercase; display: block; font-weight: bold; }

        /* MULTI-ZONA STYLES */
        .zone-card { border-left: 5px solid #555; transition: 0.3s; opacity: 0.7; }
        .zone-card.selected { border-left: 5px solid var(--highlight); opacity: 1; background: #252525; box-shadow: 0 0 10px rgba(0, 230, 118, 0.1); }
        .zone-header { display: flex; justify-content: space-between; align-items: center; }
        .zone-stats { font-size: 11px; color: #ccc; margin-top: 5px; }

        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 3px; max-height: 150px; overflow-y: auto; padding: 5px; background: rgba(0,0,0,0.3); border-radius: 5px; margin-top: 5px; }
        .row-item { height: 35px; background: #333; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 1px solid #444; position: relative; }
        .done { background: var(--main); opacity: 0.5; }
        .active { background: var(--sec); color: black; animation: pulse 2s infinite; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        .flex-row { display: flex; gap: 5px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">AgriCactus V42</h2>
    <div class="card">
        <label>👷 SUPERVISOR</label>
        <input type="text" id="conf_resp" placeholder="Nombre Supervisor">
        <label>🕒 JORNADA</label><select id="conf_jornada"><option>MAÑANA</option><option>TARDE</option><option>EXTRA</option></select>
    </div>
    
    <h3 style="color:var(--sec); margin:5px 0;">AGREGAR PRIMER CUADRO</h3>
    <div class="card">
        <label>Cuadro</label><input type="text" id="init_cuadro" placeholder="Ej: 201">
        <label>Actividad</label><input type="text" id="init_act" placeholder="Ej: Cosecha">
        <div class="flex-row">
            <div style="flex:1"><label>Inicio Fila</label><input type="number" id="init_inicio" value="1"></div>
            <div style="flex:1"><label>Fin Fila</label><input type="number" id="init_fin" value="50"></div>
        </div>
        <label>Modo</label><select id="init_modo"><option value="INDIVIDUAL">INDIVIDUAL</option><option value="PAREJAS">PAREJAS</option></select>
    </div>
    
    <button class="btn btn-g" onclick="iniciarSistema()">🚀 INICIAR SISTEMA</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
        <div style="font-size:12px;"><b style="color:var(--sec);">SUPERVISOR:</b> <span id="disp_resp">--</span></div>
        <button class="btn btn-b" style="width:auto; padding:5px 10px;" onclick="abrirAddZona()">➕ ZONA</button>
    </div>

    <div id="reader" style="width:100%; border-radius:10px; overflow:hidden; border:2px solid #444; height:180px; background:black; margin-bottom:10px;"></div>
    <div class="flex-row">
        <input type="text" id="manual_id" placeholder="Entrada Manual ID">
        <button class="btn btn-b" style="width:50px;" onclick="registrarManual()">OK</button>
    </div>

    <div style="text-align:center; font-size:11px; color:#aaa; margin-bottom:5px;">👇 SELECCIONA EN QUÉ ZONA ENTRARÁN LOS NUEVOS 👇</div>

    <div id="zonesContainer"></div>

    <hr style="border-color:#333;">

    <div class="flex-row">
        <button class="btn btn-g" onclick="ejecutarAvanceMasivo()">⏩ AVANCE MASIVO<br><small>(En Zona Seleccionada)</small></button>
    </div>
    <div class="flex-row">
        <button class="btn btn-p" onclick="descargarReporte('DETALLADO')">📊 REPORTE DETALLADO</button>
        <button class="btn btn-r" onclick="finalizarDia()">🏁 CERRAR TODO</button>
    </div>
</div>

<div id="modalAddZone" class="modal" style="background:rgba(0,0,0,0.95);">
    <h3 style="color:var(--highlight); text-align:center;">➕ AGREGAR OTRA ZONA</h3>
    <p style="text-align:center; font-size:12px;">Esto permite trabajar dos cuadros simultáneos.</p>
    <div class="card">
        <label>Nuevo Cuadro</label><input type="text" id="new_cuadro" placeholder="Ej: 701">
        <label>Actividad</label><input type="text" id="new_act" placeholder="Misma o Nueva">
        <div class="flex-row">
            <div style="flex:1"><label>Desde Fila</label><input type="number" id="new_inicio"></div>
            <div style="flex:1"><label>Hasta Fila</label><input type="number" id="new_fin"></div>
        </div>
        <label>Modo</label><select id="new_modo"><option value="INDIVIDUAL">INDIVIDUAL</option><option value="PAREJAS">PAREJAS</option></select>
    </div>
    <button class="btn btn-g" onclick="confirmarAddZona()">✅ AGREGAR</button>
    <button class="btn btn-r" onclick="document.getElementById('modalAddZone').classList.remove('open')">CANCELAR</button>
</div>

<script>
    // --- ESTADO GLOBAL ---
    let DB = {
        config: { resp: "", jornada: "" },
        zonas: [], // Array de objetos { id, cuadro, act, inicio, fin, modo, activeRows: [] }
        avance: [], // { obrero, zonaId, cuadro, fila, inicio, fin, ts_ini, ts_fin }
        staff: [] // { id, zonaActual, filaActual }
    };
    
    let activeZoneIndex = 0; // Índice de la zona seleccionada en pantalla (Target)
    let scanner = null;
    let lastScanTime = {};
    const audioBeep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    // --- INICIO ---
    function iniciarSistema() {
        const resp = document.getElementById('conf_resp').value;
        const cuadro = document.getElementById('init_cuadro').value;
        const inicio = parseInt(document.getElementById('init_inicio').value);
        const fin = parseInt(document.getElementById('init_fin').value);

        if(!resp || !cuadro || isNaN(inicio)) return alert("Datos incompletos");

        DB.config.resp = resp;
        DB.config.jornada = document.getElementById('conf_jornada').value;

        // Crear Zona 0
        agregarZonaObjeto(cuadro, document.getElementById('init_act').value, inicio, fin, document.getElementById('init_modo').value);

        document.getElementById('disp_resp').innerText = resp;
        document.getElementById('viewSetup').classList.remove('open');
        document.getElementById('viewMain').classList.add('open');
        
        renderZonas();
        if(!scanner) { scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 }); scanner.render(onScan); }
    }

    // --- GESTIÓN DE ZONAS (Split Crews) ---
    function abrirAddZona() { document.getElementById('modalAddZone').classList.add('open'); }
    
    function confirmarAddZona() {
        const c = document.getElementById('new_cuadro').value;
        const i = parseInt(document.getElementById('new_inicio').value);
        const f = parseInt(document.getElementById('new_fin').value);
        if(!c || isNaN(i)) return alert("Faltan datos");
        
        agregarZonaObjeto(c, document.getElementById('new_act').value, i, f, document.getElementById('new_modo').value);
        
        document.getElementById('modalAddZone').classList.remove('open');
        renderZonas();
    }

    function agregarZonaObjeto(cuadro, act, inicio, fin, modo) {
        DB.zonas.push({
            id: Date.now(), // ID único para la zona
            cuadro: cuadro,
            act: act,
            inicio: inicio,
            fin: fin,
            modo: modo
        });
        // Seleccionar automáticamente la nueva zona
        activeZoneIndex = DB.zonas.length - 1;
    }

    function seleccionarZona(idx) {
        activeZoneIndex = idx;
        renderZonas(); // Para actualizar estilos (borde verde)
    }

    // --- CORE: ESCANEO Y ASIGNACIÓN ---
    function registrarManual() {
        let id = document.getElementById('manual_id').value.toUpperCase().trim();
        if(id) { onScan(id); document.getElementById('manual_id').value = ''; }
    }

    function onScan(id) {
        id = id.trim();
        let now = Date.now();
        if (lastScanTime[id] && (now - lastScanTime[id] < 2000)) return;
        lastScanTime[id] = now;

        let trabajador = DB.staff.find(s => s.id === id);

        if(trabajador && trabajador.filaActual !== null) {
            // == YA ESTÁ TRABAJANDO ==
            // 1. Cerramos su fila actual (independiente de la zona)
            cerrarFilaTrabajador(trabajador);
            
            // 2. Decisión de zona:
            // Si la zona seleccionada manualmente es DISTINTA a donde él estaba, lo movemos.
            // Si es la misma, sigue avanzando en esa zona.
            let zonaDestinoIdx = activeZoneIndex;
            
            // Lógica Smart: Si yo no he tocado el selector (está en default) pero él estaba en la Zona B,
            // ¿debería seguir en la B o venir a la A?
            // REGLA DE NEGOCIO: El selector en pantalla MANDA.
            // Si tengo seleccionado Cuadro 701, todos los que escanee van al 701.
            
            asignarFila(trabajador, zonaDestinoIdx);
            audioBeep.play();

        } else {
            // == NUEVO INGRESO (O estaba libre) ==
            if(!trabajador) { 
                trabajador = { id: id, zonaActual: null, filaActual: null }; 
                DB.staff.push(trabajador); 
            }
            asignarFila(trabajador, activeZoneIndex); // Va a la zona seleccionada
            audioBeep.play();
        }
        renderZonas();
    }

    function cerrarFilaTrabajador(trabajador) {
        // Buscar el registro abierto en DB.avance
        let reg = DB.avance.find(a => a.obrero === trabajador.id && !a.fin);
        if(reg) {
            reg.fin = obtenerHora();
            reg.ts_fin = Date.now();
        }
        trabajador.filaActual = null;
        trabajador.zonaActual = null;
    }

    function asignarFila(trabajador, zonaIdx) {
        let zona = DB.zonas[zonaIdx];
        if(!zona) return alert("Error de Zona");

        let filasOcupadas = DB.avance
            .filter(a => a.zonaId === zona.id && !a.fin) // Solo activas
            .map(a => a.fila);
        
        let filaAsignada = null;

        // Buscar hueco
        if(zona.modo === 'PAREJAS') {
            for(let f = zona.inicio; f <= zona.fin; f++) {
                // Contar cuántos hay en esta fila
                let conteo = filasOcupadas.filter(x => x === f).length;
                if(conteo < 2) { filaAsignada = f; break; }
            }
        } else {
            // Individual
            for(let f = zona.inicio; f <= zona.fin; f++) {
                if(!filasOcupadas.includes(f)) { filaAsignada = f; break; }
            }
        }

        if(filaAsignada !== null) {
            // Crear registro detallado
            DB.avance.push({
                obrero: trabajador.id,
                zonaId: zona.id,
                cuadro: zona.cuadro,
                act: zona.act,
                fila: filaAsignada,
                inicio: obtenerHora(),
                ts_ini: Date.now(),
                fin: null,
                ts_fin: null
            });
            // Actualizar estado trabajador
            trabajador.zonaActual = zona.id;
            trabajador.filaActual = filaAsignada;
        } else {
            alert(`⚠️ CUADRO ${zona.cuadro} LLENO. No se asignó fila.`);
        }
    }

    // --- AVANCE MASIVO (POR ZONA) ---
    function ejecutarAvanceMasivo() {
        let zonaTarget = DB.zonas[activeZoneIndex];
        if(!confirm(`¿Avanzar a todos los del Cuadro ${zonaTarget.cuadro} a sus siguientes filas?`)) return;

        // 1. Identificar trabajadores activos EN ESTA ZONA
        let activosEnZona = DB.staff.filter(s => s.zonaActual === zonaTarget.id && s.filaActual !== null);
        
        // Ordenar por fila (para que avancen ordenadamente)
        activosEnZona.sort((a,b) => a.filaActual - b.filaActual);

        let count = 0;
        activosEnZona.forEach(t => {
            cerrarFilaTrabajador(t);
            asignarFila(t, activeZoneIndex); // Reasignar en la MISMA zona
            count++;
        });
        
        alert(`✅ ${count} personas avanzadas en Cuadro ${zonaTarget.cuadro}.`);
        renderZonas();
    }

    // --- UI RENDERING ---
    function renderZonas() {
        const container = document.getElementById('zonesContainer');
        container.innerHTML = "";

        DB.zonas.forEach((z, idx) => {
            // Calcular estadísticas
            let terminadas = new Set(DB.avance.filter(a => a.zonaId === z.id && a.fin).map(a => a.fila));
            let activas = DB.avance.filter(a => a.zonaId === z.id && !a.fin);
            let totalFilas = z.fin - z.inicio + 1;
            let pct = Math.round((terminadas.size / totalFilas) * 100);

            // Crear HTML de la tarjeta
            let div = document.createElement('div');
            div.className = `card zone-card ${idx === activeZoneIndex ? 'selected' : ''}`;
            div.onclick = () => seleccionarZona(idx);
            
            let htmlMap = "";
            for(let f = z.inicio; f <= z.fin; f++) {
                let statusClass = "";
                let label = f;
                
                // Check status
                if(terminadas.has(f)) statusClass = "done";
                
                // Buscar gente activa en esta fila
                let gente = activas.filter(a => a.fila === f).map(a => a.obrero);
                if(gente.length > 0) {
                    statusClass = "active";
                    // Si hay gente, mostramos ID pequeño
                    label += `<br><span style="font-size:7px;">${gente[0]}</span>`; 
                }

                htmlMap += `<div class="row-item ${statusClass}">${label}</div>`;
            }

            div.innerHTML = `
                <div class="zone-header">
                    <div>
                        <b style="font-size:14px; color:var(--highlight);">CUADRO ${z.cuadro}</b>
                        <br><span style="font-size:10px; color:#aaa;">${z.act}</span>
                    </div>
                    <div style="text-align:right;">
                        <b style="font-size:18px;">${pct}%</b>
                        <br><small style="color:${activas.length > 0 ? 'var(--sec)' : '#555'}">👥 ${activas.length} Activos</small>
                    </div>
                </div>
                <div class="grid-map">${htmlMap}</div>
            `;
            container.appendChild(div);
        });
    }

    // --- REPORTES ---
    function obtenerHora() {
        let d = new Date();
        return d.toLocaleTimeString('es-MX', { hour12: false });
    }

    function finalizarDia() {
        if(!confirm("¿Cerrar todas las filas abiertas y descargar reporte final?")) return;
        
        // Cerrar todo
        DB.staff.forEach(t => {
            if(t.filaActual !== null) cerrarFilaTrabajador(t);
        });
        
        descargarReporte('FINAL_DIA');
        setTimeout(() => location.reload(), 2000);
    }

    function descargarReporte(tipo) {
        // CSV Headers: DETALLADO fila por fila
        let csv = "ID_OBRERO,SUPERVISOR,JORNADA,CUADRO,ACTIVIDAD,NUM_FILA,HORA_INICIO_FILA,HORA_FIN_FILA\n";
        
        // Recorremos todo el historial de avance
        // Ordenamos por hora de inicio para cronología
        let datos = DB.avance.sort((a,b) => a.ts_ini - b.ts_ini);

        datos.forEach(r => {
            // Manejo de nulos si está activo
            let hFin = r.fin ? r.fin : "EN_PROCESO";
            
            csv += `${r.obrero},${DB.config.resp},${DB.config.jornada},${r.cuadro},${r.act},${r.fila},${r.inicio},${hFin}\n`;
        });

        let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        let link = document.createElement("a");
        let fecha = new Date().toLocaleDateString().replace(/\//g, '-');
        link.href = URL.createObjectURL(blob);
        link.download = `REPORTE_${tipo}_${fecha}.csv`;
        link.click();
    }
</script>
</body>
</html>
