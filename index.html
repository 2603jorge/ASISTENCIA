<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriCactus V35 - Flujo Continuo</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main: #2e7d32; --sec: #ff6f00; --dark: #121212; --card: #1e1e1e; --blue: #1565c0; --danger: #c62828; --purple: #7b1fa2; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; padding: 10px; }
        
        /* UI Elements */
        .card { background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; font-size: 13px; margin-bottom: 10px; cursor: pointer; text-transform: uppercase; color: white; }
        .btn-g { background: var(--main); }
        .btn-o { background: var(--sec); color: black; }
        .btn-b { background: var(--blue); }
        .btn-r { background: var(--danger); }
        .btn-p { background: var(--purple); }
        .btn-sm { padding: 8px; width: auto; font-size: 11px; margin: 0; }
        
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; display: block; margin-bottom: 4px; font-weight: bold; }

        .grid-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 5px; max-height: 280px; overflow-y: auto; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .row-item { height: 45px; background: #333; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 1px solid #444; position: relative; overflow: hidden; }
        .done { background: var(--main); border-color: #66bb6a; opacity: 0.6; }
        .active { background: var(--sec); border-color: #ffca28; color: black; animation: pulse 2s infinite; }
        .row-tag { font-size: 8px; position: absolute; bottom: 1px; width: 100%; text-align: center; }
        .badge { position: absolute; top: 0; right: 0; background: var(--blue); color: white; font-size: 8px; padding: 2px 4px; border-radius: 0 0 0 5px; }
        
        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: #333; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #555; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--main); }
        input:checked + .slider:before { transform: translateX(26px); }

        .edit-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px; border-radius: 8px; margin-bottom: 5px; border: 1px solid #444; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 1000; padding: 20px; box-sizing: border-box; display: none; overflow-y: auto; }
        .modal.open { display: block; }
        .flex-row { display: flex; gap: 10px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="viewSetup" class="modal open">
    <h2 style="text-align:center; color: var(--main);">AgriCactus V35</h2>
    <button class="btn btn-b" style="padding:10px;" onclick="abrirDB()">📂 CARGAR CATÁLOGOS</button>

    <div class="card">
        <label>Supervisor</label>
        <input type="text" id="conf_resp" placeholder="Nombre Responsable">

        <label>🔍 Buscar Cuadro</label>
        <input type="text" id="conf_cuadro" list="lista_cuadros" placeholder="Escribe ID o Nombre..." oninput="alEscribirCuadro('conf')">
        <datalist id="lista_cuadros"></datalist>
        <div style="font-size:10px; color:#aaa; margin-bottom:10px; text-align:right;">Total Hileras: <b id="conf_info_total">--</b></div>

        <div class="flex-row">
            <div style="flex:1"><label>Lado</label><select id="conf_lado"><option value="COMPLETA">COMPLETA</option><option value="NORTE">NORTE</option><option value="SUR">SUR</option></select></div>
            <div style="flex:1"><label>Actividad</label><input type="text" id="conf_act" list="lista_actividades"><datalist id="lista_actividades"></datalist></div>
        </div>
        
        <label>🕒 JORNADA</label><select id="conf_jornada"><option value="">-- Cargar Lista --</option></select>
        
        <label style="color:var(--sec);">👥 TOTAL PERSONAL (Esperado)</label>
        <input type="number" id="conf_total_staff" placeholder="Ej: 20 personas">

        <label>RANGO DE TRABAJO</label>
        <div class="flex-row"><input type="number" id="conf_inicio" placeholder="Desde"><input type="number" id="conf_fin" placeholder="Hasta"></div>

        <label>🛠️ MODO ASIGNACIÓN</label>
        <select id="conf_modo" onchange="toggleModoInput('conf')"><option value="INDIVIDUAL">👤 INDIVIDUAL</option><option value="PAREJAS">👥 PAREJAS</option></select>
        <div id="div_tarea_conf"><label>Filas por Tarea</label><input type="number" id="conf_tarea_size" value="1" min="1"></div>
    </div>
    <button class="btn btn-g" onclick="iniciarJornada()">🚀 INICIAR</button>
</div>

<div id="viewMain" class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
        <div style="line-height:1.2;">
            <b id="disp_cuadro" style="font-size:16px; color:white;">--</b>
            <div style="font-size:11px; color:#aaa;"><span id="disp_act">--</span> | <span id="disp_jornada" style="color:var(--sec);">--</span></div>
        </div>
        <div style="text-align:right;"><span style="font-size:10px; color:#888;">RANGO:</span><br><b id="disp_rango" style="font-size:12px;">--</b></div>
    </div>

    <div class="toggle-container">
        <div>
            <b style="font-size:14px;">🔄 MODO CONTINUO</b><br>
            <small style="color:#aaa;">Re-scan = Termina y Asigna Nueva</small>
        </div>
        <label class="switch">
            <input type="checkbox" id="toggle_continuo" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="card" style="display:grid; grid-template-columns:1fr 1fr; text-align:center; padding:10px; gap:5px; margin-bottom:10px;">
        <div style="background:#333; border-radius:8px; padding:5px;"><small>HECHO</small><br><b id="stat_done" style="font-size:20px; color:var(--main);">0%</b></div>
        <div style="background:#333; border-radius:8px; padding:5px;"><small>ASISTENCIA</small><br><b id="stat_active" style="font-size:20px; color:var(--sec);">0/0</b></div>
    </div>

    <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; border:2px solid #555; background:black; margin-bottom:10px; height:200px;"></div>
    
    <div class="card" style="padding:5px;"><div id="mapGrid" class="grid-map"></div></div>
    <button class="btn btn-b" style="margin-bottom:15px;" onclick="abrirEditor()">✏️ EDITAR / CORREGIR</button>

    <div class="flex-row">
        <button class="btn btn-g" onclick="abrirSiguienteCuadro()">⏩ SIGUIENTE CUADRO<br><small>(Mover a todos)</small></button>
        <button class="btn btn-o" onclick="abrirCambioActividad()">🔄 CAMBIO ACTIVIDAD<br><small>(Configurar Todo)</small></button>
    </div>

    <div class="flex-row">
        <button class="btn btn-p" onclick="descargarReporte('ASISTENCIA')">📊 PARCIAL</button>
        <button class="btn btn-r" onclick="finalizarDia()">🏁 CERRAR DÍA</button>
    </div>
</div>

<div id="modalNext" class="modal" style="background:rgba(0,0,0,0.95);">
    <h2 style="color:var(--main); text-align:center;">⏩ SIGUIENTE CUADRO</h2>
    <div class="card">
        <label>Nuevo Cuadro</label><input type="text" id="next_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('next')">
        <div class="flex-row"><div style="flex:1"><label>Lado</label><select id="next_lado"><option value="COMPLETA">COMPLETA</option><option value="NORTE">NORTE</option><option value="SUR">SUR</option></select></div><div style="flex:1"><label>Total BD</label><input type="text" id="next_info_total" readonly style="background:#444; color:#aaa;"></div></div>
        <label>Nuevo Rango</label><div class="flex-row"><input type="number" id="next_inicio"><input type="number" id="next_fin"></div>
    </div>
    <button class="btn btn-g" onclick="ejecutarSiguienteCuadro()">✅ CONFIRMAR Y MOVER</button>
    <button class="btn btn-r" onclick="document.getElementById('modalNext').classList.remove('open')">CANCELAR</button>
</div>

<div id="modalChange" class="modal" style="background:rgba(0,0,0,0.95);">
    <h2 style="color:var(--sec); text-align:center;">🔄 CAMBIO ACTIVIDAD</h2>
    <div class="card">
        <label>Nuevo Cuadro</label><input type="text" id="chg_cuadro" list="lista_cuadros" oninput="alEscribirCuadro('chg')">
        <label>Actividad</label><input type="text" id="chg_act" list="lista_actividades">
        <label>Jornada</label><select id="chg_jornada"></select>
        <label>Rango</label><div class="flex-row"><input type="number" id="chg_inicio"><input type="number" id="chg_fin"></div>
        <label>Modo</label><select id="chg_modo" onchange="toggleModoInput('chg')"><option value="INDIVIDUAL">INDIVIDUAL</option><option value="PAREJAS">PAREJAS</option></select>
        <div id="div_tarea_chg"><label>Filas</label><input type="number" id="chg_tarea_size" value="1"></div>
    </div>
    <button class="btn btn-o" onclick="ejecutarCambioTotal()">✅ INICIAR</button>
    <button class="btn btn-r" onclick="document.getElementById('modalChange').classList.remove('open')">CANCELAR</button>
</div>

<div id="modalEditor" class="modal" style="background:#111;"><h2>✏️ CORRECCIÓN</h2><div id="editorList" style="max-height: 400px; overflow-y: auto;"></div><button class="btn" onclick="document.getElementById('modalEditor').classList.remove('open')">VOLVER</button></div>
<div id="modalDB" class="modal" style="background:#111;"><h3>📂 Catálogos</h3><label>1. CUADROS</label><textarea id="csv_cuadros" rows="2"></textarea><label>2. ACTIVIDADES</label><textarea id="csv_act" rows="2"></textarea><label>3. JORNADAS</label><textarea id="csv_jor" rows="2"></textarea><button class="btn btn-g" onclick="procesarYGuardar()">GUARDAR</button><button class="btn" onclick="document.getElementById('modalDB').classList.remove('open')">VOLVER</button></div>

<script>
    let DB = {
        cuadros: JSON.parse(localStorage.getItem('v35_cuadros')) || [],
        actividades: JSON.parse(localStorage.getItem('v35_act')) || [],
        jornadas: JSON.parse(localStorage.getItem('v35_jornadas')) || [],
        sesion: JSON.parse(localStorage.getItem('v35_sesion')) || null,
        avance: JSON.parse(localStorage.getItem('v35_avance')) || [],
        historial: JSON.parse(localStorage.getItem('v35_historial')) || [],
        staff: JSON.parse(localStorage.getItem('v35_staff')) || []
    };
    let scanner = null, lastScanTime = {};
    const audioBeep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    window.onload = () => {
        actualizarSelectores();
        toggleModoInput('conf');
        if (DB.sesion && DB.sesion.activo) irAlMapa();
    };

    function abrirDB() { document.getElementById('modalDB').classList.add('open'); }
    function toggleModoInput(prefix) {
        let modo = document.getElementById(prefix + '_modo').value;
        let d = document.getElementById('div_tarea_' + prefix);
        if(d) d.style.display = (modo === 'INDIVIDUAL') ? 'block' : 'none';
    }

    function procesarYGuardar() {
        const txtC = document.getElementById('csv_cuadros').value;
        const txtA = document.getElementById('csv_act').value;
        const txtJ = document.getElementById('csv_jor').value;

        if(txtC.trim()) DB.cuadros = txtC.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=5) ? {id:c[0].trim(), nombre:c[1].trim(), ori:c[3].trim(), max:parseInt(c[5])} : null }).filter(x=>x&&x.id);
        if(txtA.trim()) DB.actividades = txtA.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);
        if(txtJ.trim()) DB.jornadas = txtJ.split('\n').map(l => { let c=l.split(/[,\t]/); return (c.length>=2) ? {id:c[0].trim(), desc:c[1].trim()} : null }).filter(x=>x);

        localStorage.setItem('v35_cuadros', JSON.stringify(DB.cuadros));
        localStorage.setItem('v35_act', JSON.stringify(DB.actividades));
        localStorage.setItem('v35_jornadas', JSON.stringify(DB.jornadas));
        actualizarSelectores();
        alert("✅ Datos Actualizados");
        document.getElementById('modalDB').classList.remove('open');
    }

    function actualizarSelectores() {
        const listaC = document.getElementById('lista_cuadros'), listaA = document.getElementById('lista_actividades');
        if(DB.cuadros.length) listaC.innerHTML = DB.cuadros.map(c => `<option value="${c.nombre}">ID: ${c.id} | Ori: ${c.ori}</option>`).join('');
        if(DB.actividades.length) listaA.innerHTML = DB.actividades.map(a => `<option value="${a.desc}">ID: ${a.id}</option>`).join('');
        const optsJ = `<option value="">-- Seleccionar --</option>` + DB.jornadas.map(j => `<option value="${j.desc}">${j.desc}</option>`).join('');
        document.getElementById('conf_jornada').innerHTML = optsJ; document.getElementById('chg_jornada').innerHTML = optsJ;
    }

    function alEscribirCuadro(prefix) {
        const val = document.getElementById(prefix+'_cuadro').value;
        const data = DB.cuadros.find(c => c.nombre === val);
        if(data) {
            if(prefix==='conf') document.getElementById('conf_info_total').innerText = data.max;
            if(prefix==='next') document.getElementById('next_info_total').value = data.max;
            document.getElementById(prefix+'_inicio').value = 1; document.getElementById(prefix+'_fin').value = data.max;
            let lado = 'COMPLETA';
            if(data.ori && data.ori.toUpperCase().includes('SUR')) lado = 'SUR';
            if(data.ori && data.ori.toUpperCase().includes('NORTE')) lado = 'NORTE';
            document.getElementById(prefix+'_lado').value = lado;
        }
    }

    // --- SESIÓN ---
    function iniciarJornada() { configurarSesion('conf'); }

    function configurarSesion(prefix) {
        const cNombre = document.getElementById(prefix+'_cuadro').value;
        const ini = parseInt(document.getElementById(prefix+'_inicio').value);
        const fin = parseInt(document.getElementById(prefix+'_fin').value);

        if(!cNombre || isNaN(ini)) return alert("Faltan datos obligatorios.");
        const cObj = DB.cuadros.find(x => x.nombre === cNombre);
        
        let aNombre, jNombre, modo, tarea, totalStaff;
        
        if (prefix === 'next') {
            aNombre = DB.sesion.nomActividad; jNombre = DB.sesion.jornada; modo = DB.sesion.modo; tarea = DB.sesion.tareaSize; totalStaff = DB.sesion.totalStaff;
        } else {
            aNombre = document.getElementById(prefix+'_act').value; jNombre = document.getElementById(prefix+'_jornada').value;
            modo = document.getElementById(prefix+'_modo').value; tarea = parseInt(document.getElementById(prefix+'_tarea_size').value) || 1;
            totalStaff = parseInt(document.getElementById('conf_total_staff').value) || 0;
        }
        
        const aObj = DB.actividades.find(x => x.desc === aNombre);

        DB.sesion = {
            idCuadro: cObj ? cObj.id : "??", nomCuadro: cNombre,
            idActividad: aObj ? aObj.id : "??", nomActividad: aNombre,
            jornada: jNombre, lado: document.getElementById(prefix+'_lado').value,
            modo: modo, tareaSize: tarea, inicio: ini, fin: fin, totalStaff: totalStaff,
            responsable: document.getElementById('conf_resp').value || DB.sesion?.responsable || "Admin",
            activo: true
        };
        
        if(prefix === 'conf') { DB.avance = []; DB.historial = []; DB.staff = []; }
        guardarTodo();
        irAlMapa();
    }

    function irAlMapa() {
        document.getElementById('viewSetup').classList.remove('open'); document.getElementById('modalNext').classList.remove('open'); document.getElementById('modalChange').classList.remove('open');
        document.getElementById('viewMain').classList.add('open');
        document.getElementById('disp_cuadro').innerText = `${DB.sesion.nomCuadro}`;
        document.getElementById('disp_act').innerText = DB.sesion.nomActividad;
        document.getElementById('disp_jornada').innerText = DB.sesion.jornada;
        document.getElementById('disp_rango').innerText = `Hileras ${DB.sesion.inicio} - ${DB.sesion.fin}`;
        renderMapa();
        if(!scanner) { scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }); scanner.render(onScan); }
    }

    // --- ESCANEO CONTINUO ---
    function onScan(id) {
        id = id.trim();
        let now = Date.now();
        if (lastScanTime[id] && (now - lastScanTime[id] < 3000)) return;
        lastScanTime[id] = now;

        let trabajador = DB.staff.find(s => s.id === id);
        let modoContinuo = document.getElementById('toggle_continuo').checked;

        if(trabajador && trabajador.fila) {
            // Si ya trabaja, cerramos su fila
            cerrarTarea(trabajador);
            
            // SI ESTÁ EN MODO CONTINUO, ASIGNAMOS LA SIGUIENTE INMEDIATAMENTE
            if(modoContinuo) {
                asignarNuevaTarea(trabajador);
                audioBeep.play(); // Doble beep o distinto idealmente, aqui simple
            } else {
                alert(`⏸️ ${id} pausado/terminado.`);
                audioBeep.play();
            }
        } else {
            // Si no trabaja, asignamos nueva
            if(!trabajador) { trabajador = { id: id, fila: null }; DB.staff.push(trabajador); }
            asignarNuevaTarea(trabajador);
            audioBeep.play();
        }
        guardarTodo();
        renderMapa();
    }

    function cerrarTarea(trabajador) {
        let regs = DB.avance.filter(a => a.obrero === trabajador.id && !a.fin);
        regs.forEach(r => { r.fin = new Date().toLocaleTimeString(); r.ts_fin = Date.now(); });
        trabajador.fila = null;
    }

    function asignarNuevaTarea(trabajador) {
        let filaInicio = 0, filasAsignadas = [];
        if (DB.sesion.modo === 'PAREJAS') {
            for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
                let activos = DB.avance.filter(a => a.fila === i && !a.fin).length;
                if(activos < 2) { filaInicio = i; filasAsignadas = [i]; break; }
            }
        } else {
            let size = DB.sesion.tareaSize;
            for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
                if ((i + size - 1) > DB.sesion.fin) continue;
                let bloqueLibre = true;
                for(let k=0; k<size; k++) if(DB.avance.some(a => a.fila === (i+k))) { bloqueLibre=false; break; }
                if(bloqueLibre) { filaInicio = i; for(let k=0; k<size; k++) filasAsignadas.push(i+k); break; }
            }
        }
        if(filasAsignadas.length > 0) {
            trabajador.fila = filaInicio;
            filasAsignadas.forEach(f => {
                DB.avance.push({
                    fila: f, obrero: trabajador.id, inicio: new Date().toLocaleTimeString(), ts_inicio: Date.now(), fin: null,
                    idCuadro: DB.sesion.idCuadro, nomCuadro: DB.sesion.nomCuadro, idActividad: DB.sesion.idActividad, jornada: DB.sesion.jornada, lado: DB.sesion.lado
                });
            });
        } else alert("⚠️ Rango lleno.");
    }

    // --- MASIVOS ---
    function abrirSiguienteCuadro() { document.getElementById('modalNext').classList.add('open'); }
    function ejecutarSiguienteCuadro() { moverMasivo('next'); }
    function abrirCambioActividad() { document.getElementById('chg_jornada').value = DB.sesion.jornada; document.getElementById('modalChange').classList.add('open'); }
    function ejecutarCambioTotal() { moverMasivo('chg'); }

    function moverMasivo(prefix) {
        if(!confirm("¿Mover a todos?")) return;
        let ahora = new Date().toLocaleTimeString(), ts = Date.now();
        DB.avance.forEach(a => { if(!a.fin) { a.fin = ahora; a.ts_fin = ts; } });
        DB.historial = DB.historial.concat(DB.avance);
        DB.avance = [];
        
        configurarSesion(prefix);
        DB.staff.sort((a, b) => (a.fila || 0) - (b.fila || 0)); // Ordenar por fila anterior
        
        let moved = 0;
        DB.staff.forEach(s => { 
            // IMPORTANTE: Movemos a todos los que estaban en la lista de Staff (hayan terminado o no el cuadro anterior)
            s.fila = null; asignarNuevaTarea(s); moved++;
        });
        
        alert(`✅ ${moved} personas movidas.`);
        guardarTodo();
        renderMapa();
    }

    // --- EDITOR ---
    function abrirEditor() {
        const list = document.getElementById('editorList'); list.innerHTML = "";
        const activos = DB.avance.filter(a => !a.fin);
        if(activos.length === 0) list.innerHTML = "<p>Nadie activo.</p>";
        activos.forEach((rec) => {
            let realIdx = DB.avance.indexOf(rec);
            list.innerHTML += `<div class="edit-item"><div><b>${rec.obrero}</b><br><small>Fila: ${rec.fila}</small></div><div><button class="btn btn-sm btn-b" onclick="cambiarFilaManual(${realIdx})">CAMBIAR</button><button class="btn btn-sm btn-r" onclick="borrarRegistro(${realIdx}, '${rec.obrero}')">BORRAR</button></div></div>`;
        });
        document.getElementById('modalEditor').classList.add('open');
    }
    function cambiarFilaManual(idx) { let n = prompt("Nueva fila:"); if(n && !isNaN(n)) { DB.avance[idx].fila = parseInt(n); guardarTodo(); abrirEditor(); renderMapa(); } }
    function borrarRegistro(idx, id) { if(confirm("¿Borrar?")) { DB.avance.splice(idx, 1); let st=DB.staff.find(s=>s.id===id); if(st)st.fila=null; guardarTodo(); abrirEditor(); renderMapa(); } }

    // --- CIERRE ---
    function finalizarDia() {
        if(!confirm("🛑 ¿FINALIZAR DÍA?")) return;
        let ahora = new Date().toLocaleTimeString(), ts = Date.now();
        DB.avance.forEach(a => { if(!a.fin) { a.fin = ahora; a.ts_fin = ts; } });
        DB.historial = DB.historial.concat(DB.avance);
        DB.avance = [];
        descargarReporte('ASISTENCIA');
        setTimeout(() => location.reload(), 2000);
    }

    function renderMapa() {
        const grid = document.getElementById('mapGrid'); grid.innerHTML = "";
        let terminadas = new Set(); DB.avance.forEach(a => { if(a.fin) terminadas.add(a.fila); });
        
        // Calculo de Asistencia Total vs Esperada
        let presentes = DB.staff.length; // Total de gente que ha pasado lista hoy
        document.getElementById('stat_active').innerText = `${presentes}/${DB.sesion.totalStaff || '?'}`;

        for(let i = DB.sesion.inicio; i <= DB.sesion.fin; i++) {
            let div = document.createElement('div'); div.className = "row-item";
            let gente = DB.avance.filter(a => a.fila === i && !a.fin).map(a => a.obrero);
            div.innerHTML = `<span>${i}</span>`;
            if(terminadas.has(i) && !gente.length) div.className += " done";
            else if(gente.length) { div.className += " active"; div.innerHTML += `<span class="row-tag">${gente.join(',')}</span><div class="badge">${gente.length}</div>`; }
            grid.appendChild(div);
        }
        let total = DB.sesion.fin - DB.sesion.inicio + 1;
        document.getElementById('stat_done').innerText = Math.round((terminadas.size/total)*100) + "%";
    }

    function guardarTodo() {
        localStorage.setItem('v35_sesion', JSON.stringify(DB.sesion));
        localStorage.setItem('v35_avance', JSON.stringify(DB.avance));
        localStorage.setItem('v35_historial', JSON.stringify(DB.historial));
        localStorage.setItem('v35_staff', JSON.stringify(DB.staff));
    }

    function descargarReporte(tipo) {
        let data = DB.historial.concat(DB.avance);
        let csv = "CREDENCIAL,ID_CUADRO,ID_ACTIVIDAD,JORNADA,HORA_ENTRADA,HORA_SALIDA\n";
        let unicos = []; 
        data.forEach(r => { let k = `${r.obrero}|${r.idCuadro}|${r.idActividad}|${r.jornada}`; if(!unicos.includes(k)) unicos.push(k); });
        unicos.forEach(k => {
            let p = k.split('|');
            let recs = data.filter(r => r.obrero==p[0] && r.idCuadro==p[1] && r.jornada==p[3]);
            recs.sort((a,b) => a.ts_inicio - b.ts_inicio);
            let ent = recs[0].inicio, sal = recs[recs.length-1].fin || "ACTIVO";
            csv += `${p[0]},${p[1]},${p[2]},${p[3]},${ent},${sal}\n`;
        });
        let b = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
        let l = document.createElement("a"); l.href = URL.createObjectURL(b); l.download = `ASISTENCIA_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`; l.click();
    }
</script>
